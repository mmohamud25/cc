{q:"Which network monitoring tool captures network traffic at the packet level for detailed protocol analysis?",o:["NetFlow analyzer", "Packet analyzer / network sniffer (e.g., Wireshark, tcpdump)", "SIEM", "Port scanner"],a:1,d:4,e:"Packet analyzers (sniffers) capture raw network frames and decode protocol fields at every layer. Used for: troubleshooting network issues, security forensics, protocol analysis, and detecting unencrypted credentials. In security context, defenders use them to analyze suspicious traffic; attackers use them to capture credentials on unencrypted networks."},
{q:"Which technology creates a software-defined perimeter where network resources are invisible until authenticated?",o:["Traditional VPN", "Software-Defined Perimeter (SDP) / Zero Trust Network Access (ZTNA)", "DMZ architecture", "Network segmentation"],a:1,d:4,e:"SDP/ZTNA makes network resources completely dark — invisible to unauthenticated users. Users authenticate first, then receive access only to specific authorized resources, not the full network. This is the evolution beyond VPN: instead of 'connect to network, then access everything,' SDP provides 'authenticate, receive access only to what you need.'"},
{q:"Which wireless protocol flaw allows an attacker to force a client to use a weaker encryption algorithm?",o:["WPA3 SAE vulnerability", "KRACK attack on WPA2", "Downgrade attack forcing WPA2 to use TKIP instead of CCMP/AES", "WEP IV collision"],a:2,d:4,e:"WPA2 downgrade attacks can force use of TKIP (RC4-based, vulnerable) instead of CCMP/AES. Network configuration requiring CCMP/AES only prevents downgrade. KRACK (Key Reinstallation Attack) exploits the WPA2 handshake differently. WPA3 eliminates these vulnerabilities with SAE (Simultaneous Authentication of Equals)."},
{q:"Which IPv6 feature automatically assigns link-local addresses without a DHCP server?",o:["DHCPv6", "SLAAC — Stateless Address Autoconfiguration", "IPv6 NAT", "Router Advertisement"],a:1,d:4,e:"SLAAC allows IPv6 devices to automatically generate addresses from the network prefix in Router Advertisements combined with the device's MAC address (EUI-64). Security implication: devices may have unexpected IPv6 connectivity even in environments configured for IPv4 only. Network monitoring must cover IPv6 traffic."},
{q:"Which firewall architecture places the firewall between the internet and the DMZ, and another firewall between the DMZ and the internal network?",o:["Single firewall with DMZ", "Screened subnet / dual-firewall DMZ architecture", "Packet filter only", "Host-based firewalls only"],a:1,d:4,e:"The screened subnet uses two firewalls: the outer firewall controls internet-to-DMZ traffic, the inner firewall controls DMZ-to-internal traffic. If a DMZ server is compromised, the attacker faces a second firewall to reach internal systems. This defense in depth limits the impact of DMZ compromise."},
{q:"Which protocol securely synchronizes time across network devices, critical for log correlation and certificate validity?",o:["NTP (Network Time Protocol) with authentication / NTPsec", "SNMP", "DNS", "DHCP"],a:0,d:4,e:"NTP with authentication (MD5 or autokey) prevents NTP amplification attacks and time injection attacks. Accurate, authenticated time is critical for: log correlation across systems (events must have consistent timestamps), certificate validity checking (expired certs must be detected), and Kerberos tickets (5-minute tolerance)."},
{q:"Which network attack exploits misconfigured VLAN configurations to access traffic in other VLANs?",o:["MAC flooding", "VLAN hopping — using switch spoofing or double tagging to reach unauthorized VLANs", "ARP spoofing", "STP manipulation"],a:1,d:4,e:"VLAN hopping uses switch spoofing (attacker pretends to be a trunk port) or double tagging (adds a second VLAN tag that the first switch strips, leaving the second tag to deliver the packet to a target VLAN). Mitigations: disable auto-trunking on access ports, use dedicated native VLANs with no user traffic."},
{q:"A security engineer wants to inspect encrypted HTTPS traffic for malware. The BEST technical approach is:",o:["Block all HTTPS traffic", "TLS inspection proxy — decrypts, inspects, re-encrypts using a trusted internal CA certificate", "Deploy signature-based IDS inline", "Use network flow analysis only"],a:1,d:4,e:"TLS inspection proxies (SSL inspection) are the only way to inspect encrypted content. The proxy presents a certificate signed by an internal CA (deployed to all clients) to the client, while establishing real TLS with the server. This enables malware detection in encrypted channels. Privacy and legal considerations require user notification."},
{q:"Which network security principle states that outbound traffic should also be filtered, not just inbound?",o:["Ingress filtering only", "Egress filtering — filtering outbound traffic to prevent data exfiltration and stop spoofed packets", "NAT-based security", "Defense in depth for routing"],a:1,d:4,e:"Egress filtering is often neglected. It prevents: data exfiltration (blocking large outbound transfers to unknown IPs), C2 communication (blocking outbound connections to malware domains), and source IP spoofing (ISPs filtering outbound traffic with source IPs not belonging to their customers — preventing reflection attacks)."},
{q:"Which attack targets the web browser's same-origin policy by making authenticated requests to a target site from a malicious site the victim is visiting?",o:["Cross-Site Scripting (XSS)", "Cross-Site Request Forgery (CSRF)", "SQL injection", "Clickjacking"],a:1,d:4,e:"CSRF exploits the browser's automatic inclusion of cookies in requests. When an authenticated user visits a malicious site, the malicious JavaScript sends requests to the target site — the browser automatically includes the session cookie. CSRF tokens (random values that must be in both cookie and request body) prevent this."},
{q:"Which tool is used to test whether specific ports are open on a target system?",o:["Vulnerability scanner", "Password cracker", "Port scanner (e.g., nmap)", "Packet analyzer"],a:2,d:4,e:"Port scanners probe target systems to determine which ports are accepting connections. Open ports indicate running services. Defenders use port scanners to verify firewall rules and discover unauthorized services. Attackers use them for reconnaissance to identify attack vectors. Port scanning without authorization may violate laws."},
{q:"Which network device provides both routing and security policy enforcement between network segments?",o:["Hub", "Switch", "Layer 3 switch without security features", "Firewall or security gateway"],a:3,d:4,e:"Firewalls and security gateways combine routing (forwarding packets between networks) with security policy enforcement (allowing/blocking based on rules). Modern NGFWs add application awareness, IPS, and user identity. Unlike a pure L3 switch which routes based on efficiency, a firewall routes based on security policy."},
{q:"An organization uses private IP addresses internally and one public IP externally. Traffic appears to come from a single IP to external observers. This is:",o:["Split tunneling", "PAT — Port Address Translation (many-to-one NAT)", "VLAN configuration", "Proxy deployment"],a:1,d:4,e:"PAT (Port Address Translation), also called NAT overload, maps many internal private IP:port combinations to one public IP with different port numbers. External systems see all traffic coming from one IP. This conserves public IP addresses and provides a degree of obscurity about internal network structure."},
{q:"Which wireless security mechanism uses a centralized RADIUS server for user authentication instead of a shared passphrase?",o:["WPA2-Personal (PSK)", "WPA2/3-Enterprise with 802.1X", "WEP", "Open authentication"],a:1,d:4,e:"WPA2/3-Enterprise uses 802.1X authentication against a RADIUS server. Each user has unique credentials (username/password or certificate). This provides individual accountability (who connected when), centralized credential management (revoke one user's access without changing the passphrase), and stronger authentication than PSK."},
{q:"Which type of network monitoring generates alerts when traffic patterns deviate significantly from established baselines?",o:["Signature-based detection", "Anomaly-based / behavioral detection", "Protocol analysis", "Static rule matching"],a:1,d:4,e:"Anomaly detection establishes statistical baselines and alerts on significant deviations — a server suddenly sending 100GB externally, a user account authenticating from 5 countries in one hour, an unusual spike in DNS queries. This catches novel attacks without signatures. Higher false positive rate than signature detection but catches unknown threats."},
{q:"Which attack sends more data than a buffer can hold, potentially overwriting adjacent memory and executing arbitrary code?",o:["SQL injection", "Buffer overflow attack", "Cross-site scripting", "Directory traversal"],a:1,d:4,e:"Buffer overflows write beyond allocated memory, potentially overwriting return addresses to redirect execution to attacker-supplied code. Mitigations: input validation, bounds checking, ASLR (address space layout randomization), DEP/NX (data execution prevention), stack canaries, and memory-safe programming languages."},
{q:"A network administrator wants to ensure that network devices only accept management connections from the dedicated management network. This is implemented using:",o:["VPN for all management", "Management ACLs / control plane policing restricting management access to authorized IPs only", "Strong passwords", "Multi-factor authentication"],a:1,d:4,e:"Management ACLs restrict which source IPs can establish SSH, SNMP, or web management connections to network devices. Only the dedicated management VLAN/subnet is permitted. This ensures even an attacker inside the network cannot reach device management interfaces from production VLANs, limiting their ability to modify network configurations."},
{q:"Which security technology continuously monitors endpoint processes, network connections, and file changes for malicious behavior?",o:["Antivirus with signature updates", "EDR — Endpoint Detection and Response", "Host-based firewall", "DLP agent"],a:1,d:4,e:"EDR provides continuous endpoint monitoring and recording. It captures process creation, network connections, file modifications, and registry changes. When malicious behavior is detected, EDR provides investigation capabilities (process trees, timelines) and automated response (isolation, process termination). Traditional AV reacts to files; EDR detects behaviors."},
{q:"Which network protocol provides encrypted management access to network infrastructure and is preferred over Telnet?",o:["HTTP management", "SNMP v2c", "SSH (Secure Shell)", "TFTP"],a:2,d:4,e:"SSH (port 22) encrypts all management communications including credentials and commands. Telnet (port 23) transmits everything in plaintext — credentials can be captured with a packet sniffer. All network device management should use SSH. Telnet should be disabled completely on modern infrastructure."},
{q:"Which attack intercepts a session after authentication, allowing the attacker to use the victim's established session without needing credentials?",o:["Credential stuffing", "Phishing", "Session hijacking", "Man-in-the-browser"],a:2,d:4,e:"Session hijacking steals session tokens (cookies, session IDs) after a user has authenticated. The attacker doesn't need credentials — just the valid session token. Methods: XSS to steal cookies, network sniffing on unencrypted connections, predictable session IDs. Defenses: HTTPS everywhere, HttpOnly cookies, session token rotation."},
{q:"What is the primary security benefit of network microsegmentation compared to traditional VLAN segmentation?",o:["Lower cost", "Granular policies between individual workloads prevent lateral movement — a compromise in one workload doesn't automatically reach adjacent workloads", "Simpler administration", "Better performance"],a:1,d:4,e:"Traditional VLANs create large zones where all hosts within a VLAN can communicate freely. Microsegmentation applies per-workload policies — even workloads in the same VLAN face individual security controls. This limits lateral movement: an attacker who compromises a web server can only communicate with the specific database it's allowed to reach, not all servers in the tier."},
{q:"Which DNS security feature prevents unauthorized zone transfers from exposing all hostnames in a DNS zone?",o:["DNSSEC", "ACLs restricting zone transfers to authorized secondary DNS servers only", "DNS filtering", "TTL management"],a:1,d:4,e:"DNS zone transfers (AXFR) replicate all DNS records to secondary servers. Without restrictions, any host can request a full zone transfer, revealing all internal hostnames and IP mappings — a valuable reconnaissance tool for attackers. Zone transfer ACLs limit transfers to only authorized secondary DNS server IPs."},
{q:"Which network security concept describes treating every user and device as potentially compromised regardless of their network location?",o:["Perimeter security", "Zero trust — never trust, always verify regardless of location", "Defense in depth", "Network segmentation"],a:1,d:4,e:"Zero trust eliminates the concept of a trusted internal network. Whether a request comes from inside the office or from a coffee shop, it receives the same scrutiny: identity verification, device health check, and authorization for the specific requested resource. This model emerged because perimeter breaches routinely lead to complete internal network compromise."},
{q:"Which attack specifically targets CPU and memory resources of a server by sending many resource-intensive but valid requests?",o:["Volumetric DDoS", "Application-layer DoS (e.g., Slowloris, ReDoS)", "Fragmentation attack", "Amplification attack"],a:1,d:4,e:"Application-layer DoS attacks send valid requests that consume disproportionate server resources. Slowloris keeps HTTP connections open by sending partial requests, exhausting connection pool limits with minimal bandwidth. ReDoS sends regex patterns that cause catastrophic backtracking. These are hard to filter because individual requests look legitimate."},
{q:"Which mechanism ensures that an email gateway can validate that received emails actually originated from the claimed domain?",o:["TLS encryption of email in transit", "SPF, DKIM, and DMARC working together — authorizing senders, signing messages, and specifying policy", "PGP encryption", "S/MIME certificates"],a:1,d:4,e:"The email authentication trilogy: SPF (authorizes which servers can send for a domain), DKIM (adds a digital signature proving the message came from the domain and wasn't modified), DMARC (specifies what to do when SPF/DKIM fail — reject, quarantine, or allow — and provides reporting). All three together provide comprehensive protection."},
{q:"Which incident response activity uses attack simulation data to improve detection capabilities?",o:["Forensic analysis", "Purple teaming / adversary simulation informing detection engineering", "Vulnerability scanning", "Change management"],a:1,d:5,e:"Detection engineering uses purple team findings to build better detection rules. When red team reveals that a specific attack technique wasn't detected, security engineers create SIEM rules, EDR behavioral detections, or network signatures to catch that technique. This creates a continuous improvement loop for detection capability."},
{q:"A security analyst correlates: successful VPN login → immediate large file download → upload to external cloud storage. This most likely indicates:",o:["Normal remote work behavior", "Data exfiltration — credential compromise followed by systematic data theft", "A backup process", "IT department maintenance"],a:1,d:5,e:"This sequence is a classic data theft pattern: obtain credentials (phishing/credential stuffing), authenticate remotely (VPN), quickly download sensitive data, exfiltrate to attacker-controlled storage. DLP, UEBA, and network monitoring that correlate these events across systems detect this pattern even when each individual action seems routine."},
{q:"Which security operations practice involves reviewing all changes made to production systems to ensure they were authorized?",o:["Incident response", "Change management audit — verifying all changes have approved change records", "Vulnerability assessment", "Threat hunting"],a:1,d:5,e:"Change management audits compare actual system changes (from configuration monitoring, system logs, or change detection tools) against approved change records. Unauthorized changes — either malicious (attacker modifications) or negligent (undocumented admin changes) — are identified. This prevents configuration drift and detects attacker persistence mechanisms."},
{q:"A SIEM rule generates 200 alerts per day but only 2 are true positives. The analyst should:",o:["Accept this as normal SIEM behavior", "Tune the rule to reduce false positives — adjust thresholds, add exceptions for known-good behavior, or combine with additional criteria", "Disable the rule entirely", "Investigate all 200 daily"],a:1,d:5,e:"A 1% true positive rate indicates the rule needs tuning. Effective alert tuning: add whitelist conditions for known-good sources, increase thresholds, combine with additional correlated events to raise confidence. The goal is high-fidelity alerts that analysts can realistically investigate. Untuned, noisy rules cause alert fatigue."},
{q:"Which operational security practice reduces the risk of credentials being captured from memory by malware?",o:["Longer passwords", "Credential Guard / LSA protection preventing credential extraction from LSASS memory", "Password complexity", "Frequent password rotation"],a:1,d:5,e:"Windows Credential Guard uses virtualization-based security to isolate credential storage from the main OS. Mimikatz and similar tools that extract credentials from LSASS memory cannot access the protected store. This directly counters the most common post-exploitation credential theft technique in Windows environments."},
{q:"Which security operations activity ensures that security tools and controls are functioning as expected?",o:["Threat hunting", "Control validation / security control testing — verifying controls actually work", "Incident response", "Change management"],a:1,d:5,e:"Control validation tests whether security controls actually perform their intended function. Does the DLP rule actually block credit card numbers in emails? Does the EDR alert on known attack patterns? Security controls that appear configured but don't actually work provide false assurance. Regular testing validates operational effectiveness."},
{q:"A new threat intelligence report describes a specific malware family's indicators. The FIRST technical action is:",o:["Rebuild all systems", "Block known bad IPs and hashes at the firewall and EDR, then search historical logs for past exposure", "Send awareness email to all employees", "Update antivirus signatures only"],a:1,d:5,e:"Operationalizing threat intelligence: immediately block known IoCs (IP addresses, domains, file hashes) at security controls. Then retroactively search logs to determine if these indicators appeared before today — the organization may already be compromised. Finally, update detection rules to catch future attempts. This converts intelligence into defensive action."},
{q:"Which forensic principle states that the first responder must prioritize preserving evidence over restoring services?",o:["Evidence primacy in digital forensics", "Chain of custody preservation", "Forensic sound collection — avoiding modification of original evidence", "Legal hold"],a:2,d:5,e:"Forensically sound collection means: document the scene before touching anything, use write blockers when imaging disks, capture volatile data (RAM) before shutdown, hash all collected media to prove integrity. Restoring services without preserving evidence first can destroy forensic data and undermine legal proceedings."},
{q:"Which log type would BEST help identify a web application SQL injection attack?",o:["Network flow logs", "Web application access logs and database query logs showing unusual SQL patterns", "Physical access logs", "Authentication logs"],a:1,d:5,e:"Web application and database logs capture: request parameters (where SQL injection payloads appear), database query errors (revealing injection attempts), unusual query patterns (OR 1=1 type syntax), and data volumes (large result sets indicating extraction). WAF logs add additional detail on blocked/detected injection attempts."},
{q:"Security metrics reported to the board should focus on:",o:["Number of firewall rules", "Vulnerability counts by CVSS score", "Business risk exposure, compliance status, and security program effectiveness trends", "Number of security tools deployed"],a:2,d:5,e:"Board-level metrics communicate business context: what is our financial risk exposure? Are we meeting regulatory requirements? Is our security posture improving? How do we compare to industry benchmarks? Technical metrics (CVE counts, patch rates) are operational; boards need strategic risk-level information to make resource decisions."},
{q:"Which practice ensures that security monitoring continues during planned maintenance windows?",o:["Disabling alerts during maintenance to reduce noise", "Maintaining monitoring with suppression only for expected changes — unexplained alerts during maintenance still require investigation", "Pausing all security monitoring during maintenance", "Increasing alert thresholds uniformly"],a:1,d:5,e:"Maintenance windows are actually high-risk periods — attackers know about scheduled windows and may time attacks for when defenders are distracted with maintenance. Continue monitoring and alert on unexpected activity. Suppress only specific expected changes (e.g., a planned server reboot). Investigate alerts that don't match the maintenance change record."},
{q:"Which security operations function maps detected attacker activities to standardized tactics and techniques?",o:["Vulnerability management", "Threat intelligence platform", "ATT&CK mapping — correlating observed behaviors to MITRE ATT&CK framework", "Security awareness"],a:2,d:5,e:"MITRE ATT&CK provides a structured knowledge base of attacker tactics, techniques, and procedures observed in real attacks. Mapping detections to ATT&CK reveals coverage gaps (which techniques have no detection?), improves incident reporting (using common language), and guides security investments (building detection for high-frequency techniques)."},
{q:"A security team discovers that an attacker has maintained access for 3 months. Before beginning eradication, they should:",o:["Immediately reimage all systems", "Fully scope the compromise — identify all affected systems, persistence mechanisms, and data accessed — to ensure complete eradication", "Restore from 3-month-old backups", "Disconnect all network access immediately"],a:1,d:5,e:"Rushed eradication of a long-term compromise leads to reinfection. After 3 months, the attacker has had time to establish multiple persistence mechanisms across many systems. Scope the full compromise first — identify every backdoor, every compromised account, every affected system — then execute coordinated eradication of everything simultaneously."},
{q:"Which security operations practice involves simulating specific attack techniques against production systems to test detection capabilities?",o:["Vulnerability scanning", "Atomic red team / adversary simulation testing detection rules", "Penetration testing only", "Threat hunting"],a:1,d:5,e:"Atomic Red Team and similar tools execute specific attack techniques in a controlled manner to test whether security tools detect them. Unlike full pen tests, atomic tests isolate individual technique testing. Results answer: 'Does our EDR detect PowerShell encoded commands?' 'Does SIEM alert on this specific LSASS access pattern?' This validates detection coverage."},
{q:"Which regulation requires organizations to report data breaches affecting EU citizens to regulators within 72 hours?",o:["HIPAA", "CCPA", "PCI DSS", "GDPR Article 33"],a:3,d:5,e:"GDPR Article 33 requires notifying the supervisory authority within 72 hours of becoming aware of a personal data breach, 'where feasible.' If notification is delayed, the reason for delay must be provided. Article 34 requires notifying affected individuals when the breach is likely to result in high risk to their rights and freedoms."},
{q:"Which security control protects data on a device that is lost or stolen while the device is powered on and logged in?",o:["Full-disk encryption (FDE)", "MDM remote wipe", "Screen lock timeout combined with strong authentication", "Biometric authentication"],a:2,d:5,e:"FDE protects powered-off devices — once the device is on and authenticated, FDE doesn't help. For powered-on, logged-in devices, screen lock timeout + strong authentication limits exposure. Remote wipe via MDM can erase the device remotely. A combination of short screen lock timeout, strong PIN/biometric, and MDM remote wipe provides the best protection."},
{q:"Which security operations activity involves reviewing past security logs to find evidence of attacks that occurred before detection capabilities were in place?",o:["Incident response", "Retroactive threat hunting / retrospective analysis", "Vulnerability scanning", "Compliance auditing"],a:1,d:5,e:"Retroactive threat hunting searches historical logs using newly acquired threat intelligence or newly developed detection techniques. If you discover a threat actor used a specific technique and you just built a detection for it, you can run that detection against 6 months of historical logs to find past compromise you missed. This discovers breaches that evaded historical detection."},
{q:"Which information security principle should guide decisions about how long to retain security logs?",o:["Retain indefinitely for maximum visibility", "Balance storage costs against legal requirements, regulatory retention mandates, and investigation needs", "Delete logs after 30 days to protect privacy", "Retain only current year logs"],a:1,d:5,e:"Log retention decisions balance competing factors: compliance mandates (PCI DSS requires 1 year online/3 months immediately available; HIPAA requires 6 years), investigation needs (complex investigations may require 12+ months of history), litigation hold (legal proceedings may require preservation), and storage costs. Policy should specify retention periods by log type."},
{q:"Which security practice prevents attackers from using stolen valid session tokens after a user has logged out?",o:["Long session timeouts", "Server-side session invalidation on logout — rendering the token immediately unusable", "Client-side cookie deletion", "Password change on logout"],a:1,d:5,e:"Proper session termination invalidates the session token server-side immediately on logout. Client-side actions (clearing cookies) are insufficient — if an attacker already captured the token, it remains usable until server-side invalidation. Sessions should also have absolute timeout periods regardless of activity, preventing sessions from lasting indefinitely."},
{q:"Which data handling practice ensures sensitive information is not inadvertently included in system logs?",o:["Encrypting all logs", "Log sanitization / scrubbing — removing or masking sensitive data before it enters logs", "Restricting log access", "Storing logs offline"],a:1,d:5,e:"Logs frequently capture sensitive data inadvertently: passwords in URLs (GET parameters), credit card numbers in transaction logs, API keys in debug logs, PII in error messages. Log sanitization applies masks or redacts sensitive patterns before they're written. This prevents logs themselves from becoming a data breach source if attackers access logging infrastructure."},
{q:"Which process involves systematically testing an organization's ability to detect and respond to specific attack scenarios?",o:["Red team exercise", "Tabletop exercise", "Security control validation", "All represent testing approaches at different levels of realism and depth"],a:3,d:5,e:"Each approach tests at different levels: tabletop (discussion only, cheapest, least realistic), security control validation (specific technical tests, automated), red team exercises (realistic full-scope attacks, most expensive). Organizations should use all three: frequent automated validation, regular tabletops, and periodic red team exercises for comprehensive assurance."},
{q:"Which security principle ensures that security mechanisms are simple enough to be verified and understood?",o:["Defense in depth", "Economy of mechanism — simpler systems are easier to verify and have fewer vulnerabilities", "Security through obscurity", "Fail secure"],a:1,d:1,e:"Economy of mechanism advocates simplicity. Complex systems have more potential vulnerabilities, are harder to analyze, and more difficult to verify. Every added complexity introduces potential failure modes. Security designs should be as simple as possible while meeting requirements."},
{q:"The CIA triad component MOST affected by a DDoS attack is:",o:["Confidentiality", "Integrity", "Availability", "Non-repudiation"],a:2,d:1,e:"DDoS attacks overwhelm systems with traffic, making them unavailable to legitimate users. This directly attacks availability — the A in CIA. Confidentiality and integrity are not directly affected by availability attacks, though a DDoS could be a distraction for a simultaneous confidentiality attack."},
{q:"Which type of control is a security awareness poster in an office hallway?",o:["Technical preventive", "Physical deterrent", "Administrative detective", "Administrative deterrent"],a:3,d:1,e:"Posters are administrative deterrents — they discourage risky behavior by reminding employees of security policies and consequences. They are administrative (policy/education-based, not technical or physical hardware) and deterrent (discourage bad behavior rather than prevent or detect it)."},
{q:"A data breach notification law requires companies to notify customers within 72 hours. This is an example of:",o:["Voluntary security best practice", "Mandatory regulatory compliance requirement", "Industry standard", "Risk transfer"],a:1,d:1,e:"Breach notification laws impose mandatory legal obligations with specific timelines. GDPR Article 33 requires 72-hour supervisory authority notification. Non-compliance results in regulatory fines and penalties. These are legal requirements, not voluntary best practices — organizations must comply regardless of cost or inconvenience."},
{q:"Which security concept prevents a single administrator from having complete, unmonitored access to all systems?",o:["Least privilege", "Separation of duties with peer review and logging of privileged actions", "Defense in depth", "Need to know"],a:1,d:1,e:"Separation of duties combined with privileged action logging prevents unchecked admin access. No single admin should be able to modify systems without oversight. Peer review, approval workflows for sensitive changes, and comprehensive logging create accountability that deters insider abuse."},
{q:"Privacy by default means that the most privacy-protective settings are:",o:["Available as an option for users who choose them", "Automatically applied without requiring user action", "Only available to premium users", "Configurable by the organization"],a:1,d:1,e:"Privacy by default (GDPR Article 25) requires that by default, only the minimum necessary personal data is processed and it's not accessible to unlimited persons. Users should not need to actively choose privacy-protective settings — the default configuration must already provide maximum privacy protection."},
{q:"Which cryptographic algorithm is used to create a fixed-length digest that represents a variable-length message?",o:["RSA encryption", "AES-256", "Hash function (SHA-256)", "Diffie-Hellman"],a:2,d:1,e:"Hash functions produce a fixed-length digest (fingerprint) from any input size. SHA-256 always produces a 256-bit output regardless of input length. The same input always produces the same hash (deterministic), but different inputs produce different hashes (collision resistance). Used for integrity verification and password storage."},
{q:"An organization's security policy is considered which type of document?",o:["Technical standard", "Administrative control — a high-level statement of management intent", "Physical control", "Operational procedure"],a:1,d:1,e:"Security policies are administrative controls — they are management documents that express security intent, establish responsibilities, and mandate requirements. They do not specify technical implementation details (that's standards) or step-by-step procedures. Policies derive authority from executive leadership sponsorship."},
{q:"Which term describes the acceptable level of risk that an organization is willing to take in pursuit of its objectives?",o:["Risk threshold", "Risk capacity", "Risk appetite", "Residual risk"],a:2,d:1,e:"Risk appetite is a strategic concept — how much risk is the organization willing to accept as it pursues its goals? A startup may have a high risk appetite; a bank has a low one. Risk appetite drives security investment levels and determines when risks require treatment versus acceptance."},
{q:"Which privacy concept allows individuals to know what personal data an organization holds about them?",o:["Data portability", "Right of access / Subject Access Request (SAR)", "Data minimization", "Privacy by design"],a:1,d:1,e:"The right of access (GDPR Article 15) allows individuals to request a copy of all personal data held about them. Organizations must respond within 30 days. This transparency enables individuals to identify inaccuracies, verify lawful processing, and exercise other privacy rights. Subject Access Requests (SARs) implement this right."},
{q:"Which security control type directly prevents an attack from occurring rather than detecting or recovering from it?",o:["Detective control", "Corrective control", "Preventive control", "Compensating control"],a:2,d:1,e:"Preventive controls stop security events before they occur — firewalls block unauthorized access, encryption prevents eavesdropping, access controls prevent unauthorized resource use. They are the first line of defense. Detective controls identify events after they occur; corrective controls restore after incidents."},
{q:"Digital evidence admissibility in legal proceedings depends MOST on:",o:["The sophistication of the forensic tools used", "Maintaining a documented chain of custody and demonstrating evidence integrity through hashing", "The type of crime investigated", "The jurisdiction where the incident occurred"],a:1,d:1,e:"Evidence admissibility requires proving the evidence is authentic and unmodified. Chain of custody documentation tracks every person who handled evidence and when. Cryptographic hashing before and after analysis proves no modification occurred. Without these protections, defense attorneys can challenge evidence integrity."},
{q:"Which data protection technique replaces real data with a non-reversible substitute suitable for testing environments?",o:["Encryption", "Data masking — permanently replacing sensitive values with realistic but fictitious alternatives", "Tokenization", "Pseudonymization"],a:1,d:1,e:"Data masking creates permanent substitutions — the original value cannot be recovered from the masked value. This differs from encryption (reversible) and tokenization (mapping exists in a vault). Masked data is safe for development/testing environments because even if exfiltrated, it has no real-world value."},
{q:"Which security concept states that users should only know about systems and data directly relevant to their current work?",o:["Least privilege", "Defense in depth", "Need to know", "Separation of duties"],a:2,d:1,e:"Need to know limits information access beyond technical permissions. A security-cleared employee can only access specific classified programs they have a current need for — not all information at their clearance level. In non-government contexts, employees should know only what's relevant to their current task, even if policies would technically permit broader access."},
{q:"Residual risk after implementing controls should be:",o:["Eliminated completely", "Formally accepted if within risk tolerance, or treated further if it exceeds tolerance", "Ignored since controls are in place", "Always transferred through insurance"],a:1,d:1,e:"Residual risk — what remains after controls — must be formally evaluated. If it falls within the organization's risk tolerance, it can be formally accepted with documentation. If it exceeds tolerance, additional controls, risk avoidance, or risk transfer is required. No control eliminates risk to zero; acceptance of some residual risk is normal."},
{q:"Which term describes security controls that are applied because the primary control is unavailable or insufficient?",o:["Redundant control", "Detective control", "Compensating control", "Corrective control"],a:2,d:1,e:"Compensating controls substitute for primary controls when those controls cannot be implemented. PCI DSS formalizes this concept — if a specific requirement can't be met directly, an equivalent compensating control can be documented. The compensating control must provide equivalent or better protection than the primary control it replaces."},
{q:"Which security concept limits how much of the system architecture and design details should be needed to maintain security?",o:["Security through obscurity", "Kerckhoffs's principle / open design — security should not depend on secrecy of the design", "Defense in depth", "Minimization"],a:1,d:1,e:"Kerckhoffs's principle: a cryptosystem should remain secure even if everything about the system — except the key — is public knowledge. Broader open design principle: security should not depend on keeping the design secret. Public algorithms like AES are more trusted because public scrutiny finds and fixes weaknesses that secret algorithms hide."},
{q:"An organization classifies customer PII as 'Confidential.' This classification means:",o:["The data can be shared freely", "The data requires specific access controls, encryption, and handling procedures appropriate for its sensitivity", "Only the CEO can access it", "The data is publicly available"],a:1,d:1,e:"Data classification drives appropriate control selection. Confidential data requires: encryption at rest and in transit, access controls limiting exposure to authorized users, secure disposal procedures, and employee handling guidelines. Classification ensures controls are proportionate to sensitivity — neither over-protecting public data nor under-protecting sensitive data."},
{q:"Which concept describes potential harm from a threat successfully exploiting a vulnerability?",o:["Risk", "Threat", "Vulnerability", "Impact"],a:3,d:1,e:"Impact is the consequence or damage that results from a threat exploiting a vulnerability. High impact combined with high likelihood = critical risk. Impact categories include: financial loss, reputational damage, operational disruption, legal liability, and safety harm. Impact assessment quantifies what's at stake."},
{q:"Security champions in development teams primarily serve to:",o:["Replace security team reviews entirely", "Bridge the gap between security and development teams by embedding security knowledge and advocacy within dev", "Conduct all security testing", "Write security policies"],a:1,d:1,e:"Security champions are developers with security interest and training who act as security advocates within their teams. They help other developers write secure code, conduct initial code reviews for security issues, participate in threat modeling, and translate security requirements into practical development guidance."},
{q:"Which DR test is MOST appropriate for validating that failover actually works without disrupting production?",o:["Tabletop exercise", "Parallel test — activating the backup site while primary runs normally", "Full interruption test", "Document review"],a:1,d:2,e:"Parallel tests validate real backup site functionality while maintaining production availability. The backup site runs actual workloads, proving it can support operations. Unlike tabletop (discussion only), parallel tests validate technical capability. Unlike full interruption, they don't risk primary site availability during testing."},
{q:"An organization's RTO is 4 hours but their backup restoration process takes 6 hours. This means:",o:["The plan is adequate", "The RTO requirement is not met — additional investment in faster recovery technology is needed", "The RPO needs adjustment", "The backup frequency is insufficient"],a:1,d:2,e:"If restoration takes longer than RTO, the organization will exceed acceptable downtime. Resolution options: warm/hot site to eliminate restore time, faster backup media, incremental/continuous replication instead of periodic backups, or negotiating a longer RTO with business stakeholders. The gap between technical capability and business requirement must be closed."},
{q:"Which backup type has the FASTEST backup time but the SLOWEST restoration time?",o:["Full backup", "Differential backup", "Incremental backup", "Snapshot backup"],a:2,d:2,e:"Incremental backups run fastest because they only copy changes since the last backup of any type. Restoration is slowest because you need the last full backup plus every incremental in order. If you have weekly fulls and daily incrementals, a Friday failure requires restoring Sunday's full + Mon + Tue + Wed + Thu incrementals."},
{q:"A company identifies that their payroll system must be recovered within 2 hours with no more than 1 hour of data loss. These requirements are:",o:["RTO = 1 hour, RPO = 2 hours", "RTO = 2 hours, RPO = 1 hour", "MTD = 2 hours, MTTR = 1 hour", "SLA = 2 hours, backup frequency = 1 hour"],a:1,d:2,e:"RTO (Recovery Time Objective) = how fast systems must recover = 2 hours. RPO (Recovery Point Objective) = maximum data loss = 1 hour. These are the two primary BC/DR metrics. MTD is the absolute maximum tolerable downtime; RTO must be less than MTD."},
{q:"Tabletop exercises PRIMARILY identify:",o:["Technical recovery capability", "Gaps in plans, unclear responsibilities, outdated contact information, and process weaknesses through discussion", "Actual recovery time in practice", "System restoration procedures"],a:1,d:2,e:"Tabletop exercises reveal planning gaps that aren't visible from reading the plan. Through discussion of specific scenarios, teams discover: who actually has authority to declare a disaster, what happens when the primary contact is unavailable, which steps are unclear or missing, and where the plan doesn't reflect current reality."},
{q:"Which concept describes the additional time needed to process backlogs and return to full normal operations AFTER technical recovery?",o:["RTO", "MTD", "Work Recovery Time (WRT)", "MTTR"],a:2,d:2,e:"WRT is the time after technical recovery (RTO met) to catch up on work that accumulated during the outage. Total outage impact = RTO + WRT. If systems were down 2 hours and processing 2 hours of transaction backlog takes another hour, the full business impact window is 3 hours even though technical recovery took only 2."},
{q:"Which IR phase is most focused on understanding HOW the attacker got in and WHAT they did?",o:["Preparation", "Containment", "Detection and analysis", "Post-incident activity"],a:2,d:2,e:"Detection and analysis determines: Is this a real incident? How severe? How did it happen? What systems are affected? What did the attacker do? This phase drives the investigation that informs all subsequent phases. Thorough analysis enables targeted containment, complete eradication, and meaningful lessons learned."},
{q:"An organization's BCP should be tested by which method FIRST when establishing a new program?",o:["Full interruption test", "Parallel test", "Tabletop exercise then progress to more realistic tests", "Structured walkthrough"],a:2,d:2,e:"New BCP programs should start with tabletop exercises — lowest risk, easiest to conduct, reveals major planning gaps cheaply. Once the plan is refined through tabletops, progress to structured walkthroughs, then parallel tests, then potentially full interruption tests. Starting with full interruption tests risks production disruption before the plan is validated."},
{q:"Data backup integrity verification ensures:",o:["Backups complete on schedule", "The backup data is actually readable and restorable — not just that backup jobs completed without error", "Backups are encrypted", "Offsite storage is accessible"],a:1,d:2,e:"Backup completion notifications don't prove data integrity or restorability. Verification requires: restoring test data, checking file integrity (hash verification), and confirming the restore process works end-to-end. Many organizations discover their backups are corrupted only when they attempt restoration during a real disaster."},
{q:"Which term describes a documented list of critical contacts, vendors, and resources needed during a disaster?",o:["Change management record", "Call tree / emergency contact list in the DR plan", "Asset inventory", "Configuration management database"],a:1,d:2,e:"DR plans must include current emergency contact lists: key personnel, vendors, cloud providers, ISPs, hardware suppliers, and emergency services. Outdated contact information is one of the most common DR plan failures. Contact lists require regular maintenance — people change jobs, phone numbers change, vendors get acquired."},
{q:"Which tool automates the discovery and management of privileged accounts across an enterprise?",o:["Active Directory", "PAM solution (CyberArk, BeyondTrust, Delinea)", "SIEM", "IAM portal"],a:1,d:3,e:"PAM (Privileged Access Management) solutions discover privileged accounts across systems, vault credentials, enforce checkout workflows, record privileged sessions, and automatically rotate passwords. They address the highest-risk account tier by eliminating standing privileges and providing complete audit trails of all privileged activity."},
{q:"A user authenticating to an application by scanning their fingerprint on their phone is using which factor combination?",o:["Something you know + something you are", "Something you have (phone) + something you are (fingerprint)", "Something you are alone", "Something you have alone"],a:1,d:3,e:"Phone possession (something you have) combined with biometric verification (something you are) is two-factor authentication. The fingerprint verifies the authorized phone owner is present — preventing unauthorized use even if someone steals the phone. This is the basis of Apple Face ID and Android fingerprint for app authentication."},
{q:"Which access control vulnerability occurs when an application allows users to access other users' data by modifying an object reference in a URL?",o:["SQL injection", "Insecure Direct Object Reference (IDOR)", "XSS", "CSRF"],a:1,d:3,e:"IDOR occurs when user-controllable values (IDs, file names) are used to access objects without authorization checks. Changing account_id=123 to account_id=124 to view another user's account is classic IDOR. Proper authorization checks on every object access, not just entry points, prevent IDOR vulnerabilities."},
{q:"Which physical security control prevents unauthorized vehicles from parking in front of building exits?",o:["Security cameras", "No-parking zone enforcement with barriers", "Security guards", "Turnstiles"],a:1,d:3,e:"Physical barriers enforcing no-parking zones prevent vehicles from being used to block evacuation routes, stage attacks close to entrances, or block emergency vehicle access. Concrete planters, bollards, and jersey barriers serve this function while also providing aesthetic integration with the building exterior."},
{q:"Attribute-based access control policies are stored and evaluated by which component?",o:["Directory server", "Policy Decision Point (PDP) and Policy Enforcement Point (PEP)", "Firewall", "SIEM"],a:1,d:3,e:"ABAC architecture: Policy Decision Point (PDP) evaluates policies against attributes and returns permit/deny. Policy Enforcement Point (PEP) intercepts access requests, sends them to PDP, and enforces the decision. Policy Information Point (PIP) provides attribute values. This architecture separates policy logic from enforcement."},
{q:"Which term describes an access token that contains user claims and permissions encoded in the token itself rather than requiring database lookup?",o:["Opaque token", "Session cookie", "JWT (JSON Web Token) — self-contained bearer token", "SAML assertion"],a:2,d:3,e:"JWTs are self-contained — they encode claims (user ID, roles, expiration) directly in the token using base64 encoding with a cryptographic signature. The recipient can verify and decode the token without querying a database. This enables stateless authentication in distributed systems. The signature prevents tampering with claims."},
{q:"Which security principle prevents an application from persisting more data than needed for its immediate function?",o:["Data minimization", "Least privilege", "Need to know", "Privacy by design"],a:0,d:3,e:"Data minimization limits what is collected and stored. Applications should not log sensitive parameters, should discard data after its immediate use, and should not store more user data than required for the service. This reduces breach impact (less data exposed) and regulatory risk (less data to comply with)."},
{q:"Which concept in privileged access management ensures admin credentials are rotated after each use?",o:["Password complexity requirements", "Just-in-time access with automatic credential rotation", "Annual password changes", "MFA for admin accounts"],a:1,d:3,e:"Automatic post-use credential rotation ensures that even if an admin credential is captured during use, it's useless immediately after the session ends. PAM solutions implement this: check out a credential, use it, return it — the PAM system immediately rotates it. This makes credential theft nearly valueless."},
{q:"A security policy requires accounts to be disabled within 1 hour of termination. This addresses which risk?",o:["Password guessing", "Former employees retaining active access and using it maliciously after departure", "Account sharing", "Password reuse"],a:1,d:3,e:"Terminated employees with active accounts represent insider threat risk. Even well-intentioned departing employees may accidentally retain access; malicious former employees can cause significant damage. 1-hour revocation limits the window. Automated HR-to-IAM integration can achieve near-instant revocation."},
{q:"Which authentication approach verifies both the client and server in a TLS connection?",o:["Server-only authentication (standard TLS)", "Mutual TLS (mTLS) — both parties present certificates", "Certificate pinning", "OAuth 2.0"],a:1,d:3,e:"Mutual TLS requires both parties to present and validate certificates. Standard HTTPS only authenticates the server. mTLS adds client certificate authentication — the server verifies the client's identity. Used for API authentication, service-to-service communication in microservices, and high-security applications requiring strong client identity verification."},
{q:"Which concept ensures that shared workstations automatically lock and clear session data when users walk away?",o:["Screen saver password", "Session timeout + screen lock + clear-screen policy", "VPN enforcement", "Badge readers at workstations"],a:1,d:3,e:"Auto-lock policies trigger after defined inactivity periods. Clear-screen policies (part of clean desk) require locking screens when stepping away. Together they prevent unauthorized access to unattended sessions. Financial institutions and healthcare organizations typically require 5-10 minute auto-lock timeouts for regulatory compliance."},
{q:"Which physical control creates an audit trail of who accessed a specific area and when?",o:["Fences", "Access logs from electronic badge reader systems", "Security cameras alone", "Security guards alone"],a:1,d:3,e:"Electronic badge reader access logs record: badge ID, timestamp, door/area accessed, and access granted or denied. These logs enable: incident investigation (who was in the server room before the breach?), compliance reporting, anomaly detection (after-hours access), and security audits of access patterns."},
{q:"The primary security benefit of certificate-based authentication over password authentication is:",o:["Certificates are easier to remember", "Certificates cannot be phished — the private key never leaves the device and cryptographically binds to the requesting website", "Certificates expire automatically", "Certificates are cheaper to manage"],a:1,d:3,e:"Certificate-based auth uses the private key to sign challenges — the private key never travels the network and cannot be captured by phishing. Password-based auth requires transmitting the secret (even hashed), which can be captured. Hardware-backed certificates (TPM, smart card) further ensure the key cannot be exported even from a compromised device."},
{q:"Which access control failure allows one user to view or modify another user's resources by manipulating predictable identifiers?",o:["Privilege escalation", "Horizontal privilege escalation / IDOR — accessing another user's resources at the same privilege level", "Vertical privilege escalation", "Session hijacking"],a:1,d:3,e:"Horizontal privilege escalation accesses another user's data at the same privilege level (user accessing another user's account). Vertical privilege escalation gains higher privileges (user becoming admin). IDOR is the common technical vulnerability enabling horizontal escalation. Both require proper authorization checks on every resource access."},
{q:"Which security control continuously monitors and enforces that system configurations remain at their approved security baseline?",o:["Vulnerability scanner", "Configuration drift detection / Security configuration management", "Patch management", "Change management"],a:1,d:3,e:"Configuration drift detection tools continuously compare current system configurations against approved baselines. Any deviation — whether from unauthorized changes, patches, or attacker modifications — triggers alerts. Tools like SCAP, Chef, Puppet, and specialized SCM tools automate continuous baseline compliance checking."},
{q:"BYOD (Bring Your Own Device) security is BEST managed through:",o:["Banning all personal devices", "MDM/MAM solutions that containerize corporate data on personal devices without controlling personal use", "Only allowing approved apps", "Physical inspection of all devices"],a:1,d:3,e:"MDM (Mobile Device Management) or MAM (Mobile Application Management) creates a managed container for corporate apps and data on personal devices. Corporate data in the container is encrypted and subject to corporate policies. The rest of the device remains personal. If the device is lost or the employee leaves, the corporate container can be remotely wiped without affecting personal data."},
{q:"Which network attack technique uses legitimate cloud storage services or social media to host C2 infrastructure?",o:["DNS tunneling", "Living off the land / cloud-based C2", "BGP hijacking", "ARP spoofing"],a:1,d:4,e:"Attackers host C2 infrastructure on legitimate services (Dropbox, GitHub, Twitter, OneDrive) to blend malicious traffic with legitimate cloud service traffic. Security tools that allow cloud service traffic cannot block C2 without blocking legitimate business use. Domain reputation and behavioral analysis are needed to detect this."},
{q:"A firewall log shows thousands of connections from external IPs to internal hosts on port 445 (SMB). This MOST likely indicates:",o:["Normal file sharing activity", "External scanning or exploitation attempt against SMB — port 445 should not be accessible from the internet", "VPN traffic", "Web server traffic"],a:1,d:4,e:"SMB (port 445) should never be exposed to the internet. The WannaCry and NotPetya ransomware attacks exploited internet-facing SMB. Thousands of external connection attempts indicate either active scanning/exploitation or a misconfigured firewall. Immediate investigation and firewall rule correction are required."},
{q:"Which technique fragments network packets to evade intrusion detection systems?",o:["Port scanning", "Fragmentation attacks — splitting malicious payloads across multiple IP fragments that IDS fails to reassemble", "ARP poisoning", "DNS tunneling"],a:1,d:4,e:"Packet fragmentation splits payloads across multiple IP fragments. Some IDS systems check individual fragments but not reassembled packets, allowing attack payloads to pass undetected. Modern IDS/IPS with fragment reassembly capability mitigate this. Firewalls that enforce minimum fragment sizes and timeout orphaned fragments also help."},
{q:"Which DNS record type is used to identify mail servers responsible for accepting email for a domain?",o:["A record", "CNAME record", "MX (Mail Exchanger) record", "TXT record"],a:2,d:4,e:"MX records specify which mail servers accept incoming email for a domain and their priority order. When someone sends email to user@example.com, the sending server queries DNS for example.com's MX records. The server with the lowest priority number is tried first. MX records point to hostnames, which then resolve via A records."},
{q:"Which network security technology hides the internal network structure from external observers?",o:["SSL/TLS encryption", "NAT (Network Address Translation) combined with RFC 1918 private addressing", "Firewall ACLs", "VPN tunnels"],a:1,d:4,e:"NAT with private RFC 1918 addressing means all internal hosts appear as the single public IP address to external systems. External observers cannot determine how many internal systems exist, their IP addresses, or their arrangement. While not a security control per se, this provides valuable obscurity about internal network architecture."},
{q:"A web application returns HTTP 200 responses for failed login attempts rather than 401. This security misconfiguration:",o:["Improves user experience", "Potentially indicates insecure response handling that could enable user enumeration or bypass detection of brute force", "Complies with REST standards", "Has no security impact"],a:1,d:4,e:"Returning 200 for failed authentications instead of 401/403 can: confuse security tools looking for authentication failures, bypass rate limiting tied to error codes, and make login failure logs harder to correlate. Authentication failures should return appropriate HTTP error codes and be consistently logged for monitoring."},
{q:"Which network security control ensures that only authorized MAC addresses can connect to specific switch ports?",o:["802.1X", "Port security — limiting allowed MAC addresses per port", "DHCP snooping", "VLANs"],a:1,d:4,e:"Port security configures switches to allow only specific or limited numbers of MAC addresses on each port. Unknown MAC addresses trigger: port shutdown, traffic restriction, or SNMP alert. This prevents unauthorized devices from connecting to wired network ports and limits MAC flooding attacks."},
{q:"Which protocol enables network devices to automatically discover and communicate with neighboring devices and build network topology maps?",o:["SNMP", "CDP (Cisco Discovery Protocol) / LLDP (Link Layer Discovery Protocol)", "NTP", "Syslog"],a:1,d:4,e:"CDP (Cisco proprietary) and LLDP (IEEE 802.1AB standard) enable devices to advertise their capabilities and discover neighbors. Security concern: these protocols reveal network topology information. In high-security environments, disable CDP/LLDP on ports facing untrusted networks to prevent topology reconnaissance."},
{q:"Which technique allows an attacker to execute commands on a web server by uploading a script disguised as an image?",o:["SQL injection", "File upload attack — uploading a web shell disguised as a legitimate file type", "XSS", "Directory traversal"],a:1,d:4,e:"File upload attacks bypass client-side validation to upload executable scripts. A PHP web shell disguised as image.jpg can execute commands if the server processes it. Defenses: validate file type server-side (not just extension), store uploads outside the web root, use separate domain for user-generated content, and sanitize filenames."},
{q:"Which security mechanism prevents JavaScript on one domain from making requests to a different domain without explicit permission?",o:["HTTPS", "Same-origin policy (SOP) — browser security model restricting cross-domain requests", "CSP", "HSTS"],a:1,d:4,e:"The Same-Origin Policy prevents JavaScript from one origin (protocol+domain+port) from reading responses from a different origin. This prevents malicious sites from stealing data from other sites the user is authenticated to. CORS (Cross-Origin Resource Sharing) provides a controlled mechanism for legitimate cross-origin requests with explicit server permission."},
{q:"Which network architecture isolates internet-facing services from internal systems using two separate firewalls?",o:["Single DMZ with one firewall", "Screened subnet with dual firewalls — outer FW between internet and DMZ, inner FW between DMZ and internal", "Flat network with perimeter firewall only", "VLAN-based segmentation"],a:1,d:4,e:"Dual-firewall screened subnet: outer firewall controls internet↔DMZ traffic, inner firewall controls DMZ↔internal traffic. Two different firewall vendors/models adds diversity — a vulnerability in one vendor's product doesn't compromise both layers. A DMZ server compromise requires breaching the second firewall to reach internal systems."},
{q:"A security analyst notices outbound connections to IP addresses in 15 different countries from one internal server. This MOST likely indicates:",o:["Normal global business operations", "C2 beaconing or data exfiltration — a single server should not have connections to numerous foreign IPs", "CDN behavior", "Normal internet browsing"],a:1,d:4,e:"A server (not a user workstation) making connections to diverse foreign IPs is highly suspicious. Servers have defined external communication needs — database servers shouldn't browse the internet. This pattern suggests malware C2 beaconing (checking in with multiple backup C2 servers) or active data exfiltration."},
{q:"Which protocol provides network-level authentication and encryption for IP communications without requiring application changes?",o:["TLS", "IPsec — operates at the IP layer transparently to applications", "SSH", "HTTPS"],a:1,d:4,e:"IPsec operates at Layer 3, encrypting IP packets transparently. Applications require no modification — they communicate normally while IPsec handles encryption and authentication below. Compare to TLS which requires application-level support. IPsec is used for VPNs, securing infrastructure communications, and government networks requiring network-layer encryption."},
{q:"Which wireless security attack captures the authentication exchange to perform offline password cracking?",o:["Jamming", "4-way handshake capture followed by dictionary/brute force attack", "Evil twin", "Deauthentication DoS only"],a:1,d:4,e:"WPA2-Personal uses a 4-way handshake derived from the Pre-Shared Key. Capturing this handshake (by passively monitoring or forcing reconnection with deauth) enables offline dictionary attacks against the captured handshake. WPA3 uses SAE (Simultaneous Authentication of Equals) which is resistant to offline dictionary attacks."},
{q:"Which tool is commonly used to test web application security by intercepting and modifying HTTP/HTTPS requests between browser and server?",o:["Nmap", "Wireshark", "Burp Suite — web application security testing proxy", "Nessus"],a:2,d:4,e:"Burp Suite is the industry-standard web application security testing tool. It proxies web traffic, allowing security testers to intercept, inspect, and modify requests and responses. Used for: manual testing, automated scanning, testing authentication bypass, finding injection vulnerabilities, and understanding application behavior."},
{q:"Which attack targets the availability of DNS infrastructure to make entire domains unreachable?",o:["DNS cache poisoning", "DDoS against DNS resolvers/authoritative servers — making domain resolution fail", "DNS tunneling", "DNS hijacking"],a:1,d:4,e:"DDoS against DNS infrastructure targets the availability of the DNS resolution chain. If authoritative DNS servers for a domain are overwhelmed, no one can resolve that domain's hostnames — effectively taking down all services. Anycast DNS deployment, rate limiting, and DDoS mitigation services protect DNS infrastructure availability."},
{q:"Which security concept describes the practice of running applications in isolated environments to limit the impact of compromise?",o:["Least privilege", "Sandboxing / application isolation", "Defense in depth", "Microsegmentation"],a:1,d:5,e:"Sandboxing confines applications to isolated environments where they cannot affect other parts of the system. If a sandboxed app is compromised, the attacker is contained within the sandbox. Used for: malware analysis (execute malware safely), browser security (tabs isolated from OS), and mobile app security (apps isolated from each other)."},
{q:"Which IR activity ensures that an organization's security posture is measurably improved after each incident?",o:["Incident documentation", "Post-incident improvement tracking — verifying that recommended controls are actually implemented", "Forensic evidence preservation", "Legal reporting"],a:1,d:5,e:"Post-incident improvements must be tracked to completion. Many organizations conduct lessons-learned but fail to implement recommended changes. Tracking ensures identified gaps are assigned owners, given timelines, and verified as completed. This creates a measurable improvement cycle where each incident makes the organization more resilient."},
{q:"Which concept describes security information that enables defenders to anticipate and prepare for attacks before they occur?",o:["Retrospective analysis", "Threat intelligence — information about current and emerging threats, threat actors, and their TTPs", "Incident response", "Vulnerability scanning"],a:1,d:5,e:"Threat intelligence provides advance warning and context: which threat actors target your industry, what techniques they use, current attack campaigns, and indicators of compromise. This enables proactive defense — patching vulnerabilities before exploitation, blocking known C2 infrastructure, and tuning detection for expected attack techniques."},
{q:"A security operations team maintains 24/7 coverage. This is PRIMARILY to:",o:["Satisfy compliance requirements", "Detect and respond to security incidents in real time regardless of when they occur — attackers don't keep business hours", "Reduce costs by sharing resources", "Monitor employee productivity"],a:1,d:5,e:"24/7 SOC coverage exists because attacks happen at any hour. Ransomware often deploys on Friday evenings or holidays when response capability is reduced. After-hours detection and response significantly limits damage. Each hour of undetected attacker access exponentially increases breach impact."},
{q:"Which process ensures that security tools are properly configured to detect the specific threats relevant to an organization?",o:["Vendor installation", "Detection engineering / security tool tuning aligned with the threat landscape", "Compliance scanning", "Penetration testing"],a:1,d:5,e:"Detection engineering is the practice of building and maintaining detection content (SIEM rules, EDR behavioral signatures, anomaly baselines) aligned with the organization's specific threat model. Generic out-of-box detections miss organization-specific threats and generate excessive false positives. Custom tuning dramatically improves detection quality."},
{q:"Which security framework maps security controls to specific threats and attack techniques?",o:["NIST CSF", "MITRE ATT&CK — aligning defenses to known adversary tactics and techniques", "ISO 27001", "PCI DSS"],a:1,d:5,e:"MITRE ATT&CK provides the taxonomy for mapping detections, controls, and security gaps to real attacker behaviors. A red team exercise maps findings to ATT&CK techniques. The blue team identifies which techniques lack detection coverage. This provides a threat-aligned view of security gaps rather than a compliance-focused view."},
{q:"Which security operations activity verifies that data backup processes are working correctly and data is actually recoverable?",o:["Backup monitoring", "Backup testing / restore verification — periodically restoring data to confirm recoverability", "Backup scheduling", "Backup encryption"],a:1,d:5,e:"Backup testing is distinct from backup monitoring. Monitoring confirms backup jobs run without errors. Testing confirms backup data is actually readable and can be fully restored within the required timeframe. Many organizations discover backup failures only during real disasters. Regular restore testing (monthly for critical systems) prevents this."},
{q:"Which type of security assessment involves no prior knowledge of the target, simulating an external attacker's perspective?",o:["White-box assessment", "Gray-box assessment", "Black-box assessment", "Red team exercise"],a:2,d:5,e:"Black-box assessments provide no advance information to the tester — they start with only publicly available information, simulating a real external attacker. This reveals what an outside attacker could actually achieve. The tradeoff is that some vulnerabilities may be missed that would be found with internal knowledge. White-box tests are more comprehensive; black-box are more realistic."},
{q:"Which security documentation describes the step-by-step response procedures for a specific type of security incident?",o:["Security policy", "Security standard", "Incident response playbook", "Business continuity plan"],a:2,d:5,e:"Playbooks provide detailed, actionable procedures for specific incident types. A ransomware playbook details: detection indicators, immediate isolation steps, stakeholder notification, recovery procedures, and post-incident actions. Playbooks reduce response time, ensure consistency, and prevent critical steps from being missed under the stress of real incidents."},
{q:"A security analyst reviewing logs notices base64-encoded strings in URL parameters. This MOST likely indicates:",o:["Normal web application behavior", "Encoded attack payloads or data exfiltration — base64 encoding is commonly used to obfuscate malicious payloads", "Standard authentication tokens", "Normal API traffic"],a:1,d:5,e:"While base64 appears in legitimate contexts (API tokens, some parameters), unusual base64 in URL parameters often indicates: encoded injection payloads (attackers bypass signature detection), data being covertly exfiltrated, or command execution strings. Context matters — investigate whether the encoding is expected for that application."},
{q:"Which security operations capability detects when a user's behavior changes significantly from their normal baseline?",o:["Signature-based IDS", "UEBA (User and Entity Behavior Analytics) — detecting anomalous behavior patterns", "Log management", "DLP"],a:1,d:5,e:"UEBA establishes behavioral baselines per user and entity and alerts on statistical anomalies. Examples: a finance employee suddenly accessing HR systems, an account logging in from a new country, a server making unusual outbound connections. UEBA catches insider threats and compromised accounts that bypass traditional controls by using legitimate credentials."},
{q:"Which concept describes the complete timeline of activities performed during a security investigation?",o:["Incident report", "Chain of custody", "Forensic timeline — chronological reconstruction of all relevant events", "Investigation log"],a:2,d:5,e:"A forensic timeline reconstructs the sequence of events: when the attacker first appeared, how they moved through the network, what data they accessed, and when they were detected. Timeline construction requires correlating timestamps from multiple sources (logs, file system metadata, network captures). Accurate NTP time synchronization is critical for timeline reliability."},
{q:"Security operations metrics that count events rather than measure outcomes are considered:",o:["Leading indicators", "Vanity metrics — they don't demonstrate actual security effectiveness", "Lagging indicators", "Key performance indicators"],a:1,d:5,e:"Vanity metrics (number of alerts, number of scans, number of training completions) count activities without measuring security impact. Outcome-based metrics are more valuable: reduction in time to detect, reduction in critical vulnerability exposure time, improvement in detection rate for simulated attacks. Count outcomes, not activities."},
{q:"Which security operations practice involves retaining a professional IR firm before incidents occur?",o:["Incident response planning", "IR retainer agreement — ensures immediate expert assistance when needed without contract delays", "Tabletop exercise", "BCP development"],a:1,d:5,e:"IR retainers pre-establish relationships with specialized incident response firms. Benefits: immediate access when needed (no contract negotiation during a crisis), pre-negotiated pricing, ability for the firm to learn your environment in advance, and often includes proactive services. Essential for organizations without in-house IR expertise."},
{q:"Which activity ensures that security monitoring covers all critical systems and data flows?",o:["Alert tuning", "Security coverage analysis — mapping monitoring capabilities against the attack surface to identify blind spots", "Log collection", "SIEM deployment"],a:1,d:5,e:"Coverage analysis answers: what are all the ways an attacker could compromise us, and do we have detection capability for each? It maps threat techniques to detections, identifies gaps, and prioritizes detection engineering efforts. Without coverage analysis, organizations may have sophisticated monitoring that still misses the most likely attack paths."},
{q:"A security team discovers that an attacker used a valid but dormant service account that hadn't been used in 18 months. This represents a failure of:",o:["Patch management", "Account lifecycle management — failing to disable accounts that are no longer actively used", "MFA enforcement", "Network segmentation"],a:1,d:5,e:"Dormant accounts — service accounts, test accounts, former employee accounts — are attractive attack targets. They often lack monitoring because no one expects them to be used. 18 months of inactivity suggests the account should have been reviewed and disabled. Regular account reviews with automatic disabling of inactive accounts prevent this."}

var FLASH_CARDS=[
  {front:"CIA Triad",back:"Confidentiality · Integrity · Availability — the three core security properties"},

  {front:"Integrity",back:"Ensuring data is accurate and has not been tampered with. Controls: hashing, digital signatures, checksums"},
  {front:"Availability",back:"Ensuring systems and data are accessible when needed. Controls: redundancy, failover, backups, RAID"},
  {front:"Non-repudiation",back:"Preventing parties from denying actions they performed. Achieved through digital signatures and audit logs"},
  {front:"Authentication",back:"Verifying that someone is who they claim to be (proving identity)"},
  {front:"Authorization",back:"Determining what an authenticated entity is allowed to access or do"},
  {front:"Identification",back:"Claiming an identity (e.g., presenting a username)"},

  {front:"Least Privilege",back:"Users receive only the minimum access required to perform their job functions"},
  {front:"Separation of Duties",back:"Critical tasks divided among multiple people to prevent fraud and error"},
  {front:"Dual Control",back:"Two authorized individuals must both be present/act for sensitive operations"},
  {front:"Risk",back:"Potential for harm = Threat × Vulnerability × Impact"},

  {front:"Vulnerability",back:"Weakness that can be exploited by a threat"},
  {front:"Risk Mitigation",back:"Reducing risk by implementing controls (patching, training, encryption)"},
  {front:"Risk Transfer",back:"Shifting financial risk to third party — cyber insurance"},
  {front:"Risk Avoidance",back:"Eliminating risk by stopping the risky activity entirely"},
  {front:"Risk Acceptance",back:"Formally acknowledging and tolerating a risk without additional controls"},
  {front:"Residual Risk",back:"Risk remaining after controls are applied"},
  {front:"Inherent Risk",back:"Risk existing before any controls are applied"},

  {front:"IR Phases (NIST)",back:"Preparation → Detection → Containment → Eradication → Recovery → Post-Incident"},

  {front:"SAML",back:"Security Assertion Markup Language — XML standard for federated identity/SSO"},
  {front:"OAuth",back:"Authorization framework for third-party access — 'sign in with Google'"},

  {front:"UDP",back:"User Datagram Protocol — fast, connectionless, no guarantee of delivery"},

  {front:"PCI DSS",back:"Standard for protecting payment card data — applies to organizations that process cards"},
  {front:"NIST CSF",back:"Cybersecurity Framework — Identify, Protect, Detect, Respond, Recover"},
