{q:"Privacy notices must be provided:",o:["Only when users request them", "At the time of data collection", " before collecting personal data", "Annually", "Only for sensitive categories of data"],a:1,d:1,e:"Privacy notices must be provided at collection time (GDPR Articles 13-14). Users have the right to know what's being collected before they provide it. Retroactive disclosure after collection has already occurred doesn't satisfy the requirement. Layered notices (short summary + full detail) improve readability."},
{q:"Which concept describes collecting data for one purpose but later using it for a different, incompatible purpose?",o:["Data theft", "Purpose creep — violates purpose limitation principles", "Data aggregation", "Data profiling"],a:1,d:1,e:"Purpose creep occurs when data collected for one reason is later used for different, potentially incompatible purposes. Collecting email for transactional notifications then using it for marketing (without consent) is purpose creep. Privacy regulations require new consent or legitimate basis when using data for new purposes."},
{q:"Personal data pseudonymization differs from anonymization in that pseudonymized data:",o:["Cannot be re-identified under any circumstances", "Can potentially be re-identified using additional information held separately", "Is not subject to GDPR", "Provides stronger privacy protection"],a:1,d:1,e:"Pseudonymized data has identifying information replaced with a pseudonym — but the mapping back to real identity exists separately. GDPR still applies to pseudonymized data. Truly anonymized data has no path back to individual identity — GDPR doesn't apply. Pseudonymization reduces risk but isn't the same as anonymization."},
{q:"Which privacy principle gives individuals the right to receive their personal data in a portable format?",o:["Right to access", "Right to erasure", "Right to data portability", "Right to restriction"],a:2,d:1,e:"GDPR Article 20 (data portability) allows individuals to receive their personal data in a structured, commonly used, machine-readable format and transmit it to another controller. This enables switching between services (e.g., taking your data from one social network to another) without losing your information history."},
{q:"Qualitative risk assessment uses:",o:["Numerical dollar values and probabilities", "Descriptive scales (high/medium/low) based on expert judgment", "Statistical models", "CVE scores only"],a:1,d:1,e:"Qualitative risk assessments use descriptive scales rather than precise numbers — rating likelihood and impact as High/Medium/Low or on a 1-5 scale. Easier and faster than quantitative, but less precise. Used when data is unavailable for quantitative analysis or for initial triage. The result is a risk ranking, not a dollar figure."},
{q:"Quantitative risk assessment produces:",o:["High/medium/low risk ratings", "Dollar-value risk figures (ALE) based on mathematical analysis", "Simple risk matrices", "Compliance checklists"],a:1,d:1,e:"Quantitative risk assessment produces numerical results — Asset Value, Exposure Factor, SLE, ALE. These enable cost-benefit analysis of security investments (ROSI). More accurate but requires reliable data and more effort. ALE = SLE × ARO. ROSI = ALE reduction minus control cost."},
{q:"A residual risk that exceeds the organization's risk tolerance should be:",o:["Formally accepted with documentation", "Treated with additional controls", " or the activity should be avoided", "Ignored if no budget is available", "Transferred automatically through insurance"],a:1,d:1,e:"Risk tolerance is the maximum acceptable residual risk. If residual risk exceeds tolerance, the organization must either implement more controls to reduce it further, or avoid the activity creating the risk. Acceptance requires the risk to be within tolerance. Exceeding tolerance requires action, not just documentation."},
{q:"Threat modeling activity PRIMARILY takes place during which software development phase?",o:["Testing", "Production deployment", "Design and requirements — to identify threats before building", "Code review"],a:2,d:1,e:"Threat modeling is most valuable before writing code. In design, threats can be eliminated through architectural decisions that cost nothing. Threat models identify what can go wrong (STRIDE: Spoofing, Tampering, Repudiation, Information Disclosure, DoS, Elevation of Privilege) and inform security requirements and control selection."},
{q:"Which risk concept describes the probability that a specific threat will exploit a vulnerability in a given time period?",o:["Impact", "Likelihood/probability", "Risk appetite", "Residual risk"],a:1,d:1,e:"Likelihood (probability) estimates how often a threat will materialize. Combined with impact, it determines risk level: High likelihood × High impact = Critical risk. Low likelihood × High impact = High risk. Risk scoring matrices use likelihood and impact ratings to prioritize risks for treatment."},
{q:"A Vulnerability Management Program includes which activity AFTER identifying vulnerabilities?",o:["Purchasing new security tools", "Prioritizing and remediating vulnerabilities based on risk before attackers exploit them", "Documenting compliance only", "Reporting to executives only"],a:1,d:1,e:"Vulnerability management cycle: Discover → Assess → Prioritize (based on severity, exploitability, asset criticality) → Remediate (patch, mitigate, accept) → Verify remediation → Report. Prioritization ensures highest-risk vulnerabilities are fixed first, especially when resources are limited."},
{q:"A man-in-the-middle attack against TLS is prevented by:",o:["Using longer encryption keys", "Certificate validation — the client verifies the server's certificate chain to a trusted root CA", "Using symmetric encryption", "Increasing session timeout values"],a:1,d:1,e:"TLS prevents MitM through certificate validation. The server presents its certificate signed by a trusted CA. The client verifies the certificate chain, domain name match, and validity. An attacker cannot fake this certificate without the server's private key. Certificate pinning adds additional protection."},
{q:"Which encryption mode should NOT be used because identical plaintext blocks produce identical ciphertext blocks, revealing patterns?",o:["CBC mode", "GCM mode", "CTR mode", "ECB mode — Electronic Codebook"],a:3,d:1,e:"ECB mode encrypts each block independently with the same key, so identical plaintext produces identical ciphertext. This reveals data patterns — the 'ECB penguin' demonstrates this visually. All modern encryption should use modes with initialization vectors that ensure identical plaintexts produce different ciphertexts."},
{q:"Forward secrecy is achieved by:",o:["Using the same session key repeatedly for efficiency", "Generating unique temporary key pairs for each session that aren't stored", "Increasing key length", "Using certificates with longer validity periods"],a:1,d:1,e:"Forward secrecy (Perfect Forward Secrecy) uses ephemeral key pairs generated fresh for each session and discarded afterward. If the server's long-term private key is later compromised, past sessions cannot be decrypted because the session keys are gone. TLS 1.3 mandates forward secrecy by requiring ECDHE or DHE key exchange."},
{q:"A hardware security module (HSM) provides:",o:["Faster internet connections", "Tamper-resistant hardware for secure key storage and cryptographic operations that keys never leave", "Encrypted storage for user data", "Network access control"],a:1,d:1,e:"HSMs are physical security devices that store cryptographic keys in tamper-evident hardware. Keys never leave the HSM in plaintext — all cryptographic operations happen inside. Even if the HSM is stolen, keys can't be extracted. Used for root CA keys, payment processing, and high-security applications requiring FIPS 140-2 Level 3+."},
{q:"In asymmetric encryption, encrypting with the PRIVATE key and decrypting with the PUBLIC key provides:",o:["Confidentiality for the data", "Digital signature — authentication and non-repudiation", "Better performance", "Stronger encryption"],a:1,d:1,e:"Encrypting with the private key creates a digital signature — anyone with the public key can verify the signature, confirming it was created by the private key holder (authentication) and that they cannot deny creating it (non-repudiation). The content isn't confidential — anyone with the public key can verify/decrypt."},
{q:"Certificate transparency logs are used to:",o:["Store private keys securely", "Publicly record all issued certificates so unauthorized certificate issuance can be detected", "Speed up certificate validation", "Reduce certificate costs"],a:1,d:1,e:"Certificate Transparency (CT) requires CAs to log all issued certificates in public, append-only logs. Domain owners can monitor these logs for certificates issued for their domains without authorization. Rogue certificates (issued by compromised or malicious CAs) become detectable. CT is now required by major browsers."},
{q:"Which attack collects multiple TLS handshakes to eventually decrypt the session key?",o:["BEAST attack", "CRIME attack", "POODLE attack", "All exploit protocol-level weaknesses in older TLS versions"],a:3,d:1,e:"BEAST, CRIME, POODLE, and DROWN all exploit weaknesses in older protocol versions (TLS 1.0, SSL 3.0, SSL 2.0) or specific cipher modes. This is why TLS 1.0 and 1.1 are deprecated and SSL is completely disabled. Using current protocol versions (TLS 1.2/1.3) with strong cipher suites prevents these attacks."},
{q:"An organization runs its DR plan but the alternate site cannot support full production workload. This reveals:",o:["A budget problem only", "A gap between DR capabilities and business requirements that must be addressed", "An acceptable limitation of warm sites", "A testing methodology error"],a:1,d:2,e:"DR testing that reveals capability gaps is valuable — discovering limitations during a test is far better than during an actual disaster. The gap between what the plan claims and what it actually delivers must be closed. This may require upgrading the alternate site, reducing RTO/RPO requirements, or accepting greater risk."},
{q:"Business continuity planning for a pandemic differs from natural disaster planning by:",o:["Being less complex", "Requiring planning for sustained human unavailability across all sites simultaneously — traditional site failover doesn't help", "Having shorter duration", "Affecting only some geographic locations"],a:1,d:2,e:"Pandemics affect people everywhere simultaneously — you can't fail over to an alternate site if staff are sick across the board. Pandemic BCP focuses on remote work capabilities, cross-training for key roles, supply chain diversity, and essential function prioritization. Geographic redundancy is insufficient."},
{q:"Which scenario requires activating the incident response plan?",o:["Scheduled maintenance that causes a planned outage", "A user forgetting their password", "An attacker gaining unauthorized access to systems containing customer data", "A failed hard drive on a non-critical workstation"],a:2,d:2,e:"IR plans activate for confirmed or suspected security incidents — unauthorized access, malware infection, data breach. Routine outages follow change management. Password resets follow help desk procedures. A hard drive failure follows hardware maintenance procedures. Only the unauthorized access scenario triggers IR."},
{q:"The PRIMARY difference between an incident and an event in security is:",o:["Events are more serious", "An event is any observable occurrence; an incident is an event with actual or potential adverse impact on security", "Events are always investigated", "Incidents only involve external attackers"],a:1,d:2,e:"Security events are observable occurrences — a login, a file access, a network connection. Security incidents are events that threaten or violate security policy. All incidents are events, but not all events are incidents. Triage determines whether an event becomes an incident requiring IR response."},
{q:"During incident response, evidence of attacker persistence mechanisms (scheduled tasks, registry run keys) is MOST important to find during which phase?",o:["Containment", "Detection", "Eradication — to ensure all backdoors are removed before recovery", "Post-incident review"],a:2,d:2,e:"Eradication must remove ALL attacker footholds — not just the initial intrusion vector. Attackers establish multiple persistence mechanisms (registry run keys, scheduled tasks, startup scripts, web shells) specifically to survive cleanup. Missing any one allows reinfection. Thorough persistence hunting is the hallmark of effective eradication."},
{q:"A computer forensics investigator uses a write blocker when examining a hard drive. If they did NOT use one:",o:["The investigation would fail completely", "Any write to the drive (including OS mounting) could alter timestamps and metadata", " contaminating evidence", "The investigation would take longer", "Legal requirements would not be met"],a:1,d:2,e:"Write blockers prevent any writes to the evidence drive. When an OS mounts a drive normally, it modifies access timestamps, swap files, and other metadata. These changes contaminate evidence — defense attorneys can challenge whether data was altered after seizure. Write blockers preserve drive integrity for legal admissibility."},
{q:"Which notification is required within 72 hours of discovering a personal data breach under GDPR?",o:["Notification to affected individuals", "Notification to the supervisory authority (data protection authority)", "Notification to media", "Notification to other EU data protection authorities"],a:1,d:2,e:"GDPR Article 33 requires notification to the supervisory authority within 72 hours 'where feasible.' Article 34 requires notification to affected individuals 'without undue delay' when there's high risk to their rights and freedoms. The supervisory authority notification is required first; individual notification follows when risk threshold is met."},
{q:"Recovery from a ransomware attack WITHOUT paying the ransom is MOST likely if the organization has:",o:["A strong security team", "Current", " tested backups stored separately from the network that ransomware cannot reach", "Cyber insurance", "A ransomware negotiator on retainer"],a:1,d:2,e:"Immutable, offline, or air-gapped backups are the most effective ransomware recovery mechanism. Ransomware specifically targets backup systems — it delays encryption to maximize damage before detection. Backups that survive ransomware (offline, immutable, or cloud with versioning and object lock) enable recovery without paying ransom."},
{q:"A security incident that causes the CEO to receive a call from a major customer who heard about it first in the news indicates a failure of:",o:["Technical security controls", "The crisis communications plan — stakeholders should be notified through proper channels before public disclosure", "The incident response team", "The firewall"],a:1,d:2,e:"Stakeholder communications failures compound incident damage. Key customers, board members, and regulators should receive notification through appropriate channels before public disclosure — not learn about it from news. Crisis communications plans define who is notified, in what order, with what information, and through which channels."},
{q:"Which IR phase captures lessons and feeds them back into the preparation phase?",o:["Eradication", "Recovery", "Post-incident activity — creating a continuous improvement loop", "Detection"],a:2,d:2,e:"Post-incident review feeds improvements back to preparation: update playbooks, improve detection rules, patch vulnerabilities exploited, revise security policies, enhance training. This creates the PDCA cycle for IR: Plan (prepare) → Do (respond) → Check (post-incident) → Act (improve preparation). Without this loop, organizations repeat the same incidents."},
{q:"The MAIN purpose of tabletop exercises in business continuity planning is:",o:["To activate actual recovery systems", "To identify gaps in plans", " train team members on their roles", " and validate communication through low-risk discussion", "To measure actual RTO/RPO achievement", "To satisfy auditor requirements"],a:1,d:2,e:"Tabletop exercises use scenario-based discussions to test plans without operational disruption. They reveal: who doesn't know their role, contact lists that are outdated, conflicting procedures, unclear decision authority, and plan gaps. They're cheap, low-risk, and can be conducted more frequently than full activation tests."},
{q:"An organization has separate DR and BCP teams. During a major incident, coordination MOST likely fails because:",o:["Teams use different tools", "Plans are documented separately with no integration", " leading to gaps and conflicts during actual execution", "DR teams are more technical", "BCP teams don't understand technology"],a:1,d:2,e:"Siloed DR and BCP planning creates coordination gaps. During real incidents, technical recovery (DR) and business continuity (BCP) must be coordinated — what good is the data center running if business processes can't operate? Integrated planning with unified command structures prevents coordination failures during actual events."},
{q:"System resilience differs from simple redundancy in that resilience:",o:["Requires more hardware", "Describes the system's ability to maintain acceptable service levels through disruption", " degradation", " and recovery — not just failover", "Is more expensive", "Only applies to software systems"],a:1,d:2,e:"Resilience is broader than redundancy. Redundant systems fail over when a component fails. Resilient systems can degrade gracefully, route around problems, absorb shocks, and recover quickly. Resilience design anticipates that failures will occur and builds systems to continue functioning even when components fail."},
{q:"A critical supplier going out of business represents which type of risk to an organization's business continuity?",o:["Financial risk only", "Supply chain / third-party dependency risk affecting ability to operate", "Reputational risk", "Operational risk only"],a:1,d:2,e:"Supply chain dependency is a key BCP consideration. If a critical supplier fails, the organization may not be able to operate. BCP should: identify critical suppliers, assess their financial health, qualify backup suppliers, maintain safety stock of critical materials, and consider in-sourcing critical functions. Single-source dependencies amplify this risk."},
{q:"After a disaster, a company must recover its operations in this order: life safety, then legal/regulatory requirements, then:",o:["C", "u", "s", "t", "o", "m", "e", "r", " ", "s", "a", "t", "i", "s", "f", "a", "c", "t", "i", "o", "n", ",", "M", "o", "s", "t", " ", "p", "r", "o", "f", "i", "t", "a", "b", "l", "e", " ", "o", "p", "e", "r", "a", "t", "i", "o", "n", "s", ",", "C", "r", "i", "t", "i", "c", "a", "l", " ", "b", "u", "s", "i", "n", "e", "s", "s", " ", "f", "u", "n", "c", "t", "i", "o", "n", "s", " ", "i", "d", "e", "n", "t", "i", "f", "i", "e", "d", " ", "i", "n", " ", "t", "h", "e", " ", "B", "I", "A", " ", "a", "s", " ", "h", "i", "g", "h", "e", "s", "t", " ", "p", "r", "i", "o", "r", "i", "t", "y", ",", "I", "T", " ", "s", "y", "s", "t", "e", "m", "s"],a:2,d:2,e:"Recovery priority: (1) Life safety — always first. (2) Legal/regulatory — obligations that cannot be paused. (3) Critical business functions from BIA — those whose loss causes greatest business impact. (4) Important functions. (5) Everything else. This prioritization drives which systems get recovered first with limited resources."},
{q:"Exercising incident response plans quarterly rather than annually primarily improves:",o:["Compliance posture", "Team proficiency through repetition — quarterly practice builds muscle memory and exposes plan gaps before real incidents", "Documentation quality", "Budget utilization"],a:1,d:2,e:"Frequency of practice directly impacts competency. Annual tabletops create a once-a-year compliance exercise. Quarterly exercises build genuine team capability — members know their roles, contact lists stay current, and plan gaps are caught more quickly. More practice = better response when it counts."},
{q:"A flood destroys the primary data center. Backup data is at an offsite facility 500 miles away. The PRIMARY concern is:",o:["Cost of transportation", "Whether the backup facility can support production workloads within the required RTO", "Distance from headquarters", "Media compatibility"],a:1,d:2,e:"The backup facility's actual capability to support production is what matters. Even if backup data is intact and accessible, if the facility lacks sufficient compute, storage, and connectivity to run production workloads within RTO, the DR plan fails. Capability testing must validate end-to-end recovery, not just data availability."},
{q:"A system's availability percentage of 99.99% means it can be unavailable for MAXIMUM:",o:["52 minutes per year", "8.76 hours per year", "52 hours per year", "5.2 minutes per year"],a:0,d:2,e:"99.99% (four nines) allows 0.01% downtime. 0.0001 × 525,600 minutes/year = 52.56 minutes per year. This translates to about 4.38 minutes per month. Achieving four nines requires significant redundancy, automated failover, and minimal maintenance windows. Five nines (99.999%) allows only 5.26 minutes per year."},
{q:"Which backup media type provides the LONGEST archival life for cold data storage?",o:["Hard disk drives", "USB flash drives", "Magnetic tape", "Optical media (M-DISC)"],a:3,d:2,e:"M-DISC optical media is rated for 1,000-year archival life. Standard optical discs last 25-100 years. Magnetic tape typically lasts 30-50 years with proper storage. Hard drives are not recommended for long-term archival (moving parts degrade). For regulatory retention requiring decades, optical or tape with periodic migration is standard."},
{q:"During eradication, reimaging systems from known-good images is preferred over manual malware removal because:",o:["It is faster", "It ensures complete removal of all malware components including rootkits that manual removal might miss", "It is cheaper", "It satisfies regulatory requirements"],a:1,d:2,e:"Reimaging restores systems to a known-clean state. Manual malware removal may miss: rootkits hiding themselves, persistence mechanisms in unusual locations, modified system files, or additional malware dropped after initial infection. A clean image guarantees a clean system. Manual removal creates doubt about completeness."},
{q:"A disaster recovery plan should include:",o:["O", "n", "l", "y", " ", "t", "e", "c", "h", "n", "i", "c", "a", "l", " ", "r", "e", "c", "o", "v", "e", "r", "y", " ", "p", "r", "o", "c", "e", "d", "u", "r", "e", "s", ",", "C", "o", "n", "t", "a", "c", "t", " ", "l", "i", "s", "t", "s", ",", " ", "d", "e", "c", "i", "s", "i", "o", "n", " ", "t", "r", "e", "e", "s", ",", " ", "e", "s", "c", "a", "l", "a", "t", "i", "o", "n", " ", "p", "r", "o", "c", "e", "d", "u", "r", "e", "s", ",", " ", "v", "e", "n", "d", "o", "r", " ", "c", "o", "n", "t", "a", "c", "t", "s", ",", " ", "a", "n", "d", " ", "d", "e", "t", "a", "i", "l", "e", "d", " ", "t", "e", "c", "h", "n", "i", "c", "a", "l", " ", "r", "e", "c", "o", "v", "e", "r", "y", " ", "s", "t", "e", "p", "s", " ", "f", "o", "r", " ", "a", "l", "l", " ", "c", "o", "v", "e", "r", "e", "d", " ", "s", "y", "s", "t", "e", "m", "s"],a:1,d:2,e:"Comprehensive DR plans include: escalation procedures (who to call and when), vendor/supplier emergency contacts, decision trees (when to activate), technical recovery steps for each system, communications templates, resource lists, and testing schedules. Plans with only technical steps fail when people can't figure out who has authority or who to call."},
{q:"A user is authenticated but then accesses a resource they're not authorized to access. Which control failed?",o:["Authentication", "Authorization", "Identification", "Accountability"],a:1,d:3,e:"Authentication confirmed who the user is (identity). Authorization controls what they can do — this is the failed control. The access control list or permission check either wasn't properly configured or had a flaw. Authentication and authorization are distinct: knowing who someone is doesn't determine what they're allowed to do."},
{q:"Which authorization model grants access through explicit delegation where one user can grant their own permissions to another?",o:["MAC", "RBAC", "DAC — the owner can delegate access to others", "ABAC"],a:2,d:3,e:"DAC (Discretionary Access Control) allows resource owners to delegate their access rights to others at their discretion. A file owner can share the file and grant others read/write/execute permissions. This flexibility is DAC's strength and weakness — owners may grant inappropriate access without central oversight."},
{q:"In role engineering, which process defines the roles needed for a new system?",o:["Access recertification", "Role mining — analyzing actual access patterns to define appropriate roles", "Segregation of duties analysis", "Identity provisioning"],a:1,d:3,e:"Role mining analyzes existing access patterns to identify natural groupings that form roles. Rather than manually designing roles from scratch, role mining examines who currently has what access (top-down: define roles from job descriptions, or bottom-up: analyze existing access patterns). This creates practical, right-sized roles."},
{q:"The term 'orphaned account' refers to:",o:["An account that has never been used", "A user account whose owner has left the organization but the account was not disabled or deleted", "An administrative account with no owner", "A temporary account past its expiration date"],a:1,d:3,e:"Orphaned accounts belong to former employees, contractors, or vendors whose access wasn't revoked when they left. These create significant risk — the former user may still have access, or attackers may discover and use the dormant account. Regular account reviews and HR-IT integration prevent orphaned accounts."},
{q:"Which physical access control is MOST appropriate for a data center requiring high security?",o:["Single-factor keypad entry", "No physical access controls needed since network access is controlled", "Multi-factor authentication with badge plus biometric plus PIN", "Standard badge readers used for office areas"],a:2,d:3,e:"Data centers contain critical infrastructure requiring the highest physical security. Multi-factor physical access combining: badge (something you have), biometric (something you are), and sometimes PIN (something you know) provides defense in depth. Single-factor is insufficient for data center-level security requirements."},
{q:"User provisioning automation reduces security risk by:",o:["Eliminating all human error", "Ensuring consistent", " immediate application of access policies when HR status changes — removing human delay and inconsistency in access management", "Making access management faster only", "Reducing IT staff needs"],a:1,d:3,e:"Manual provisioning is slow and inconsistent. Automation triggers immediate access changes when HR events occur — new hire (provision), role change (modify), termination (revoke). This closes the window between status change and access change, preventing former employees from having active accounts and new employees from waiting for access."},
{q:"'Trust but verify' has been replaced by 'Never trust, always verify' in modern security because:",o:["It's a marketing phrase only", "Network location can no longer be used to infer trust — internal network users and devices must be verified just as rigorously as external ones", "External threats have decreased", "VPNs provide sufficient verification"],a:1,d:3,e:"Zero trust emerged because perimeter-based trust was repeatedly exploited. Attackers who gain network access (VPN credentials, physical access, insider) inherit all trust granted to internal users. Zero trust treats every access request as potentially hostile regardless of source. 'Never trust, always verify' applies to both internal and external access."},
{q:"Which concept describes applying the least privilege principle to service-to-service communications in cloud architectures?",o:["Service mesh", "Service account management with minimal permissions", "Microsegmentation", "API gateway security"],a:1,d:3,e:"In cloud architectures, services communicate with each other using service accounts or IAM roles. Least privilege means each service only has permissions for the specific resources it needs to function. An order processing service shouldn't have access to HR data. IAM policies enforce this at the API level."},
{q:"Account password history requirements prevent:",o:["Brute force attacks", "Users from immediately reusing recently changed passwords", " which would defeat password rotation", "Phishing attacks", "Dictionary attacks"],a:1,d:3,e:"Password history blocks reuse of recent passwords. Without history requirements, users rotate: Password1 → Password2 → Password1. History of 12 passwords means users must choose 12 different passwords before reusing one. This extends the effective rotation period and prevents trivial policy circumvention through immediate reuse."},
{q:"Which statement about security groups versus roles is MOST accurate?",o:["They are identical concepts", "Security groups organize users; roles define permissions — assigning users to groups that have roles provides scalable access management", "Roles are only for privileged users", "Security groups only apply to network access"],a:1,d:3,e:"Groups organize users (everyone in the Finance department). Roles define permission sets (Finance Analyst role: read financial reports, submit expense claims). Assigning groups to roles (Finance Analyst group has Finance Analyst role) creates a scalable matrix. Changes to the role automatically apply to all group members."},
{q:"During access reviews, a manager certifies that an employee who transferred 6 months ago still needs access to both old and new department systems. This MOST likely indicates:",o:["Proper documentation of exceptional access", "Privilege creep — the employee accumulated access and the manager rubber-stamped without actual review", "Appropriate separation of duties", "A well-managed hybrid role"],a:1,d:3,e:"Privilege creep during access reviews occurs when managers approve access without genuinely verifying continued need. Rubber-stamping access reviews provides false assurance. Effective reviews require managers to justify WHY access is still needed for each item. Transfers should trigger automatic removal of old access, not just addition of new access."},
{q:"Which mechanism prevents users from logging into multiple concurrent sessions simultaneously?",o:["VPN,Concurrent session limits — restricting users to one active session at a time,Password complexity,MFA"],a:1,d:3,e:"Concurrent session limits prevent a valid credential from being used by multiple people simultaneously. A single user shouldn't need 5 active sessions — if the limit is 1, a new login automatically terminates the old session or blocks new logins. This detects shared credentials and limits session hijacking impact."},
{q:"Privileged accounts should NEVER be used for:",o:["Emergency operations", "Routine daily tasks like email and web browsing — use standard accounts for everyday work", "Automated processes", "Documented administrative tasks"],a:1,d:3,e:"Using privileged accounts for routine tasks exposes elevated credentials to routine risks: phishing emails, malicious websites, infected downloads. Admins should have two accounts: a standard account for daily work and a privileged account used only for specific admin tasks. This dramatically limits the exposure of high-value credentials."},
{q:"Physical access to server rooms should be limited to:",o:["All IT staff", "Personnel with a documented operational need to physically access those specific systems", "Anyone with a badge", "Building security staff"],a:1,d:3,e:"Server room access follows least privilege — only personnel who need physical access for their specific job functions. This excludes: IT staff who only do remote administration, developers, business users. Physical access is a security control that limits insider threat and reduces the attack surface for physical attacks on servers."},
{q:"An access control system that grants access based on an individual's membership in one or more specific groups is MOST aligned with:",o:["DAC", "MAC", "RBAC", "ABAC"],a:2,d:3,e:"RBAC assigns users to roles/groups, and groups have defined permissions. Access is determined by group membership. This matches most enterprise implementations (Active Directory security groups, IAM role assignments). ABAC would additionally consider non-role attributes like time, device, and location."},
{q:"Strong authentication for remote access to sensitive systems SHOULD use:",o:["Password only — it's all that's needed for remote work", "VPN with MFA — encrypted tunnel with identity verification stronger than password alone", "Security questions only", "Monthly password rotation"],a:1,d:3,e:"Remote access to sensitive systems requires both network security (VPN encryption) and strong authentication (MFA). Password-only VPN is insufficient — credentials can be phished or stolen. MFA ensures that stolen credentials alone cannot provide access. This is a fundamental zero-trust requirement for remote access."},
{q:"Which physical security control uses weight sensors to detect multiple people entering an area?",o:["RFID readers", "Biometric scanners", "Man traps with weight-based occupancy detection", "Turnstiles"],a:2,d:3,e:"Advanced mantraps use weight sensors to ensure only one person (within an expected weight range) occupies the vestibule at once. This automates tailgating detection — if two people are detected, the inner door won't open. This is more reliable than camera-based detection and works even when people move quickly."},
{q:"Single Sign-On security considerations include:",o:["SSO increases security in all cases", "SSO creates a single point of failure — if SSO is compromised", " all connected applications are compromised", "SSO should never be used", "SSO only works for web applications"],a:1,d:3,e:"SSO trade-off: improved user experience and reduced password fatigue vs. single point of failure. If SSO credentials are compromised, the attacker accesses all SSO-connected applications. Strong MFA on the SSO is critical. Session management must also be robust — SSO sessions should have appropriate timeouts."},
{q:"Which access control principle requires reviewing users' access rights after business processes change significantly?",o:["Least privilege enforcement", "Access recertification triggered by business events", "Separation of duties", "Password rotation"],a:1,d:3,e:"Access rights must remain appropriate as business processes evolve. When a department reorganizes, a system changes purpose, or business processes are redesigned, existing access rights may no longer be appropriate. Event-triggered access reviews (not just calendar-based) catch access that's appropriate today but inappropriate after organizational changes."},
{q:"Attribute-based access control is MOST appropriate when access decisions require:",o:["Simple role-based rules", "Complex", " context-sensitive decisions considering multiple user", " resource", " and environmental attributes simultaneously", "High performance with minimal latency", "Physical access control only"],a:1,d:3,e:"ABAC excels at complex, context-sensitive policies. 'Senior managers in the Finance department can access financial reports from managed corporate devices during business hours when working from an approved location' — this requires evaluating multiple attributes simultaneously. RBAC handles simpler role-based requirements more efficiently."},
{q:"A three-tier web application architecture separates:",o:["Desktop from mobile users", "Web server", " application server", " and database server into separate tiers with firewalls between each", "Development", " test", " and production environments", "Frontend and backend developers"],a:1,d:4,e:"Three-tier architecture: presentation tier (web server, user interface), logic tier (application server, business logic), data tier (database). Separating tiers with firewalls limits blast radius — a compromised web server cannot directly access the database. This is standard secure web application design."},
{q:"Which network attack exploits trust relationships between a compromised system and other systems that trust it?",o:["Lateral movement — using trusted relationships (SMB, WMI, SSH keys) to access additional systems,SQL injection,Phishing,Denial of service"],a:0,d:4,e:"Lateral movement exploits that systems within a network trust each other. A compromised Windows server may have cached credentials or SSH keys for other systems. PowerShell remoting and WMI enable authenticated connections to trusted systems. Microsegmentation and credential hygiene (no reused passwords, no shared service account passwords) limit lateral movement."},
{q:"An organization notices DNS queries to randomly generated domain names from an internal host. This MOST likely indicates:",o:["A misconfigured DNS client", "DNS-based malware C2 using Domain Generation Algorithms (DGA)", "Normal browser behavior", "A DNS server failure"],a:1,d:4,e:"DGA malware generates random domain names algorithmically — only the attacker knows which ones are active. The malware tries each one until it connects to the C2 server. This makes blocklisting C2 domains ineffective and creates a distinctive pattern of random-looking domain name queries. Network monitoring can detect this pattern."},
{q:"Network packet filtering at Layer 3/4 is INSUFFICIENT for protecting against attacks because:",o:["It's too slow for modern networks", "It cannot inspect encrypted traffic and doesn't understand application context — application-layer attacks pass through on allowed ports", "It doesn't support IPv6", "It requires dedicated hardware"],a:1,d:4,e:"Packet filtering only examines IP addresses and port numbers. SQL injection arrives on permitted port 443 (HTTPS). XSS arrives on permitted port 80. Command injection arrives on permitted application ports. Application-layer attacks use legitimate network paths. WAFs and NGFWs with application awareness are needed to inspect traffic content."},
{q:"Which type of firewall can identify and control applications regardless of which port they use?",o:["Packet filter firewall", "Stateful inspection firewall", "Application-aware / Next-generation firewall (NGFW)", "Circuit-level gateway"],a:2,d:4,e:"NGFWs use deep packet inspection to identify applications by their behavior and content, not just port numbers. Skype, BitTorrent, and many applications can run on any port. NGFWs can block BitTorrent traffic even if it uses port 443. Traditional firewalls that only check ports cannot identify or control such traffic."},
{q:"SSL stripping attacks convert HTTPS connections to HTTP by:",o:["Breaking SSL certificates", "Intercepting the initial HTTP request before HTTPS redirect and maintaining an HTTP connection with the user while creating HTTPS with the server", "Stealing SSL certificates", "Flooding SSL servers"],a:1,d:4,e:"SSL stripping (HTTP downgrade) intercepts the initial unencrypted HTTP request, completes HTTPS with the server, but maintains HTTP with the user. The user sees HTTP (no padlock) but may not notice. HSTS (HTTP Strict Transport Security) mitigates this by instructing browsers to always use HTTPS for the domain."},
{q:"Which network access control implementation prevents a guest laptop from accessing internal resources?",o:["VLAN assignment based on 802.1X authentication — authenticated users in internal VLAN", " unauthenticated in guest VLAN", "Firewall rules only", "MAC address filtering", "Strong passwords"],a:0,d:4,e:"802.1X with VLAN assignment places authenticated corporate devices in the internal VLAN with access to internal resources, while unauthenticated or guest devices land in an isolated guest VLAN with internet-only access. This prevents guest devices from reaching corporate resources regardless of network port used."},
{q:"BGP hijacking attacks manipulate:",o:["DNS records", "Internet routing tables — causing traffic to route through attacker-controlled networks", "Web certificates", "Firewall rules"],a:1,d:4,e:"BGP hijacking announces false routing information, causing internet traffic to route through the attacker's network. This enables traffic interception at internet scale. Notable incidents include Pakistan Telecom's 2008 accidental YouTube blackout and various nation-state traffic interception operations. BGP security (RPKI) provides cryptographic route verification."},
{q:"Which security control prevents domain controller replication if unauthorized changes are detected?",o:["AD FS", "SIEM correlation rules", "Read-only Domain Controllers (RODCs) — changes must originate at writable DCs", "Firewall rules blocking port 389"],a:2,d:4,e:"Read-only Domain Controllers replicate AD data but cannot write changes. If an RODC is compromised, attackers cannot modify AD data (add accounts, change passwords, modify group memberships) — changes must originate at writable DCs. Used in branch offices where physical security is lower."},
{q:"Which security principle requires that management traffic (SSH, SNMP) travel on separate network segments from user data?",o:["Defense in depth", "Out-of-band management network — keeping management traffic isolated from production data traffic", "VLAN segregation", "Least privilege"],a:1,d:4,e:"Out-of-band management uses dedicated networks for managing infrastructure. If the production network is compromised, attackers cannot access network device management interfaces through the same path. Even if production is down, the management network remains operational for diagnosis and recovery."},
{q:"A network defender notices an IP that consistently sends SYN packets without completing the three-way handshake. This indicates:",o:["Normal network behavior", "A SYN flood DoS attack — sending many incomplete connection attempts to exhaust server connection tables", "Slow network connectivity", "A misconfigured client"],a:1,d:4,e:"SYN floods send SYN packets but never respond to SYN-ACK (never completing the handshake). The server allocates resources for each half-open connection, filling the connection table. Legitimate connections then fail. SYN cookies allocate no resources until the handshake completes, defeating SYN floods."},
{q:"Microsegmentation of a network means:",o:["Creating separate physical networks for each device,Applying granular security policies at the individual workload or VM level,Using more VLANs than traditional segmentation,Encrypting all east-west traffic"],a:1,d:4,e:"Microsegmentation creates security zones at the workload level, not the network level. Each VM or container has its own security policy. East-west traffic (between workloads) is controlled just as strictly as north-south (in/out of datacenter). This limits lateral movement — a compromised workload can't reach adjacent workloads without explicit permission."},
{q:"A company's web application uses HTTPS but stores session tokens in plaintext cookies without the HttpOnly flag. The risk is:",o:["Session tokens can be intercepted on the network", "JavaScript (including injected malicious scripts) can access and steal session tokens via XSS", "Session tokens expire too quickly", "The HTTPS certificate is invalid"],a:1,d:4,e:"HttpOnly prevents JavaScript from reading cookies. Without it, XSS attacks can execute document.cookie to steal session tokens. The attacker then hijacks the session without needing credentials. Setting HttpOnly on session cookies is a defense-in-depth measure — XSS still occurs but session hijacking through cookie theft is prevented."},
{q:"Port knocking is a security technique where:",o:["Users knock on physical server room doors", "A firewall only opens a port after receiving a specific sequence of connection attempts to other ports", "Specific ports are permanently opened for specific users", "Multiple authentication factors are required before port access"],a:1,d:4,e:"Port knocking keeps all ports closed until a client sends a specific sequence of connection attempts to defined ports in order. Only then does the firewall open the target port for that source IP. This hides services completely from port scanners. Widely used for SSH: knock on ports 7000, 8000, 9000 in sequence to open port 22."},
{q:"Which network security threat involves injecting malicious code into web pages served to other users?",o:["SQL injection", "Cross-site scripting (XSS) — stored or persistent XSS injects code that runs for all visitors", "CSRF", "Directory traversal"],a:1,d:4,e:"Stored (persistent) XSS saves malicious scripts in the application's database. Every user who views the affected page has the script execute in their browser. This can steal cookies, redirect to phishing sites, or capture keystrokes. Reflected XSS sends the payload in the request and it reflects back. Both require output encoding to prevent."},
{q:"Network vulnerability scanning without authorization could be considered:",o:["Ethical hacking,Legal penetration testing,Unauthorized access that may violate computer fraud laws,Normal network administration"],a:2,d:4,e:"Scanning networks you don't own or have permission to test may violate the Computer Fraud and Abuse Act (CFAA) in the US and similar laws globally. Authorization (in writing) is required before any security testing. Even scanning adjacent IP ranges or cloud provider networks without permission can create legal liability."},
{q:"IPsec VPN operates at which network layer, making it transparent to applications?",o:["Application layer (Layer 7)", "Transport layer (Layer 4)", "Network layer (Layer 3) — encrypts IP packets transparently", "Data link layer (Layer 2)"],a:2,d:4,e:"IPsec encrypts at the IP layer, making it transparent to all applications. The application sees normal network connectivity — encryption and decryption happen below the application. Compare to TLS which requires application-level support. IPsec tunnel mode encrypts entire IP packets and adds a new IP header for transmission."},
{q:"Which attack uses legitimate credentials obtained from one source to gain unauthorized access to accounts on different services?",o:["Brute force", "Credential stuffing — using breached username/password pairs against other sites exploiting password reuse", "Phishing", "Password spraying"],a:1,d:4,e:"Credential stuffing exploits password reuse. When a site is breached, those credentials are tested against hundreds of other sites. Billions of credential pairs are available on dark web markets. MFA defeats credential stuffing — even valid credentials can't authenticate without the second factor. Unique passwords per site eliminate the risk."},
{q:"An intrusion prevention system (IPS) differs from a firewall because:",o:["IPS is more expensive", "IPS analyzes traffic content for attack signatures and can block based on behavioral analysis", " not just network rules", "Firewalls are faster", "IPS only protects wireless networks"],a:1,d:4,e:"Firewalls enforce network policy based on source/destination/port rules. IPS examines actual traffic content for attack patterns — SQL injection strings, shellcode, exploit payloads. IPS blocks malicious content even on permitted ports. Together they provide layered protection: firewalls control network flows, IPS inspects content within allowed flows."},
{q:"Transport Layer Security (TLS) 1.3 improvements over TLS 1.2 include:",o:["Support for more cipher suites", "Mandatory perfect forward secrecy and reduced handshake latency with 0-RTT resumption", "Support for SHA-1 certificates", "Better backward compatibility"],a:1,d:4,e:"TLS 1.3 improvements: removed weak algorithms (RSA key exchange, CBC mode ciphers, SHA-1, MD5, DES), mandates perfect forward secrecy (ephemeral key exchange only), reduces handshake from 2 round trips to 1 (1-RTT), supports 0-RTT resumption for returning clients. TLS 1.2 and below should be disabled on modern systems."},
{q:"A security team observes 50,000 failed authentication attempts from one IP against user accounts. This MOST likely indicates:",o:["Normal user behavior", "Brute force attack against specific accounts", "Password spraying — trying many accounts with few common passwords to avoid lockout", "Credential stuffing"],a:2,d:4,e:"50,000 attempts from one IP is too high for credential stuffing (many IPs) or brute force (many attempts per account). Password spraying tries one or few common passwords (Password1!, Summer2023!) against many accounts. By trying few attempts per account, it stays below lockout thresholds. Geo-blocking and adaptive authentication detect this."},
{q:"Network segmentation prevents which attack scenario?",o:["A phishing email reaching end users", "An attacker who compromises a workstation from immediately accessing all servers across the network", "Malware from executing on the compromised host", "Attackers from entering the network"],a:1,d:4,e:"Segmentation creates barriers between network zones. An attacker on a user workstation VLAN cannot directly reach database servers on the database VLAN. They must traverse firewall rules between segments. Without segmentation, a flat network allows compromised workstations to reach any server directly — enabling rapid lateral movement."},
{q:"Which security operations activity analyzes how an attacker could potentially compromise an organization BEFORE an attack occurs?",o:["Incident response", "Red team exercise / penetration test", "Threat hunting", "Vulnerability scanning only"],a:1,d:5,e:"Red team exercises and pen tests simulate real attacks proactively. The goal is to find attack paths and demonstrate impact before real attackers do. This differs from reactive incident response (after attack). The red team provides the attacker perspective; the blue team defends. Results prioritize remediation efforts."},
{q:"Security information in logs is MOST useful when:",o:["Stored for the maximum possible time", "Centralized", " normalized", " and correlated across systems — raw logs from isolated systems hide attack patterns", "Reviewed manually by analysts", "Encrypted for security"],a:1,d:5,e:"Centralized log management (SIEM) aggregates and normalizes logs from diverse sources. Correlation rules connect events across systems. One failed login is noise; the same account failing on 20 systems in 30 seconds is an attack pattern. Logs in isolated silos hide these distributed attack patterns that only become visible when aggregated."},
{q:"A data breach notification letter to affected customers must include:",o:["Full technical details of the attack", "The nature of the breach", " types of information affected", " and what the organization is doing in response", "The names of attackers", "All security vulnerabilities in the organization's systems"],a:1,d:5,e:"Breach notifications inform customers about: what happened, what data was affected (account numbers? health info? SSN?), what risks they face, and what the organization is doing (offering credit monitoring, etc.). Technical attack details are not necessary and may expose further vulnerabilities. Regulatory templates specify required content."},
{q:"Security operations maturity level 1 organizations typically:",o:["Have no security program,Have ad-hoc incident response with no documented procedures, relying on heroic individual efforts,Have mature automated response capabilities,Have advanced threat hunting programs"],a:1,d:5,e:"Level 1 (Initial/Ad-hoc) security operations: no formal processes, response depends on specific individuals' knowledge, no documentation, incidents are handled reactively case-by-case. Higher maturity levels: documented processes (Level 2), metrics-driven (Level 3), automated (Level 4), optimized continuous improvement (Level 5)."},
{q:"Which operational control ensures that security patches are tested before being deployed to production systems?",o:["Patch management policy requiring formal change control", "Antivirus scanning", "Network segmentation", "Firewall rules"],a:0,d:5,e:"Patch management policy with change control ensures patches are tested in staging environments first. This catches patches that break applications or system compatibility. Expedited processes for critical security patches balance security (deploy fast) with stability (test first). Without testing, patches can cause outages worse than the vulnerability they fix."},
{q:"A security analyst discovers that an employee's account is being used to access files at 3 AM when the employee is known to be on vacation. FIRST action:",o:["Reset the password and alert the employee,Send an email to the account asking for explanation,Investigate further to determine if it's legitimate (scheduled task, admin action) or suspicious before acting,Do nothing — might be the employee working remotely"],a:2,d:5,e:"Investigate before acting. Scheduled tasks, system processes, or IT administrators using the account for maintenance could explain the activity. Acting immediately (resetting passwords, locking accounts) alerts attackers, disrupts legitimate processes, and destroys forensic evidence. Confirm the nature of the access before taking disruptive action."},
{q:"Which artifact is MOST useful for establishing the timeline of a security incident?",o:["Firewall configuration files", "Centralized system and application logs with accurate timestamps", "Email notifications", "Asset inventory"],a:1,d:5,e:"Accurate logs with timestamps are the foundation of incident timeline reconstruction. They show: when the attacker first appeared, which systems were accessed in what order, what data was touched, what commands were executed. Without accurate timestamps (NTP is critical), events cannot be properly sequenced."},
{q:"Performing security awareness training in the form of simulated phishing exercises is effective because:",o:["It satisfies compliance requirements", "It tests actual employee behavior rather than just knowledge — clicking a test phishing link triggers immediate teachable moment training", "It is cheaper than classroom training", "It covers all security topics"],a:1,d:5,e:"Behavior change requires practicing the behavior. Telling people about phishing is less effective than testing whether they click phishing links. Simulations create immediate, relevant feedback — employees who click get targeted training about exactly what they missed. Organizations track click rates over time to measure behavioral improvement."},
{q:"Which security function is responsible for analyzing malware samples to understand their capabilities?",o:["SOC Tier 1", "Malware analysis / reverse engineering (typically SOC Tier 3 or specialized team)", "Help desk", "Network operations center"],a:1,d:5,e:"Malware analysis is specialized work requiring reverse engineering skills. Analysts use static analysis (examining code without execution) and dynamic analysis (running in sandboxes) to understand: what the malware does, what systems it targets, how it communicates, and what indicators of compromise it creates. Results improve detection and response."},
{q:"Operational security (OPSEC) in the context of incident response means:",o:["Keeping the incident completely secret from everyone", "Carefully controlling what information about the ongoing investigation is shared — to avoid tipping off attackers who may still have system access", "Publishing all details immediately", "Only sharing information with executives"],a:1,d:5,e:"During active incidents where attackers may still have access, information about the investigation must be carefully controlled. Attackers who learn they're being investigated may destroy evidence, accelerate damage, or change tactics. Communication about active investigations should use out-of-band channels and need-to-know sharing only."},
{q:"Which type of security testing involves receiving a set of application binaries without source code and testing for vulnerabilities?",o:["White-box testing", "Gray-box testing", "Black-box testing", "Red team exercise"],a:2,d:5,e:"Black-box testing provides no internal knowledge — the tester has only what an external attacker would have. Testing binaries without source code is black-box application testing. It simulates real-world attack conditions and is more realistic than white-box, though less comprehensive since internal code paths aren't visible."},
{q:"Security hardening guides (CIS Benchmarks, DISA STIGs) are MOST useful for:",o:["Marketing security capabilities", "Providing specific", " prescriptive security configuration recommendations for specific operating systems and applications", "Documenting security incidents", "Planning business continuity"],a:1,d:5,e:"CIS Benchmarks and DISA STIGs provide detailed technical security configurations for specific software versions — exact registry settings, file permissions, service configurations, and more. They represent community consensus on secure configurations. Organizations use them as starting baselines, customizing as needed for their environment."},
{q:"Which practice ensures that security monitoring is comprehensive and doesn't leave blind spots?",o:["Having more security tools", "Mapping monitoring coverage to the attack surface — identifying what is and isn't being monitored and addressing gaps", "Focusing only on perimeter monitoring", "Monitoring all traffic with a single tool"],a:1,d:5,e:"Coverage mapping identifies monitoring gaps. Questions to answer: Are all critical assets monitored? Are authentication events captured? Is lateral movement detectable? Are data exfiltration paths monitored? Gaps become the attacker's blind spots. Regular coverage reviews ensure monitoring keeps pace with infrastructure changes."},
{q:"A security team implements honeypots in the internal network. Their PRIMARY value is:",o:["Active defense against external attacks,Early warning of internal compromise — any connection to honeypots is suspicious and indicates potential lateral movement,Replacing production systems,Testing disaster recovery procedures"],a:1,d:5,e:"Internal honeypots detect lateral movement. No legitimate user should ever connect to a honeypot. Any connection — regardless of source — indicates: an attacker who has breached the perimeter, a misconfigured system scanning the network, or an insider threat. High signal/no-noise detection with very low false positive rates."},
{q:"Security metrics should be reported in business terms to leadership because:",o:["Technical terms impress leadership", "Leaders need to understand risk to make informed resource decisions — 'We have 47 unpatched CVEs' means less than 'We have 3 exploitable vulnerabilities on internet-facing systems representing $2M potential liability'", "Technical staff prefer business metrics", "Regulators require business-language metrics"],a:1,d:5,e:"Security metrics in technical terms (CVE counts, scan results) don't enable business decisions. Business-relevant metrics (risk exposure, regulatory compliance status, control effectiveness trends) allow leaders to make informed decisions about security investments and risk acceptance. The CISO must translate technical findings into business impact."},
{q:"Which framework specifically addresses incident response for cybersecurity incidents?",o:["ISO 27001", "NIST SP 800-61 Computer Security Incident Handling Guide", "PCI DSS", "SOC 2"],a:1,d:5,e:"NIST SP 800-61 provides guidance on establishing an incident response capability, detecting and analyzing incidents, containing and recovering, and post-incident activities. It defines the IR lifecycle phases used throughout the security industry. It's the reference standard for incident response program development."},
{q:"A security analyst correlates: failed login to VPN + password reset request + successful login from new device + bulk file download. This sequence MOST likely indicates:",o:["Normal user behavior in a new office", "Account takeover — attacker used phishing to get credentials", " reset to lock out the real user", " then exfiltrated data", "IT help desk activity", "Routine user behavior"],a:1,d:5,e:"This attack chain: phishing captures credentials → attacker resets password (locking out real user) → attacker logs in from their device → immediately starts data exfiltration. Correlating these events across authentication, help desk, and DLP logs reveals the full attack. Individual events look routine; the sequence is an obvious attack pattern."},
{q:"Data sanitization procedures are required before:",o:["Employees receive new equipment", "Equipment is repurposed", " donated", " sold", " or disposed of to prevent residual data from being accessed by unauthorized parties", "Annual audits", "Equipment leaves the office for maintenance"],a:1,d:5,e:"Sanitization ensures data cannot be recovered from media when leaving organizational control. NIST SP 800-88 defines three levels: Clear (software overwriting for media remaining in same security domain), Purge (more robust methods for media leaving domain), Destroy (physical destruction for highly sensitive data). All three prevent unauthorized recovery."},
{q:"Which security tool monitors outbound data transfers for patterns indicating sensitive data exfiltration?",o:["Antivirus", "SIEM", "Data Loss Prevention (DLP)", "Network intrusion detection"],a:2,d:5,e:"DLP monitors data in motion (network), at rest (storage), and in use (endpoints) for sensitive data patterns. It can block emails containing 16-digit numbers (credit cards), alert on large file uploads to personal cloud storage, or prevent printing of documents containing SSNs. DLP enforces data handling policies automatically."},
{q:"Vulnerability management requires business input because:",o:["Security teams can determine priorities alone,Different vulnerabilities have vastly different real-world risk based on which assets are affected and what business functions they support,Vulnerability management is purely technical,Business teams have more security expertise"],a:1,d:5,e:"A CVSS 9.8 vulnerability on a test server is lower priority than a CVSS 7.0 on a system processing all customer payments. Business context — what the system does, what data it holds, who can access it, what regulations apply — is essential for accurate risk-based prioritization. Security and business teams must collaborate on patch priority."},
{q:"Which access control model is MOST commonly used in corporate Active Directory environments?",o:["DAC", "MAC", "RBAC", "ABAC"],a:2,d:3,e:"RBAC (Role-Based Access Control) assigns permissions based on job roles and is the standard in enterprise AD environments. Users are placed in groups (roles) that have specific permissions. When someone changes jobs, their group membership changes and permissions update automatically."},
{q:"A Zero Trust security model assumes:",o:["Internal network traffic is trusted", "All traffic, internal and external, must be verified before access is granted", "Only external traffic requires verification", "VPN users are fully trusted"],a:1,d:3,e:"Zero Trust operates on 'never trust, always verify.' No implicit trust is granted based on network location — even internal traffic requires authentication and authorization. Every access request is evaluated against policy regardless of source."},
{q:"Which physical control prevents a vehicle from ramming a building entrance?",o:["Security cameras", "Bollards/crash barriers", "Turnstiles", "Mantraps"],a:1,d:3,e:"Bollards are short, sturdy posts that prevent vehicle-borne attacks. They protect building perimeters from vehicle ramming while allowing pedestrian access. Critical infrastructure, government buildings, and crowded public spaces use bollards as vehicle attack deterrents."},
{q:"Privileged Access Workstations (PAWs) are used to:",o:["Allow admins to browse the internet securely", "Provide a dedicated, hardened workstation for performing privileged tasks only", "Reduce IT costs by consolidating admin functions", "Enable remote desktop access"],a:1,d:3,e:"PAWs are dedicated computers used exclusively for administrative tasks. They have no internet access, email, or general software. Using a PAW for admin work prevents credential theft via phishing on the admin's regular workstation."},
{q:"Which authentication protocol is used by RADIUS for wireless network access control?",o:["Kerberos", "EAP (Extensible Authentication Protocol)", "NTLM", "OAuth"],a:1,d:3,e:"RADIUS uses EAP variants for wireless authentication (802.1X). EAP-TLS uses certificates, EAP-PEAP uses passwords inside a TLS tunnel. RADIUS authenticates wireless clients against a central directory before granting network access."},
{q:"A user's account is automatically disabled after 90 days of inactivity. This is an example of:",o:["Least privilege", "Account lifecycle management — preventing stale accounts from becoming attack vectors", "Separation of duties", "Need to know"],a:1,d:3,e:"Automatic account disabling after inactivity closes the window on orphaned accounts. Attackers look for dormant accounts because no one monitors login attempts on them. Automated lifecycle policies catch accounts that manual offboarding processes miss."},
{q:"Which concept describes the risk when a user accumulates permissions from multiple roles over time?",o:["Privilege escalation", "Privilege creep", "Separation of duties violation", "Access sprawl"],a:1,d:3,e:"Privilege creep occurs when users retain access from previous roles as they change positions. After several job changes, a user may have accumulated permissions far exceeding their current needs. Regular access recertification and role-change access modification prevent privilege creep."},
{q:"Biometric enrollment accuracy affects which security metric most directly?",o:["False Acceptance Rate (FAR)", "Crossover Error Rate (CER)", "Authentication speed", "Enrollment time"],a:1,d:3,e:"CER (Crossover Error Rate) is the point where FAR equals FRR. Poor enrollment quality (dirty sensor, poor-quality capture) directly raises both error rates. Better enrollment produces more accurate templates, reducing both false acceptances (security risk) and false rejections (usability problem)."},
{q:"Which type of smart card stores private keys in tamper-resistant hardware?",o:["Proximity card", "Magnetic stripe card", "PKI smart card with embedded secure element", "RFID key fob"],a:2,d:3,e:"PKI smart cards contain a secure element (tamper-resistant chip) that stores private keys. The private key never leaves the card — cryptographic operations happen inside the chip. Even if the card is physically obtained, extracting the key requires destroying the chip."},
{q:"SAML assertions are used to convey which information between identity and service providers?",o:["Encryption keys", "Authentication decisions and user attributes", "Network routing information", "Session timeout values"],a:1,d:3,e:"SAML assertions are XML-based statements from the Identity Provider to the Service Provider containing: authentication statements (how the user authenticated), attribute statements (user properties like role and email), and authorization statements (what the user can access)."},
{q:"Which access control concept requires that write permissions flow from lower to higher integrity levels only?",o:["Bell-LaPadula no-write-down", "Biba no-write-up", "Clark-Wilson transformation procedures", "Chinese Wall separation"],a:1,d:3,e:"Biba's star integrity property (no write up) prevents low-integrity subjects from writing to high-integrity objects. This protects high-integrity data from contamination. A low-trust user cannot corrupt high-trust data. Compare to Bell-LaPadula which focuses on confidentiality with no-write-down."},
{q:"A user who logs in from an unusual country at 3 AM triggers additional authentication. This is:",o:["Multi-factor authentication", "Risk-based/adaptive authentication", "Step-up authentication", "Location-based blocking"],a:1,d:3,e:"Risk-based (adaptive) authentication evaluates contextual risk signals and adjusts authentication requirements dynamically. Low-risk access (familiar device, normal hours, known location) may require only a password. High-risk context triggers additional factors. This balances security with user experience."},
{q:"Which physical security concept uses overlapping camera coverage to eliminate blind spots?",o:["Defense in depth", "Perimeter security", "Coverage redundancy in CCTV deployment", "Security zone layering"],a:2,d:3,e:"Overlapping camera coverage ensures no area is unmonitored — if one camera fails or has a limited angle, adjacent cameras cover the gap. Security-in-depth applied to physical surveillance means every critical area is visible from multiple angles, eliminating blind spots attackers could exploit."},
{q:"Which type of access control list is attached to the resource and lists who can access it?",o:["Capability list", "Access Control List (ACL)", "Subject-based list", "Permission matrix"],a:1,d:3,e:"An ACL is attached to an object (file, network resource) and lists subjects with their permitted operations. When a subject requests access, the system checks the object's ACL. Capability lists are the inverse — attached to subjects, listing what objects they can access."},
{q:"Separation of duties in IT change management requires that:",o:["All changes are made by the same team for consistency", "The person who develops a change cannot also approve and deploy it to production", "Changes are made only during business hours", "All changes require executive approval"],a:1,d:3,e:"SoD in change management prevents a single developer from writing, approving, and deploying malicious or erroneous code. A developer writes code, a separate team reviews and approves, another team deploys to production. This prevents insider threats and reduces errors."},
{q:"Which authentication factor is MOST resistant to credential theft via phishing?",o:["SMS OTP codes", "TOTP authenticator apps", "FIDO2 hardware security keys", "Password managers"],a:2,d:3,e:"FIDO2/WebAuthn hardware keys are phishing-resistant because they perform origin binding — the key cryptographically verifies the website's domain. A fake phishing site cannot use the key response because it's bound to the real domain. SMS and TOTP codes can be intercepted via real-time phishing proxies."},
{q:"Which IAM concept allows a user from Organization A to access resources in Organization B using their Organization A credentials?",o:["Single Sign-On", "Federated identity / cross-organizational trust", "Privilege escalation", "Directory synchronization"],a:1,d:3,e:"Federated identity establishes trust between organizations' identity providers. A user authenticates to their home IdP and receives a token that partner organizations trust. No separate accounts needed. Common implementations use SAML or OIDC to exchange authentication assertions across organization boundaries."},
{q:"A door that requires a valid badge swipe to both enter AND exit a sensitive area implements which control?",o:["Tailgating prevention", "Two-person integrity", "Anti-passback access control", "Dual control"],a:2,d:3,e:"Anti-passback prevents a badge from being used to enter an area without first being used to exit, and vice versa. This prevents one person from swiping in and then handing their badge back under the door for someone else to use. It ensures badges can only be used in the expected sequence."},
{q:"Which concept describes running applications with the minimum operating system permissions needed?",o:["Application sandboxing", "Least privilege for processes", "Defense in depth", "Application whitelisting"],a:1,d:3,e:"Process-level least privilege limits the damage a compromised application can cause. A web server process running as root can modify any file; running as a low-privilege user limits its access to web content only. Container security, AppArmor, and SELinux enforce process-level privilege restrictions."},
{q:"Discretionary access control is called 'discretionary' because:",o:["The security system decides access automatically", "Resource owners decide at their discretion who gets access", "Access is granted based on mandatory security labels", "The government mandates access decisions"],a:1,d:3,e:"DAC is owner-controlled — the resource owner (creator or designated owner) discretionally decides who can access their resource and with what permissions. This flexibility is both DAC's strength and weakness — owners may grant inappropriate access, and there's no central enforcement of security policy."},
{q:"Which access control method uses GPS location as an authentication factor?",o:["Role-based AC", "Geofencing-based access control", "Time-based AC", "Network-based AC"],a:1,d:3,e:"Geofencing establishes virtual geographic boundaries. If a user attempts to access a resource from outside the permitted geographic area, access is denied or additional authentication is required. Used to prevent access from foreign countries or ensure sensitive work only happens on-site."},
{q:"Which term describes a formal process where a user's manager reviews and either approves or removes their access rights?",o:["Access provisioning", "User access certification/recertification", "Account auditing", "Identity governance"],a:1,d:3,e:"Access certification (recertification) is a formal, documented review where managers confirm each team member's access is still appropriate. Results are documented for audit. This is often required by regulations (SOX, PCI DSS) and catches privilege creep, orphaned accounts, and excessive permissions."},
{q:"A shared service account used by multiple applications should be replaced with:",o:["One account per application with minimum required permissions", "A more secure shared account with a stronger password", "Individual admin accounts", "A single enterprise service account"],a:0,d:3,e:"Each application should have its own service account with only the permissions it needs. Shared service accounts create accountability gaps (which app made that change?) and over-permissioning (the account needs all permissions any app might need). Individual accounts with minimal permissions are more secure."},
{q:"Which physical security control is MOST effective at detecting whether a door has been left open too long?",o:["Security cameras", "Door open alarms/sensors", "Badge readers", "Security guards"],a:1,d:3,e:"Door open alarms trigger when a door remains open beyond a defined threshold (e.g., 30 seconds). This detects propped doors (a common tailgating enabler) and ensures doors close properly after access. Cameras can detect it retrospectively; alarms provide real-time response."},
{q:"Which access management function ensures a newly hired employee has the right access on their first day?",o:["Access recertification", "Joiner/Mover/Leaver (JML) provisioning process", "Access audit", "Role mining"],a:1,d:3,e:"The Joiner/Mover/Leaver process automates access management lifecycle events. Joiners: provision access when someone starts. Movers: modify access when roles change. Leavers: deprovision access when someone departs. Integration with HR systems triggers these actions automatically."},
{q:"Password spraying attacks differ from brute force attacks in that password spraying:",o:["Is slower and more targeted", "Tries many passwords against one account", "Tries a few common passwords against MANY accounts to avoid lockout", "Requires credential dumps"],a:2,d:3,e:"Password spraying tries one or few common passwords (like 'Summer2024!') against thousands of accounts. By trying very few attempts per account, it stays below lockout thresholds. Brute force tries many passwords against one account. Password spraying is harder to detect because failed attempts are distributed across many accounts."},
{q:"Which concept in identity management describes the authoritative source for user identity data?",o:["Identity provider", "System of record", "Directory service", "Identity repository"],a:1,d:3,e:"The system of record (SoR) is the authoritative, trusted source for identity data — typically the HR system. All other systems should synchronize from this source. When an HR record shows someone has left, that's the trigger for deprovisioning. Inconsistency between the SoR and other systems creates security gaps."},
{q:"A user who calls IT support claiming to be the CEO and demanding immediate password reset access represents:",o:["A legitimate executive request", "A social engineering attack using pretexting", "A valid help desk procedure", "An authorized emergency access request"],a:1,d:3,e:"Pretexting creates a fabricated scenario to manipulate the target. Impersonating executives (CEO fraud) is common because help desk staff feel pressure to comply quickly with senior requests. Proper identity verification procedures must apply to ALL users regardless of claimed authority — call back on known numbers, require management approval."},
{q:"Which protocol allows applications to request access to resources on behalf of users without handling their credentials?",o:["SAML", "LDAP", "OAuth 2.0", "Kerberos"],a:2,d:3,e:"OAuth 2.0 is an authorization delegation framework. Apps request specific permissions (scopes) from resource owners. Users authorize the app and the authorization server issues access tokens. The app never sees credentials — only the token. 'Sign in with Google' uses OAuth for authorization, OpenID Connect for authentication."},
{q:"Group Policy Objects (GPOs) in Windows environments enforce security by:",o:["Allowing users to customize security settings", "Centrally applying and enforcing security configurations across domain-joined computers", "Providing user authentication", "Managing network routing"],a:1,d:3,e:"GPOs push security settings from Active Directory to domain-joined computers — password policies, screen lock settings, software restrictions, firewall rules. Users cannot override GPO-applied settings. This ensures consistent security baselines across the enterprise without manual per-machine configuration."},
{q:"Which biometric trait has the LOWEST False Acceptance Rate (most secure) in typical deployments?",o:["Face recognition", "Voice recognition", "Fingerprint", "Iris/retina scan"],a:3,d:3,e:"Iris/retina scans have the lowest FAR because the iris pattern is extremely unique and difficult to spoof. Face recognition and voice can be spoofed with photos/recordings. Fingerprints can be lifted. Iris scanners require live eye presence. The tradeoff is higher cost and potential user discomfort with eye scanners."},
{q:"Which access control concept ensures that even if an attacker gains network access, they cannot reach all systems?",o:["Perimeter defense", "Microsegmentation with least connectivity", "VPN enforcement", "Multi-factor authentication"],a:1,d:3,e:"Microsegmentation implements granular access controls between workloads. Even an attacker inside the network faces additional authorization barriers at each workload boundary. Lateral movement requires explicit permissions for each system-to-system communication path. This limits blast radius significantly."},
