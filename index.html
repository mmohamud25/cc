<style>
:root{
  --bg:#f8fafb;--bg2:#fff;--bg3:#f1f3f7;--bg4:#e8ecf2;
  --bd:#e2e8f0;--bd2:#cbd5e1;
  --tx:#0f172a;--tx2:#334155;--tx3:#64748b;--tx4:#94a3b8;
  --cy:#0891b2;--cy0:rgba(8,145,178,.1);
  --gn:#059669;--gn0:rgba(5,150,105,.1);
  --pk:#db2777;--pk0:rgba(219,39,119,.1);
  --ye:#d97706;--ye0:rgba(217,119,6,.1);
  --pu:#7c3aed;--pu0:rgba(124,58,237,.1);
  --or:#ea580c;--or0:rgba(234,88,12,.1);
  --rd:#dc2626;--rd0:rgba(220,38,38,.1);
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --radius:14px;--radius-sm:10px;
  --btn-s-bg:#f1f5f9;
}
[data-theme="dark"]{
  --bg:#0f1117;--bg2:#161b25;--bg3:#1c2333;--bg4:#222c3c;
  --bd:#1e2a3a;--bd2:#2a3a50;
  --tx:#e8edf5;--tx2:#a0aec0;--tx3:#6b7db3;--tx4:#3d4f6b;
  --cy:#38bdf8;--cy0:rgba(56,189,248,.1);
  --gn:#34d399;--gn0:rgba(52,211,153,.1);
  --pk:#f472b6;--pk0:rgba(244,114,182,.1);
  --ye:#fbbf24;--ye0:rgba(251,191,36,.1);
  --pu:#a78bfa;--pu0:rgba(167,139,250,.1);
  --or:#fb923c;--or0:rgba(251,146,60,.1);
  --rd:#ef4444;--rd0:rgba(239,68,68,.1);
  --btn-s-bg:#1c2333;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;transition:background .3s,color .3s}
/* Layout */
.app{display:flex;min-height:100vh}
.rail{width:220px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px;position:fixed;height:100vh;z-index:100;transition:background .3s}
.rail-logo{font-family:Syne,sans-serif;font-size:18px;font-weight:800;color:var(--cy);margin-bottom:4px;padding:8px}
.rail-sub{font-size:11px;color:var(--tx3);padding:0 8px 16px;border-bottom:1px solid var(--bd)}
.rail-nav{display:flex;flex-direction:column;gap:4px;margin-top:12px;flex:1}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:500;color:var(--tx3);width:100%;text-align:left;transition:all .15s}
.nav-btn:hover{background:var(--bg3);color:var(--tx)}
.nav-btn.active{background:var(--cy0);color:var(--cy);font-weight:700}
.nav-icon{font-size:16px;width:20px;text-align:center}
.rail-footer{border-top:1px solid var(--bd);padding-top:12px;margin-top:auto}
.main{margin-left:220px;flex:1;min-height:100vh}
.pg{padding:24px;max-width:1000px;margin:0 auto}
/* Cards */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card2{background:linear-gradient(135deg,var(--cy0),rgba(124,58,237,.08));border:1px solid rgba(8,145,178,.2);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
/* Buttons */
.btn{padding:10px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-family:Syne,sans-serif;font-size:13px;font-weight:700;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.btn-p{background:linear-gradient(135deg,var(--cy),var(--pu));color:#fff}
.btn-p:hover{opacity:.9;transform:translateY(-1px)}
.btn-s{background:var(--btn-s-bg);border:1px solid var(--bd2);color:var(--tx)}
.btn-s:hover{border-color:var(--cy);color:var(--cy)}
.btn-gn{background:var(--gn);color:#fff}
.btn-full{width:100%;justify-content:center}
/* Titles */
.stitle{font-family:Syne,sans-serif;font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;text-align:center}
.stat-num{font-family:Syne,sans-serif;font-size:28px;font-weight:800;color:var(--cy)}
.stat-label{font-size:11px;color:var(--tx3);margin-top:2px}
/* Quiz / Answer options */
.ans{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--bd2);background:var(--bg2);cursor:pointer;margin-bottom:8px;transition:all .15s;font-size:14px;line-height:1.5;color:var(--tx2);text-align:left;width:100%;font-family:inherit}
.ans:hover{border-color:var(--cy);background:var(--cy0)}
.ans.sel{border-color:var(--cy);background:var(--cy0);color:var(--cy)}
.ans.hit{border-color:var(--gn);background:var(--gn0);color:var(--gn)}
.ans.miss{border-color:var(--rd);background:var(--rd0);color:var(--rd)}
.ans.dim{opacity:.5}
.ltr{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--bg3);color:var(--tx3)}
.ans.sel .ltr{background:var(--cy0);color:var(--cy)}
.ans.hit .ltr{background:var(--gn0);color:var(--gn)}
.ans.miss .ltr{background:var(--rd0);color:var(--rd)}
/* Progress bar */
.prog-bar{height:6px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-fill{height:100%;border-radius:3px;transition:width .3s;background:linear-gradient(90deg,var(--cy),var(--pu))}
/* Domain pills */
.domain-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
/* Flashcards */
.fc{perspective:1200px;-webkit-perspective:1200px;cursor:pointer;margin-bottom:16px}
.fc-inner{transition:transform .35s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;position:relative;min-height:200px;width:100%;will-change:transform}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;width:100%;height:100%;min-height:200px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--bd);padding:24px;display:flex;align-items:center;justify-content:center}
.fc-front{background:var(--bg2)}
.fc-back{background:var(--gn0);border-color:var(--gn);transform:rotateY(180deg)}
/* Toast */
#toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.stitle{font-size:13px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;border:none;padding:0;background:none;display:block}
.toast-msg{background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;animation:slideIn .3s ease;pointer-events:none}
@keyframes slideIn{from{transform:translateX(100px);opacity:0}to{transform:translateX(0);opacity:1}}
/* Bottom nav mobile */
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--bd);padding:8px;z-index:100;grid-template-columns:repeat(5,1fr)}
.bnav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:none;background:none;cursor:pointer;font-size:10px;font-weight:600;color:var(--tx3);font-family:inherit}
.bnav-btn.active{color:var(--cy)}
/* Row / col */
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
/* Exam bar */
.exam-bar{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--bd);padding:10px 20px}
/* Responsive */
@media(max-width:768px){
  .rail{display:none}
  .pg{padding:14px}
  .main{margin-left:0;padding-bottom:70px}
  .bnav{display:grid}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>

<script>const QZ=[
{q:"A company encrypts its customer database to prevent unauthorized reading of sensitive data. Which CIA triad component does this PRIMARILY address?",o:["Integrity", "Availability", "Confidentiality", "Non-repudiation"],a:2,d:1,e:"Confidentiality ensures only authorized parties can read data. Encryption is the primary technical control for confidentiality. Integrity protects data from modification; availability ensures data is accessible."},
{q:"A hospital's EHR system goes offline for 4 hours due to ransomware. Which CIA component is MOST directly impacted?",o:["Confidentiality", "Integrity", "Availability", "Accountability"],a:2,d:1,e:"Availability means systems are accessible when needed. Ransomware taking systems offline attacks availability directly. Medical staff cannot access patient records, potentially impacting patient care."},
{q:"An attacker modifies financial transaction records without authorization. Which CIA component is violated?",o:["Availability", "Confidentiality", "Non-repudiation", "Integrity"],a:3,d:1,e:"Integrity ensures data remains accurate and unmodified. Unauthorized modification of records is a direct integrity violation. Hashing and digital signatures are primary integrity controls."},
{q:"Redundant servers and automatic failover BEST support which CIA component?",o:["Confidentiality", "Integrity", "Non-repudiation", "Availability"],a:3,d:1,e:"Availability ensures systems are accessible when needed. Redundancy eliminates single points of failure. If one server fails, the redundant server takes over without interruption."},
{q:"A digital signature applied to an email PRIMARILY provides which security property?",o:["Confidentiality", "Availability", "Integrity and non-repudiation", "Speed"],a:2,d:1,e:"Digital signatures provide integrity (message was not altered) and non-repudiation (sender cannot deny sending it). They use asymmetric cryptography — the sender's private key signs, recipients verify with the public key."},
{q:"Hashing a file and storing the hash value to verify later changes is PRIMARILY a control for which CIA component?",o:["Confidentiality", "Availability", "Authentication", "Integrity"],a:3,d:1,e:"Hashing verifies integrity. If the file hash matches the stored hash, the file has not been altered. Any modification changes the hash value. MD5, SHA-1, and SHA-256 are common hash algorithms (SHA-256 recommended)."},
{q:"Which CIA component does a backup solution PRIMARILY address?",o:["Confidentiality", "Integrity", "Availability", "Non-repudiation"],a:2,d:1,e:"Backups support availability by enabling recovery when primary systems fail or data is lost. They ensure data and services can be restored. Backups should be tested regularly to confirm they actually work."},
{q:"Data encryption at rest AND in transit addresses which CIA components?",o:["Integrity and availability", "Confidentiality and integrity", "Confidentiality only", "Availability and non-repudiation"],a:1,d:1,e:"Encryption at rest and in transit primarily protects confidentiality. However, authenticated encryption (like AES-GCM) also provides integrity by detecting tampering. Both forms of encryption are needed for comprehensive data protection."},
{q:"An organization implements RAID to ensure data remains accessible during disk failures. Which CIA component does this PRIMARILY support?",o:["Confidentiality", "Integrity", "Availability", "Non-repudiation"],a:2,d:1,e:"RAID (Redundant Array of Independent Disks) improves availability by allowing continued operation if a disk fails. RAID 1 mirrors data; RAID 5 uses parity. These ensure data remains accessible even with hardware failures."},
{q:"Access control lists that prevent unauthorized users from reading files PRIMARILY address which CIA component?",o:["Integrity", "Availability", "Non-repudiation", "Confidentiality"],a:3,d:1,e:"Confidentiality prevents unauthorized disclosure. Access control lists restrict who can read files, directly protecting confidentiality. Authentication and authorization work together to ensure only authorized users access sensitive data."},
{q:"A security guard checking badges at a building entrance is which type of control?",o:["Technical", "Administrative", "Physical", "Corrective"],a:2,d:1,e:"Physical controls use tangible means to protect assets. Security guards, locks, fences, and barriers are physical controls. Technical controls use technology; administrative controls use policies and procedures."},
{q:"Annual security awareness training required by company policy is which control type?",o:["Physical", "Technical", "Administrative", "Compensating"],a:2,d:1,e:"Administrative controls are policy-based and people-focused. Training, policies, procedures, and background checks are administrative. They set expectations and educate, but enforcement typically requires technical or physical controls."},
{q:"A firewall blocking unauthorized network traffic is which control type?",o:["Physical", "Administrative", "Corrective", "Technical"],a:3,d:1,e:"Technical (logical) controls use technology. Firewalls, antivirus, encryption, access controls, and IDS/IPS are technical controls. They automate enforcement of security policies."},
{q:"After a virus infection, restoring systems from backups is which control function?",o:["Preventive", "Detective", "Deterrent", "Corrective"],a:3,d:1,e:"Corrective controls restore systems after an incident. Backup restoration, patching vulnerabilities, and removing malware are corrective actions. They return systems to a known-good state."},
{q:"A 'This area is monitored by CCTV' sign is which control function?",o:["Preventive", "Detective", "Deterrent", "Corrective"],a:2,d:1,e:"Deterrent controls discourage attacks by signaling consequences. Warning signs, security camera notices, and legal warnings deter potential attackers. They don't prevent attacks but reduce the likelihood by creating psychological barriers."},
{q:"Security cameras that record activity are PRIMARILY which control function?",o:["Preventive", "Deterrent", "Detective", "Corrective"],a:2,d:1,e:"Detective controls identify and record events. Security cameras detect and document activity. While they also deter, their primary security function is detection — providing evidence of what occurred."},
{q:"A control used when the primary control cannot be implemented is called a:",o:["Corrective control", "Detective control", "Compensating control", "Directive control"],a:2,d:1,e:"Compensating controls substitute for primary controls that aren't feasible. For example, enhanced monitoring might compensate for inability to implement MFA on legacy systems. They must provide equivalent security."},
{q:"Antivirus software stopping malware before it infects a system is which control function?",o:["Corrective", "Detective", "Preventive", "Compensating"],a:2,d:1,e:"Preventive controls stop security events before they occur. Antivirus blocking malware, firewalls rejecting malicious traffic, and encryption preventing eavesdropping are preventive. They are the first line of defense."},
{q:"A control that combines technical enforcement with a policy mandate is BEST classified as:",o:["Single-layer control", "Administrative and technical control", "Physical control", "Compensating control"],a:1,d:1,e:"Many effective controls combine types. A password policy (administrative) enforced by a password manager (technical) provides stronger protection than either alone. Defense in depth combines multiple control types."},
{q:"Which control type is HARDEST to bypass through social engineering?",o:["Administrative", "Technical", "Physical", "Compensating"],a:2,d:1,e:"Technical controls operate independently of human decisions, making them resistant to social engineering. An encrypted drive remains protected even if an employee is tricked — the attacker still needs the key. Administrative controls rely on human behavior, which can be manipulated."},
{q:"Monitoring and logging user activities on a system is which control type?",o:["Preventive", "Corrective", "Deterrent", "Detective"],a:3,d:1,e:"Logging is a detective control — it identifies and records security events for later review. Logs don't prevent incidents but provide evidence for investigation. Centralized log management via SIEM enhances detective capability."},
{q:"An organization formally documents a risk and decides to accept it without further controls. This is called:",o:["Risk avoidance", "Risk mitigation", "Risk transfer", "Risk acceptance"],a:3,d:1,e:"Risk acceptance is a documented decision to tolerate a risk. It's appropriate when mitigation costs exceed potential impact. The risk must be formally acknowledged, not simply ignored."},
{q:"Purchasing cyber insurance to cover potential losses is which risk response?",o:["Risk avoidance", "Risk mitigation", "Risk acceptance", "Risk transfer"],a:3,d:1,e:"Risk transfer shifts financial consequences to another party. Insurance is the most common form. The organization still faces the threat but insurance covers financial losses. Note: you cannot transfer liability, only financial risk."},
{q:"Patching a known vulnerability to reduce exploitation probability is which risk response?",o:["Risk avoidance", "Risk transfer", "Risk acceptance", "Risk mitigation"],a:3,d:1,e:"Risk mitigation reduces the likelihood or impact of risks through controls. Patching reduces the probability of exploitation. Installing MFA, encrypting data, and training employees are all mitigation strategies."},
{q:"Discontinuing an online service because the security risk is too high is which risk response?",o:["Risk mitigation", "Risk transfer", "Risk avoidance", "Risk acceptance"],a:2,d:1,e:"Risk avoidance eliminates risk by discontinuing the activity that creates it. When risk exceeds acceptable levels and mitigation is insufficient, avoidance may be the only option. This eliminates the risk but also the business activity."},
{q:"A threat actor combined with a vulnerability creates:",o:["A control", "Risk", "An impact", "An asset"],a:1,d:1,e:"Risk = Threat + Vulnerability + Impact. A threat exploiting a vulnerability results in potential harm (impact). All three components must exist for risk to be present. Removing any one component eliminates the risk."},
{q:"Which term describes the probability that a threat will successfully exploit a vulnerability?",o:["Impact", "Likelihood/Probability", "Risk appetite", "Residual risk"],a:1,d:1,e:"Likelihood (or probability) represents the chance that a threat will successfully exploit a vulnerability in a given time period. Combined with impact, it determines risk level. High likelihood + high impact = critical risk priority."},
{q:"After implementing security controls, the remaining risk is called:",o:["Inherent risk", "Residual risk", "Accepted risk", "Transferred risk"],a:1,d:1,e:"Residual risk is the risk remaining after controls are applied. No control eliminates risk entirely. Organizations must decide whether residual risk is within their risk tolerance. If not, additional controls are needed."},
{q:"The risk that exists before any controls are applied is called:",o:["Residual risk", "Accepted risk", "Inherent risk", "Transferred risk"],a:2,d:1,e:"Inherent risk is the natural risk level of an activity without controls. Controls reduce inherent risk to residual risk. Understanding inherent risk helps prioritize which assets need the strongest controls."},
{q:"An organization's decision that it can tolerate losing up to $50,000 per year to fraud represents its:",o:["Risk capacity", "Risk tolerance", "Risk avoidance", "Risk transfer"],a:1,d:1,e:"Risk tolerance is the acceptable variation from risk objectives — the threshold an organization is willing to accept. Risk appetite is broader (strategic direction); risk tolerance is the specific quantified limit. Risk capacity is the maximum possible to bear."},
{q:"A vulnerability assessment differs from a risk assessment in that vulnerability assessment:",o:["Identifies threat actors", "Identifies technical weaknesses without measuring business impact", "Calculates financial impact", "Determines risk appetite"],a:1,d:1,e:"Vulnerability assessments focus on finding technical weaknesses in systems. Risk assessments are broader — they consider vulnerabilities, threats, likelihood, and business impact to prioritize risks. Vulnerability assessment results feed into risk assessments."},
{q:"The process of verifying a claimed identity is called:",o:["Identification", "Authorization", "Authentication", "Accountability"],a:2,d:1,e:"Authentication verifies that someone is who they claim to be. After identification (presenting a claim) comes authentication (proving the claim). Without authentication, anyone could claim any identity."},
{q:"Determining what an authenticated user is allowed to do is called:",o:["Identification", "Authentication", "Non-repudiation", "Authorization"],a:3,d:1,e:"Authorization determines access rights after authentication confirms identity. Access control lists, permission sets, and role assignments implement authorization. The principle of least privilege should guide authorization decisions."},
{q:"A username presented to a system PRIMARILY represents which concept?",o:["Authentication", "Authorization", "Identification", "Accountability"],a:2,d:1,e:"Identification is presenting an identity claim — a username says 'I am this person.' Authentication then verifies that claim (password, biometric, etc.). Identification without authentication provides no real security."},
{q:"Non-repudiation ensures that:",o:["Data cannot be modified", "Users cannot deny actions they performed", "Systems remain available", "Data remains confidential"],a:1,d:1,e:"Non-repudiation prevents denial of actions. Digital signatures, audit logs, and transaction records provide non-repudiation. Critical in financial transactions and legal contexts where parties might later dispute their actions."},
{q:"Which concept holds users responsible for their actions on a system?",o:["Authentication", "Authorization", "Identification", "Accountability"],a:3,d:1,e:"Accountability assigns responsibility for actions. Unique user IDs, audit logs, and monitoring enable accountability. Without accountability, there's no way to attribute actions to individuals — making investigation impossible."},
{q:"Collecting only the minimum personal data needed for a specific purpose demonstrates which privacy principle?",o:["Purpose limitation", "Data minimization", "Accuracy", "Storage limitation"],a:1,d:1,e:"Data minimization requires collecting only what's absolutely necessary. Less data means less risk — fewer records to breach, less regulatory exposure. This is a core GDPR principle."},
{q:"A company uses customer email addresses for a newsletter but then sells them to advertisers. This violates which privacy principle?",o:["Data minimization", "Accuracy", "Purpose limitation", "Integrity"],a:2,d:1,e:"Purpose limitation requires data be used only for the specific purpose it was collected. Using emails for a newsletter but then selling them to advertisers is a different, unauthorized purpose — a clear privacy violation."},
{q:"The right of individuals to request correction of inaccurate personal data is based on which privacy principle?",o:["Data minimization", "Purpose limitation", "Accuracy", "Storage limitation"],a:2,d:1,e:"Accuracy requires personal data be correct and up-to-date. Individuals have the right to correct inaccurate records. Outdated or incorrect data can harm individuals — wrong medical records, incorrect credit information."},
{q:"Which regulation primarily protects the privacy of EU citizens' personal data?",o:["HIPAA", "CCPA", "PCI DSS", "GDPR"],a:3,d:1,e:"GDPR (General Data Protection Regulation) is the EU's comprehensive privacy law. It gives EU citizens rights over their data including access, correction, deletion, and data portability. Organizations worldwide must comply when processing EU citizens' data."},
{q:"A US healthcare provider must protect patient health information under which regulation?",o:["GDPR", "PCI DSS", "HIPAA", "SOX"],a:2,d:1,e:"HIPAA (Health Insurance Portability and Accountability Act) requires US healthcare entities to protect Protected Health Information (PHI). It sets standards for electronic records, access controls, and breach notification."},
{q:"The California Consumer Privacy Act (CCPA) primarily gives California residents the right to:",o:["Free credit monitoring", "Know what personal data is collected and request its deletion", "Opt-out of all digital marketing", "Free data backups"],a:1,d:1,e:"CCPA gives California residents rights to know what personal data is collected about them, request deletion, opt-out of data sales, and not be discriminated against for exercising these rights. It's similar to GDPR but specific to California."},
{q:"Privacy by design means:",o:["Adding privacy controls after system development", "Considering and building privacy protections into systems from the beginning", "Using privacy policies to satisfy legal requirements", "Encrypting all data at rest"],a:1,d:1,e:"Privacy by design integrates privacy protections throughout the entire design and development process — not added afterward. It considers privacy from the start, making it a core feature rather than an afterthought."},
{q:"Data subjects under GDPR have a 'right to be forgotten' which means:",o:["They can request their data be encrypted", "They can request deletion of their personal data", "They can access all data held about them", "They can deny any data collection"],a:1,d:1,e:"The right to erasure (right to be forgotten) allows individuals to request deletion of their personal data. Organizations must comply unless they have legal grounds to retain it. This right applies when data is no longer necessary or consent is withdrawn."},
{q:"A security policy that states 'All sensitive data must be encrypted' is BEST classified as a:",o:["Procedure", "Guideline", "Standard", "Policy"],a:3,d:1,e:"A policy is a high-level statement of management intent. It states WHAT must be done but not HOW. Standards, procedures, and guidelines provide implementation details. Policies are mandatory; guidelines are recommendations."},
{q:"A step-by-step document explaining exactly how to configure firewall rules is BEST classified as a:",o:["Policy", "Standard", "Procedure", "Guideline"],a:2,d:1,e:"Procedures provide step-by-step instructions for specific tasks. They detail exactly how to implement a control. Policies state requirements; standards define minimum levels; procedures explain how to comply."},
{q:"A minimum security configuration that all web servers must meet is BEST classified as a:",o:["Policy", "Standard", "Procedure", "Guideline"],a:1,d:1,e:"Standards define mandatory minimum requirements. Security baselines and benchmarks are standards. They translate policy requirements into specific, measurable configurations. Unlike guidelines, standards are mandatory."},
{q:"Which security framework is widely used for organizing cybersecurity practices around Identify, Protect, Detect, Respond, and Recover?",o:["ISO 27001", "PCI DSS", "NIST Cybersecurity Framework", "COBIT"],a:2,d:1,e:"The NIST Cybersecurity Framework (CSF) organizes security activities into five functions: Identify, Protect, Detect, Respond, and Recover. It provides a common language for managing cybersecurity risk and is widely adopted across industries."},
{q:"ISO 27001 is an international standard for:",o:["Payment card security", "Healthcare data privacy", "Information Security Management Systems (ISMS)", "Cloud security"],a:2,d:1,e:"ISO 27001 provides requirements for establishing, implementing, maintaining, and continually improving an Information Security Management System. Organizations can be certified against it, demonstrating their security program meets international standards."},
{q:"The PRIMARY purpose of security governance is to:",o:["Implement technical security controls", "Align security strategy with business objectives and provide oversight", "Conduct penetration tests", "Manage security incidents"],a:1,d:1,e:"Security governance ensures security strategy aligns with business objectives and that appropriate oversight exists. It includes defining roles, setting policies, and ensuring accountability. Without governance, security activities may not support business needs."},
{q:"Which data classification level requires the MOST protection?",o:["Public", "Internal", "Confidential", "Restricted/Top Secret"],a:3,d:1,e:"The most sensitive classification (Restricted or Top Secret in government, or equivalent in commercial contexts) requires the strongest protections — need-to-know access, encryption, strict handling. Public data requires little protection; classification guides appropriate controls."},
{q:"The process of categorizing data by sensitivity to apply appropriate controls is called:",o:["Data governance", "Data mapping", "Data classification", "Data labeling"],a:2,d:1,e:"Data classification categorizes data by sensitivity level (Public, Internal, Confidential, Restricted) so appropriate controls can be applied. Highly sensitive data gets stronger encryption, stricter access, and more careful handling than public data."},
{q:"An organization's rules for acceptable use of its IT resources is documented in a(n):",o:["Risk assessment", "Business continuity plan", "Acceptable Use Policy (AUP)", "Security architecture document"],a:2,d:1,e:"An Acceptable Use Policy defines what employees may and may not do with organizational IT resources. It covers internet use, email, software installation, and data handling. Violations can lead to disciplinary action."},
{q:"Which principle requires that critical tasks be divided among multiple people to prevent fraud?",o:["Least privilege", "Separation of duties", "Need to know", "Dual control"],a:1,d:1,e:"Separation of duties divides critical tasks so no single person controls an entire process. The person who requests a payment should not approve it. This is a fundamental fraud prevention control in financial environments."},
{q:"Least privilege and need-to-know differ in that:",o:["They are the same concept", "Least privilege limits access rights; need-to-know limits access to specific information", "Need-to-know applies to technical systems; least privilege applies to data", "Least privilege is for admins; need-to-know is for regular users"],a:1,d:1,e:"Least privilege limits the access rights (permissions) a user has. Need-to-know limits access to specific information even within those rights. A user might have read access to a database (least privilege) but only need-to-know data relevant to their specific role."},
{q:"Defense in depth is BEST described as:",o:["Using the strongest single control possible", "Multiple overlapping security controls so failure of one doesn't compromise security", "Focusing all resources on perimeter security", "Encrypting everything"],a:1,d:1,e:"Defense in depth layers multiple controls. If a perimeter firewall is breached, internal segmentation, endpoint protection, and access controls provide additional defense. No single control is perfect; layers compensate for individual weaknesses."},
{q:"Separation of duties prevents which type of attack?",o:["External hacking", "Insider fraud and error", "Phishing", "Malware infection"],a:1,d:1,e:"Separation of duties primarily prevents insider fraud and errors. If one person must collude with another to commit fraud, the likelihood decreases significantly. It's particularly important in financial and IT operations."},
{q:"A security program that identifies, assesses, and prioritizes risks to organizational assets is called:",o:["Incident response", "Vulnerability management", "Risk management", "Change management"],a:2,d:1,e:"Risk management is a systematic process of identifying, assessing, and responding to risks to organizational assets. It enables informed decisions about security investments and prioritization of controls based on actual risk levels."},
{q:"An organization researches industry best practices before implementing security controls. This demonstrates:",o:["Due care", "Due diligence", "Liability management", "Risk acceptance"],a:1,d:1,e:"Due diligence is the 'knowing' component — researching, planning, and understanding what needs to be done. It precedes implementation. Due care is the 'doing' component — actually implementing appropriate controls."},
{q:"Promptly patching known vulnerabilities and training employees on security policies demonstrates:",o:["Due diligence", "Non-repudiation", "Risk transfer", "Due care"],a:0,d:1,e:"Due care is active implementation of appropriate protections. Patching and training demonstrate that the organization is doing what's necessary to protect assets. Failure to exercise due care can constitute negligence."},
{q:"An organization that fails to implement known reasonable security controls when a breach occurs may be accused of:",o:["Risk transfer", "Due care", "Negligence", "Risk avoidance"],a:2,d:1,e:"Negligence is failure to exercise due care — not implementing reasonable controls. If a breach occurs and the organization had not taken basic known precautions, legal liability can result. Due care and due diligence together demonstrate reasonable protection efforts."},
{q:"According to ISC2's Code of Ethics, what is the HIGHEST priority canon?",o:["Act honorably, honestly, justly, responsibly, and legally", "Provide diligent and competent service to principals", "Protect society, the common good, necessary public trust, and the infrastructure", "Advance and protect the profession"],a:2,d:1,e:"The four ISC2 ethics canons are listed in priority order. Canon 1 — protect society — takes precedence over all others. When canons conflict, the higher-priority canon wins. Public protection trumps client loyalty."},
{q:"An ISC2 member discovers their employer is conducting illegal surveillance. What should they do?",o:["Keep it confidential to protect the employer", "Report it to management only", "Take no action unless directly involved", "Report to appropriate authorities — Canon 1 requires protecting society"],a:3,d:1,e:"Canon 1 (protect society) requires action even if it harms the employer relationship. Illegal activity that harms society must be reported. Canon 2 (act honorably and legally) also requires reporting. Client loyalty (Canon 3) cannot override these higher priorities."},
{q:"Providing cybersecurity services beyond your area of expertise violates which ISC2 ethics canon?",o:["Canon 1 — protect society", "Canon 2 — act honorably", "Canon 3 — provide diligent and competent service", "Canon 4 — advance the profession"],a:2,d:1,e:"Canon 3 requires providing competent service — only undertaking work within your knowledge and skill level. Providing services beyond competence risks harm to clients and the profession. If needed, refer to or collaborate with someone who has the required expertise."},
{q:"An ISC2 member who misrepresents their credentials violates which ethics canon?",o:["Canon 1", "Canon 2 — act honorably, honestly, justly", "Canon 3", "Canon 4"],a:1,d:1,e:"Canon 2 requires acting honorably and honestly. Misrepresenting credentials is dishonest and a direct ethics violation. It also potentially harms clients (Canon 3) and damages the profession's reputation (Canon 4)."},
{q:"Which cryptographic concept ensures that the same plaintext always produces a different ciphertext?",o:["Key length", "Initialization vector (IV)", "Hash function", "Digital signature"],a:1,d:1,e:"An Initialization Vector (IV) is a random value used with symmetric encryption to ensure identical plaintexts produce different ciphertexts. Without IVs, patterns in plaintext could be identified in ciphertext. Stream cipher modes and CBC mode use IVs."},
{q:"Symmetric encryption uses:",o:["One key pair (public and private)", "The same key for encryption and decryption", "A hash function for encryption", "Digital certificates"],a:1,d:1,e:"Symmetric encryption uses one key for both encryption and decryption. AES is the most common symmetric algorithm. It's fast for bulk data but requires secure key exchange. The key distribution challenge is symmetric encryption's main weakness."},
{q:"Asymmetric encryption uses:",o:["The same key for encryption and decryption", "One key to encrypt and a different key to decrypt", "Only public keys", "Hash functions"],a:1,d:1,e:"Asymmetric (public key) encryption uses a key pair — the public key encrypts, the private key decrypts. This solves the key distribution problem. RSA and ECC are common asymmetric algorithms. It's slower than symmetric, so often used just for key exchange."},
{q:"A hash function is PRIMARILY used for:",o:["Encrypting data", "Generating key pairs", "Verifying data integrity", "Authenticating users"],a:2,d:1,e:"Hash functions produce a fixed-length digest from variable input. Any change to input produces a completely different hash. Used for password storage, file integrity verification, and digital signatures. MD5 and SHA-1 are deprecated; SHA-256 is recommended."},
{q:"Which algorithm is currently recommended as the most secure symmetric encryption standard?",o:["DES", "3DES", "RC4", "AES-256"],a:3,d:1,e:"AES (Advanced Encryption Standard) with 256-bit keys is the current gold standard for symmetric encryption. DES (56-bit) is broken. 3DES is deprecated. RC4 has known vulnerabilities. AES-256 is approved for top secret data by the NSA."},
{q:"Public Key Infrastructure (PKI) uses digital certificates to:",o:["Store encryption keys", "Bind a public key to an identity and enable verification", "Encrypt email attachments", "Manage user passwords"],a:1,d:1,e:"PKI uses Certificate Authorities (CAs) to issue digital certificates that bind public keys to verified identities. When you receive someone's certificate, you can verify their identity through the CA's digital signature on the certificate."},
{q:"Which protocol provides encryption for web traffic between browsers and servers?",o:["HTTP", "FTP", "TLS/SSL", "SMTP"],a:2,d:1,e:"TLS (Transport Layer Security) and its predecessor SSL provide encrypted channels for web traffic. HTTPS = HTTP over TLS. The padlock in browsers indicates TLS is active. TLS 1.3 is current; SSL 3.0, TLS 1.0, and 1.1 are deprecated."},
{q:"A digital certificate contains which of the following?",o:["The owner's private key", "The owner's public key and CA signature", "A shared encryption key", "The owner's password hash"],a:1,d:1,e:"Digital certificates contain the subject's public key, identity information, validity period, and the Certificate Authority's digital signature. The private key is NEVER in a certificate — it stays with the owner. The CA signature enables verification."},
{q:"When a digital certificate is no longer valid before its expiry date, it is:",o:["Archived", "Renewed", "Revoked", "Encrypted"],a:2,d:1,e:"Certificate revocation occurs when a certificate is invalidated before its expiry — due to compromise, personnel changes, or CA key compromise. CRL (Certificate Revocation List) and OCSP (Online Certificate Status Protocol) are mechanisms to check revocation status."},
{q:"Which security concept prevents an entity from denying a transaction after the fact?",o:["Confidentiality", "Integrity", "Non-repudiation", "Availability"],a:2,d:1,e:"Non-repudiation provides proof of origin and delivery so parties cannot deny transactions. Digital signatures on emails, transaction logs, and audit trails all support non-repudiation. Critical in financial systems, contracts, and legal proceedings."},
{q:"What is the PRIMARY goal of a Business Continuity Plan (BCP)?",o:["Restore IT systems after a disaster", "Maintain critical business operations during and after a disruption", "Prevent all possible disasters", "Document recovery procedures for technology systems"],a:1,d:2,e:"BCP ensures that critical business functions continue during disruptions. It addresses people, processes, and technology. DRP (a subset of BCP) focuses specifically on IT recovery. BCP is broader and more strategic."},
{q:"The Recovery Time Objective (RTO) defines:",o:["How much data loss is acceptable", "The target time for restoring a system after a disruption", "The maximum time without business operations", "The time to restore network connectivity"],a:1,d:2,e:"RTO is the maximum acceptable downtime — how quickly a system must be restored after a disruption. If RTO is 4 hours, the system must be operational within 4 hours. RTO drives decisions about backup infrastructure and recovery procedures."},
{q:"The Recovery Point Objective (RPO) defines:",o:["How quickly systems must be restored", "The maximum acceptable data loss measured in time", "The maximum time without business operations", "The recovery team's response time objective"],a:1,d:2,e:"RPO is the maximum amount of data loss acceptable, measured in time. An RPO of 2 hours means backups must occur at least every 2 hours. If a failure occurs, up to 2 hours of data may be lost. RPO drives backup frequency decisions."},
{q:"If an organization's RPO is 4 hours, backups should occur at LEAST:",o:["Every 4 hours or more frequently", "Every 8 hours", "Once daily", "Once weekly"],a:0,d:2,e:"If RPO is 4 hours, at most 4 hours of data can be lost. Backups must occur every 4 hours or more frequently to ensure no more than 4 hours of data is lost. More frequent backups reduce actual data loss but increase cost and complexity."},
{q:"Maximum Tolerable Downtime (MTD) represents:",o:["The RTO plus recovery time", "The absolute maximum time a business process can be offline before causing unacceptable harm", "The time to repair failed equipment", "The duration of a business impact analysis"],a:1,d:2,e:"MTD is the absolute ceiling — the maximum time a process can be unavailable before consequences are unacceptable (legal violations, business failure, safety risks). RTO must always be less than MTD to ensure recovery occurs in time."},
{q:"Which backup type requires the MOST storage but the LEAST time to restore?",o:["Incremental", "Differential", "Full", "Snapshot"],a:2,d:2,e:"Full backups copy all data every time — most storage needed, but restoration is simplest (one tape/file). Incremental uses less storage but requires the full backup plus every incremental in sequence for restoration."},
{q:"To restore from incremental backups, you need:",o:["Only the most recent incremental backup", "The last full backup only", "The last full backup plus all subsequent incremental backups", "The last two incremental backups"],a:2,d:2,e:"Incremental restoration requires the last full backup plus every incremental backup made since, applied in sequence. This takes longer than differential restoration. The advantage is smaller daily backups and faster backup operations."},
{q:"To restore from differential backups, you need:",o:["Only the last differential backup", "The last full backup plus ALL differential backups", "The last full backup plus ONLY the most recent differential", "All differential backups ever made"],a:2,d:2,e:"Differential restoration requires just two things: the last full backup and the most recent differential backup. Differential backups grow larger over time but simplify restoration compared to incremental backups."},
{q:"A warm site recovery facility has:",o:["No equipment — just an empty space with power", "Fully current data and can take over immediately", "Some equipment and systems configured but needs data restoration", "Only generators and network connectivity"],a:2,d:2,e:"A warm site has pre-configured hardware and systems but may need the latest data restored from backups. It's a middle ground — faster recovery than cold sites, cheaper than hot sites. Typical recovery time is hours to days."},
{q:"Which disaster recovery test physically tests operations at the alternate site while keeping the primary site running?",o:["Tabletop exercise", "Structured walkthrough", "Parallel test", "Full interruption test"],a:2,d:2,e:"A parallel test activates the alternate site while primary operations continue. Staff verify the backup site can support operations. Unlike full interruption tests, primary services are not stopped, reducing business risk during the test."},
{q:"A full interruption test involves:",o:["Discussing the DR plan around a table", "Activating the backup site while keeping primary running", "Completely switching operations to the backup site", "Reviewing DR documentation only"],a:2,d:2,e:"A full interruption test completely redirects operations to the backup site, shutting down the primary site. It's the most realistic test but also most disruptive and risky. Organizations typically do full interruption tests only for critical systems rarely, if ever."},
{q:"The FIRST step in the incident response lifecycle is:",o:["Detection and analysis", "Containment", "Eradication", "Preparation"],a:3,d:2,e:"Preparation is the foundation of incident response. This includes creating IR plans, assembling and training the IR team, establishing communication procedures, and deploying detection tools. Without preparation, effective response to actual incidents is nearly impossible."},
{q:"Isolating an infected workstation from the network occurs during which IR phase?",o:["Preparation", "Detection", "Containment", "Recovery"],a:2,d:2,e:"Containment limits the damage and spread of an incident. Isolation, network blocking, and account lockouts are containment actions. The goal is to stop the bleeding without losing forensic evidence. Containment must balance stopping spread with preserving evidence."},
{q:"After removing malware and closing vulnerabilities, the next IR phase is:",o:["Containment", "Detection", "Recovery", "Post-incident activity"],a:2,d:2,e:"The IR phases in order: Preparation → Detection/Analysis → Containment → Eradication → Recovery → Post-Incident Activity. After eradication removes the threat, recovery restores systems to normal operation."},
{q:"A lessons-learned meeting after an incident PRIMARILY aims to:",o:["Determine who is responsible", "Document the incident for legal purposes", "Improve processes and controls to prevent recurrence", "Satisfy regulatory reporting requirements"],a:2,d:2,e:"Post-incident review identifies what went well, what didn't, and how to improve. Root cause analysis, timeline review, and process improvements result from lessons learned. Organizations that don't learn from incidents are likely to repeat them."},
{q:"Which document defines roles, responsibilities, and procedures for responding to security incidents?",o:["Business Continuity Plan", "Disaster Recovery Plan", "Incident Response Plan", "Change Management Plan"],a:2,d:2,e:"An Incident Response Plan (IRP) documents who does what during an incident. It includes contact information, escalation procedures, containment strategies, and communication plans. It must be tested regularly to remain effective."},
{q:"Business Impact Analysis (BIA) PRIMARILY identifies:",o:["Security vulnerabilities in systems", "The financial and operational impact of disruptions to business processes", "Threat actor motivations", "Recovery cost estimates"],a:1,d:2,e:"BIA identifies critical business functions and determines the impact of disrupting them. It establishes MTD, RTO, and RPO for each function. BIA results drive DR/BCP planning by showing which processes need the most protection and fastest recovery."},
{q:"Which term describes a comprehensive plan to ensure business functions continue during a prolonged disruption?",o:["Disaster Recovery Plan", "Business Continuity Plan", "Incident Response Plan", "Crisis Communications Plan"],a:1,d:2,e:"A Business Continuity Plan (BCP) addresses sustained operations during and after significant disruptions. It covers people, processes, facilities, and technology. DRP focuses on IT recovery; BCP is the broader plan."},
{q:"Mean Time Between Failures (MTBF) measures:",o:["How long it takes to repair a failed system", "The average time between system failures", "The maximum acceptable downtime", "The recovery time objective"],a:1,d:2,e:"MTBF is a reliability metric — the average time a system operates between failures. Higher MTBF means more reliable systems. Used to predict failure frequency and plan maintenance schedules. Not a recovery metric like RTO/RPO."},
{q:"Mean Time to Repair (MTTR) measures:",o:["How long until the next failure", "The average time to restore a failed system to operation", "The maximum tolerable downtime", "The recovery point objective"],a:1,d:2,e:"MTTR is the average time required to repair or restore a failed system. Lower MTTR means faster recovery. Organizations improve MTTR through better monitoring, spare parts availability, and documented procedures."},
{q:"An organization stores encrypted backup tapes at a secure offsite location. This PRIMARILY addresses which risk?",o:["Data interception", "Site-level disaster destroying on-site backups", "Insider threats to backup data", "Regulatory compliance"],a:1,d:2,e:"Offsite backup storage protects against site-level disasters (fire, flood, tornado) that could destroy both primary systems and on-site backups simultaneously. Geographic separation is essential for effective disaster recovery."},
{q:"The 3-2-1 backup rule recommends:",o:["3 full backups, 2 incremental, 1 differential", "3 copies of data, on 2 different media types, with 1 copy offsite", "3 backups weekly, 2 monthly, 1 annually", "3 servers, 2 data centers, 1 cloud provider"],a:1,d:2,e:"The 3-2-1 rule: 3 copies of data (primary + 2 backups), stored on 2 different media types, with 1 copy stored offsite. This protects against most failure scenarios including site disasters, media failures, and ransomware."},
{q:"In DAC, who controls access to resources?",o:["The system administrator", "The security officer", "The resource/data owner", "The operating system kernel"],a:2,d:3,e:"Discretionary Access Control gives resource owners control over their resources. Owners decide who can access their files and with what permissions. Windows NTFS is DAC-based. The 'discretionary' means it's at the owner's discretion."},
{q:"MAC is typically found in which environment?",o:["Consumer smartphones", "Government and military systems", "Small business environments", "Social media platforms"],a:1,d:3,e:"MAC (Mandatory Access Control) is used in high-security environments where data classification and clearances are critical — military, intelligence, government. All access is based on labels and clearances enforced by the system, not owners."},
{q:"An attribute-based access control system grants access based on:",o:["Only the user's role", "A combination of user, resource, and environmental attributes", "System-assigned labels and clearances", "Data owner discretion"],a:1,d:3,e:"ABAC evaluates multiple attributes simultaneously. User attributes (clearance, department), resource attributes (classification, owner), and environmental attributes (time, location, device) all contribute to access decisions. Most flexible and granular model."},
{q:"Which access control model would BEST enforce 'no read up, no write down' policies?",o:["DAC", "RBAC", "ABAC", "MAC — Bell-LaPadula model"],a:3,d:3,e:"The Bell-LaPadula model is a MAC-based security model designed for confidentiality. Its rules: no read up (can't read data at higher classification) and no write down (can't write data to lower classification levels). Designed to prevent information flow from high to low security levels."},
{q:"The Biba integrity model focuses on:",o:["Preventing unauthorized reading", "Maintaining data integrity — no read down, no write up", "Preventing unauthorized copying", "Mandatory access based on clearances"],a:1,d:3,e:"Biba is an integrity-focused MAC model. Rules: no read down (can't read lower-integrity data to avoid contamination), no write up (can't write to higher-integrity objects). Prevents low-quality data from contaminating high-integrity data."},
{q:"A time-of-day restriction that prevents after-hours system access is an example of:",o:["DAC", "MAC", "RBAC", "ABAC with temporal constraints"],a:3,d:3,e:"Restricting access based on time is an environmental attribute — a characteristic of ABAC. Temporal constraints are one of many attribute types ABAC can evaluate alongside user roles, device health, location, and more."},
{q:"Which authentication factor category includes PINs and passwords?",o:["Something you have", "Something you are", "Something you know", "Somewhere you are"],a:2,d:3,e:"Something You Know includes passwords, PINs, security questions, and passphrases. This factor is easiest to implement but also most easily compromised — passwords can be guessed, phished, or stolen."},
{q:"A USB hardware security key used for two-factor authentication is which factor type?",o:["Something you know", "Something you have", "Something you are", "Somewhere you are"],a:1,d:3,e:"USB security keys (like YubiKey) are physical tokens — Something You Have. They're more phishing-resistant than OTP codes because they verify the website's authenticity. They implement FIDO2/WebAuthn standards."},
{q:"Fingerprint and iris scan authentication are examples of which factor?",o:["Something you know", "Something you have", "Something you are", "Something you do"],a:2,d:3,e:"Biometric factors (Something You Are) are based on physical characteristics. They're convenient and difficult to share, but they can be spoofed and cannot be 'changed' if compromised. Biometrics verify identity through unique physical traits."},
{q:"Location-based authentication ('somewhere you are') commonly uses:",o:["GPS coordinates", "IP address and network location", "Biometric data", "Security tokens"],a:1,d:3,e:"Location-based authentication uses network location (corporate IP, known geographic region) as a factor. If a login attempt comes from an unexpected country, additional verification is triggered. VPNs can complicate location-based auth."},
{q:"What is the primary advantage of biometric authentication over passwords?",o:["Biometrics are cheaper to implement", "Biometrics cannot be forgotten or easily shared", "Biometrics are more accurate than passwords", "Biometrics can be reset if compromised"],a:1,d:3,e:"Biometrics are inherent to the user — they can't forget them and they're difficult to share. However, they cannot be 'changed' if compromised and may have false acceptance/rejection rates. False Acceptance Rate (FAR) is the most critical security measure."},
{q:"False Acceptance Rate (FAR) in biometric systems measures:",o:["How often authorized users are rejected", "How often unauthorized users are incorrectly accepted", "The speed of biometric processing", "The accuracy of biometric enrollment"],a:1,d:3,e:"FAR is the percentage of times an unauthorized person is incorrectly authenticated. A high FAR is a security vulnerability. False Rejection Rate (FRR) measures how often authorized users are rejected — a usability problem. Crossover Error Rate (CER) balances both."},
{q:"SAML (Security Assertion Markup Language) is primarily used for:",o:["Encrypting network traffic", "Federated identity and SSO between organizations", "Managing user account creation", "Network-based intrusion detection"],a:1,d:3,e:"SAML enables SSO by passing authentication assertions between an Identity Provider (IdP) and Service Providers (SPs). It's widely used for enterprise SSO — users authenticate once to the IdP (corporate directory) and access multiple services."},
{q:"OAuth 2.0 is primarily used for:",o:["Authentication — proving user identity", "Authorization — granting third-party applications limited access to resources", "Encryption of data in transit", "Network access control"],a:1,d:3,e:"OAuth 2.0 is an authorization framework, not authentication. It allows users to grant third-party applications limited access to their resources without sharing credentials. 'Sign in with Google' uses OAuth. OpenID Connect (OIDC) adds authentication on top."},
{q:"Which physical access control creates a small room where one door must close before the next opens?",o:["Turnstile", "Security checkpoint", "Mantrap/access control vestibule", "Biometric gate"],a:2,d:3,e:"A mantrap (access control vestibule) prevents tailgating by allowing only one person to enter at a time. Both doors have separate authentication. If an unauthorized person enters the vestibule, they can be trapped without gaining full access."},
{q:"Piggybacking/tailgating attacks bypass which type of control?",o:["Technical", "Administrative", "Physical", "Detective"],a:2,d:3,e:"Tailgating bypasses physical access controls. An attacker follows an authorized person through a secured door without authenticating. Mantraps, awareness training, and security guards prevent tailgating. Alarms on doors left open too long also help."},
{q:"A security principle requiring user access rights to be reviewed and verified periodically is called:",o:["Access provisioning", "Access recertification", "Privilege escalation", "Identity federation"],a:1,d:3,e:"Access recertification (periodic access review) has managers confirm that employees still need their current access rights. Job changes, transfers, and departures can leave orphaned permissions. Regular review catches excessive or outdated access."},
{q:"When an employee transfers to a different department, their access should be:",o:["Kept the same for convenience", "Immediately revoked and new access provisioned for the new role", "Expanded to cover both old and new responsibilities", "Reviewed within 90 days"],a:1,d:3,e:"Account management best practice: when roles change, access should change. Old access should be revoked and new, appropriate access provisioned. Keeping old access creates privilege creep — users accumulating more access than needed over time."},
{q:"Which concept describes the accumulation of excessive access rights over time as users change roles?",o:["Privilege escalation", "Privilege creep", "Role explosion", "Access sprawl"],a:1,d:3,e:"Privilege creep occurs when users retain old access permissions as they change roles or responsibilities. Without regular access reviews, users accumulate far more access than their current role requires. Periodic recertification addresses privilege creep."},
{q:"An account used by a software application to access databases or services is called a:",o:["Admin account", "Service account", "Guest account", "Power user account"],a:1,d:3,e:"Service accounts are non-human accounts used by applications, services, or automated processes. They typically have specific permissions needed by the application. Service accounts should follow least privilege and have strong, regularly rotated credentials."},
{q:"Password complexity requirements, minimum length, and history are examples of which access control mechanism?",o:["Authentication policies", "Authorization controls", "Account management policies", "Network access controls"],a:2,d:3,e:"Account management policies define password requirements, lockout settings, and account lifecycle rules. These are administrative controls that enforce authentication security. Technical controls (password managers, enforcement systems) implement these policies."},
{q:"Which access control mechanism automatically locks accounts after multiple failed login attempts?",o:["Account lockout policy", "Password history", "CAPTCHA", "Security questions"],a:0,d:3,e:"Account lockout policies prevent brute force attacks by locking accounts after a specified number of failed attempts. This must balance security (preventing brute force) with usability (legitimate users making mistakes). Lockout thresholds typically range from 3-10 attempts."},
{q:"A key card that must be tapped to a reader to grant building access uses which technology?",o:["Smart card with contact interface", "RFID/proximity card", "Biometric card", "Magnetic stripe card"],a:1,d:3,e:"Proximity/RFID cards use radio frequency to communicate with readers without physical contact. They're convenient and widely used for physical access control. Near-field communication (NFC) is used for very short distances (mobile payments)."},
{q:"Which physical security control prevents vehicles from crashing into buildings?",o:["Security cameras", "Bollards", "Turnstiles", "Barricades/bollards"],a:3,d:3,e:"Bollards and barricades are physical barriers preventing vehicle-borne attacks. They protect building perimeters without blocking pedestrian access. Critical infrastructure, government buildings, and crowded venues use bollards as vehicle-ramming deterrents."},
{q:"Lighting as a security control is PRIMARILY which function?",o:["Preventive", "Detective", "Deterrent", "Corrective"],a:2,d:3,e:"Security lighting deters attackers by eliminating concealment. Well-lit areas reduce criminal opportunity — attackers prefer darkness. Lighting also supports detective controls (cameras work better in light). It's primarily deterrent in function."},
{q:"The concept of 'something you know, something you have, and something you are' combined for authentication is called:",o:["Triple-factor authentication", "Multi-factor authentication", "Strong authentication", "Enhanced authentication"],a:1,d:3,e:"Using all three traditional factor types together is multi-factor authentication (specifically three-factor). MFA requires two or more factors from different categories. Combining factors dramatically increases security compared to any single factor."},
{q:"RADIUS is a protocol used for:",o:["Encrypting database connections", "Network access authentication, authorization, and accounting (AAA)", "Remote desktop protocol", "Wireless intrusion detection"],a:1,d:3,e:"RADIUS (Remote Authentication Dial-In User Service) provides centralized AAA for network access. When users connect to VPNs, wireless networks, or dial-up, RADIUS authenticates them against a central directory. Common in enterprise network access control."},
{q:"Which access control approach uses rules set by system administrators based on time, IP, or other criteria?",o:["DAC", "MAC", "RBAC", "Rule-based AC"],a:3,d:3,e:"Rule-based access control uses administrator-defined rules like time of day, source IP, or network connection type. Unlike MAC (which uses labels), rule-based AC uses conditional rules. Often implemented in firewall and router ACLs."},
{q:"The principle of 'closed' or 'default deny' in access control means:",o:["Access is allowed by default unless specifically denied", "Access is denied by default unless specifically permitted", "Accounts are closed after 30 days of inactivity", "Systems close ports by default"],a:1,d:3,e:"Default deny (implicit deny) is a foundational security principle — deny all access unless explicitly permitted. This is more secure than default permit. Firewalls typically use 'deny all, permit what's needed.' This minimizes attack surface."},
{q:"Which identity concept allows users to authenticate once and access resources across multiple organizations?",o:["RBAC", "Federated identity", "Multitenant authentication", "Enterprise SSO"],a:1,d:3,e:"Federated identity enables users to use credentials from one organization to access resources in another (like using your Google account to log into third-party apps). Standards like SAML, OAuth, and OIDC enable federation."},
{q:"Which OSI layer provides end-to-end error detection and flow control?",o:["Network (Layer 3)", "Transport (Layer 4)", "Session (Layer 5)", "Data Link (Layer 2)"],a:1,d:4,e:"Transport Layer (Layer 4) manages end-to-end communication. TCP provides reliable delivery with error detection, flow control, and retransmission. UDP provides faster but unreliable delivery. This layer handles segmentation and reassembly."},
{q:"Which OSI layer handles logical addressing and routing of packets?",o:["Transport (Layer 4)", "Network (Layer 3)", "Data Link (Layer 2)", "Physical (Layer 1)"],a:1,d:4,e:"The Network Layer (Layer 3) handles logical addressing (IP addresses) and routing. Routers are Layer 3 devices. IP, ICMP, and routing protocols operate at this layer. Layer 3 makes end-to-end delivery across multiple networks possible."},
{q:"Which OSI layer handles physical addressing using MAC addresses?",o:["Network (Layer 3)", "Transport (Layer 4)", "Data Link (Layer 2)", "Physical (Layer 1)"],a:2,d:4,e:"The Data Link Layer (Layer 2) uses MAC addresses for local network delivery. Switches operate at Layer 2. Ethernet frames include source and destination MAC addresses. Layer 2 handles reliable delivery within the same network segment."},
{q:"TCP's three-way handshake sequence is:",o:["SYN → ACK → SYN-ACK", "SYN → SYN-ACK → ACK", "ACK → SYN → SYN-ACK", "SYN-ACK → ACK → SYN"],a:1,d:4,e:"TCP connection establishment uses SYN → SYN-ACK → ACK. Client sends SYN, server responds with SYN-ACK, client confirms with ACK. This ensures both sides can send and receive before data transfer begins. Termination uses FIN flags."},
{q:"Which protocol provides connectionless, unreliable but fast data transmission?",o:["TCP", "HTTP", "SMTP", "UDP"],a:3,d:4,e:"UDP (User Datagram Protocol) is connectionless and doesn't guarantee delivery or order. It's faster than TCP because it has no overhead for connection establishment or acknowledgment. Used for streaming, gaming, DNS, and VoIP."},
{q:"Which port does DNS use by default?",o:["25", "80", "443", "53"],a:3,d:4,e:"DNS uses port 53 (both TCP and UDP). UDP/53 for queries; TCP/53 for zone transfers and large responses. DNS is critical infrastructure — DNS poisoning and DDoS attacks on DNS servers can take down internet connectivity."},
{q:"Which port does SMTP use for email transmission?",o:["25", "110", "143", "443"],a:0,d:4,e:"SMTP (Simple Mail Transfer Protocol) uses port 25 for server-to-server email transmission. Port 587 is used for client submission (with authentication). SMTP transmits email in plaintext — STARTTLS adds encryption."},
{q:"POP3 is used for:",o:["Sending email", "Receiving/downloading email from mail server", "Securing email with certificates", "Filtering spam email"],a:1,d:4,e:"POP3 (Post Office Protocol 3, port 110) downloads email from servers to local clients and typically deletes from server. IMAP (port 143) synchronizes email across multiple devices while keeping it on the server. IMAP is preferred for modern multi-device use."},
{q:"Which protocol secures web traffic and uses port 443?",o:["HTTP", "FTP", "SMTP", "HTTPS"],a:3,d:4,e:"HTTPS encrypts HTTP traffic using TLS. Port 443 is the standard HTTPS port. The TLS handshake negotiates encryption algorithms and exchanges keys. TLS 1.3 is current; SSL and older TLS versions are deprecated."},
{q:"FTP's main security concern is that it:",o:["Cannot transfer large files", "Transmits credentials and data in plaintext", "Does not support authentication", "Requires a special client application"],a:1,d:4,e:"FTP transmits usernames, passwords, and file contents in plaintext. Anyone on the network can capture credentials with a packet analyzer. SFTP (uses SSH, port 22) or FTPS (FTP over TLS) should be used instead of plain FTP."},
{q:"Which protocol provides encrypted remote command-line access to systems?",o:["Telnet (port 23)", "RDP (port 3389)", "SSH (port 22)", "FTP (port 21)"],a:2,d:4,e:"SSH (port 22) provides encrypted remote access. It encrypts all data including credentials. SSH replaced Telnet, which transmits everything in plaintext. SSH supports key-based authentication, which is more secure than passwords."},
{q:"Remote Desktop Protocol (RDP) uses which port?",o:["22", "443", "3389", "8080"],a:2,d:4,e:"RDP uses port 3389 to provide graphical remote access to Windows systems. RDP has been targeted by many attacks — BlueKeep, credential brute force, and MitM attacks. RDP should be placed behind VPN or require MFA."},
{q:"Which network device filters traffic based on IP addresses, ports, and protocols?",o:["Switch", "Hub", "Router", "Firewall"],a:3,d:4,e:"Firewalls filter traffic using rules (ACLs). Packet filter firewalls use source/destination IP, port, and protocol. Stateful firewalls track connection state. NGFWs add application awareness and deep packet inspection."},
{q:"A stateful firewall maintains a:",o:["List of blocked IP addresses", "Connection state table to track active sessions", "Log of all denied packets", "Dictionary of known malware signatures"],a:1,d:4,e:"Stateful firewalls maintain connection state tables. They allow return traffic for established connections without requiring separate rules. If traffic is part of an established allowed connection, it's permitted. This is smarter than simple packet filtering."},
{q:"A Next-Generation Firewall (NGFW) differs from traditional firewalls by:",o:["Using faster hardware", "Adding application identification, user identity awareness, and SSL inspection", "Only filtering at Layer 3", "Not using rules"],a:1,d:4,e:"NGFWs operate at Layer 7, identifying applications regardless of port. They can block Facebook but allow LinkedIn on the same port 80. They include IPS, SSL inspection, and user-aware policies. Traditional firewalls only see ports and IPs."},
{q:"A network IDS detects attacks by:",o:["Blocking suspicious traffic automatically", "Comparing traffic to known attack signatures and alerting", "Limiting bandwidth on suspicious connections", "Redirecting suspicious traffic to a honeypot"],a:1,d:4,e:"Network IDS monitors traffic and compares it to signatures (known attack patterns) or baselines (anomaly detection). It generates alerts but doesn't block traffic. IPS is deployed inline and actively blocks. NIDS sees network traffic; HIDS monitors hosts."},
{q:"Signature-based intrusion detection works by:",o:["Establishing normal behavior baselines", "Matching traffic against a database of known attack patterns", "Analyzing statistical anomalies", "Using machine learning to detect threats"],a:1,d:4,e:"Signature-based detection identifies known attacks by pattern matching. It's effective for known threats but blind to zero-days (new attacks with no existing signature). Must be updated regularly. Anomaly-based detection catches unknown threats but has more false positives."},
{q:"A honeypot is used to:",o:["Block attackers from reaching real systems", "Monitor and study attacker techniques in an isolated environment", "Filter spam email", "Accelerate legitimate network traffic"],a:1,d:4,e:"Honeypots are decoy systems designed to attract attackers. They have no legitimate users — any activity is suspicious. They provide intelligence on attack techniques and early warning of attacks. Honeynets are networks of honeypots."},
{q:"Which attack type exhausts system resources by flooding with more requests than can be handled?",o:["Man-in-the-middle", "SQL injection", "Denial of Service (DoS)", "Phishing"],a:2,d:4,e:"DoS attacks overwhelm systems with traffic, exhausting bandwidth, CPU, memory, or connections. This prevents legitimate users from accessing services. DDoS uses botnets for massive attack scale. Mitigation includes rate limiting, CDNs, and scrubbing centers."},
{q:"A SYN flood attack exploits:",o:["DNS resolution", "TCP's three-way handshake by sending many SYN packets without completing handshakes", "HTTP protocol weaknesses", "Authentication mechanisms"],a:1,d:4,e:"SYN floods send many SYN packets to fill a server's connection queue, preventing legitimate connections. Without ACKs, the server waits for connections that never complete. SYN cookies mitigate SYN floods by not allocating resources until the handshake completes."},
{q:"ARP poisoning attacks target which network function?",o:["DNS name resolution", "IP routing", "MAC address resolution / ARP cache", "TLS certificate validation"],a:2,d:4,e:"ARP (Address Resolution Protocol) maps IP addresses to MAC addresses. ARP poisoning sends fake ARP replies, associating the attacker's MAC with a legitimate IP. This enables man-in-the-middle attacks on local networks. Dynamic ARP Inspection (DAI) prevents it."},
{q:"DNS poisoning attacks aim to:",o:["Disable DNS servers", "Redirect users to malicious sites by corrupting DNS records", "Enumerate DNS zone records", "Brute force DNS passwords"],a:1,d:4,e:"DNS poisoning corrupts DNS cache entries, redirecting legitimate domain name queries to attacker-controlled IP addresses. Users type the correct address but end up at a fake site. DNSSEC adds cryptographic authentication to DNS to prevent poisoning."},
{q:"Which attack secretly redirects traffic between two parties without their knowledge?",o:["Denial of Service", "Man-in-the-middle (MitM)", "SQL injection", "Brute force"],a:1,d:4,e:"MitM attacks position the attacker between communicating parties. The attacker can read, modify, or inject data into communications. Encryption (TLS) protects against MitM by authenticating both parties and encrypting data. VPNs on untrusted networks prevent MitM."},
{q:"Encryption PRIMARILY protects against which network attack?",o:["DoS attacks", "MitM data interception", "SQL injection", "Buffer overflow"],a:1,d:4,e:"Encryption protects data from being read if intercepted. Even if a MitM attacker captures encrypted traffic, they cannot read it without the decryption key. Encryption doesn't prevent interception but renders captured data useless."},
{q:"Which type of malware spreads across networks by exploiting vulnerabilities without user interaction?",o:["Trojan horse", "Virus", "Worm", "Adware"],a:2,d:4,e:"Worms self-replicate across networks without requiring user action or a host program. WannaCry exploited SMB vulnerabilities to spread automatically. Unlike viruses, worms don't need to attach to files. Network segmentation limits worm spread."},
{q:"A rootkit is particularly dangerous because it:",o:["Encrypts files for ransom", "Operates at the kernel level, hiding itself from detection", "Spreads automatically across networks", "Displays unwanted advertisements"],a:1,d:4,e:"Rootkits operate at the operating system kernel level, giving them the ability to hide themselves and other malware from security tools. Detecting rootkits is difficult because they can modify the OS itself. Bootkit variants persist even through OS reinstallation."},
{q:"Which email security standard specifies which mail servers can send email for a domain?",o:["DKIM", "DMARC", "SPF", "S/MIME"],a:2,d:4,e:"SPF (Sender Policy Framework) uses DNS TXT records to list authorized mail servers for a domain. Receiving servers check if the sending server's IP is in the SPF record. SPF alone doesn't prevent header spoofing but is part of the anti-spoofing trilogy with DKIM and DMARC."},
{q:"DKIM (DomainKeys Identified Mail) adds which security property to email?",o:["Encryption of email content", "Digital signature allowing receivers to verify message came from the domain", "Spam filtering", "Email header encryption"],a:1,d:4,e:"DKIM adds a digital signature to email headers, allowing receivers to verify that the message was authorized by the sending domain and wasn't modified in transit. The public key is published in DNS. DKIM provides authentication and integrity for email."},
{q:"DMARC builds upon SPF and DKIM to provide:",o:["Email encryption", "Policy specification and reporting for email authentication", "Malware scanning of attachments", "Delivery confirmation"],a:1,d:4,e:"DMARC specifies what receiving mail servers should do when SPF and/or DKIM checks fail — reject, quarantine, or allow. It also provides reporting so domain owners can see authentication results. DMARC is the policy layer that makes SPF and DKIM actionable."},
{q:"VLANs improve security by:",o:["Encrypting all network traffic", "Logically segmenting networks to contain breaches", "Accelerating network performance", "Reducing hardware costs"],a:1,d:4,e:"VLANs create logical network segments. Devices in different VLANs cannot directly communicate without traversing a router or firewall. If one VLAN is compromised, attackers cannot move laterally to other VLANs without additional exploitation."},
{q:"Network Access Control (NAC) solutions:",o:["Replace firewalls for perimeter security", "Verify device compliance before granting network access", "Encrypt all network traffic", "Monitor for intrusions"],a:1,d:4,e:"NAC enforces security policies before devices connect to the network. It checks for current patches, antivirus, and configuration compliance. Non-compliant devices may be quarantined or given limited access until they meet requirements."},
{q:"Which wireless attack captures wireless traffic to analyze encryption and recover keys?",o:["Evil twin", "Deauthentication attack", "War driving", "Packet sniffing"],a:3,d:4,e:"Packet sniffing captures wireless frames for analysis. On open or weakly encrypted networks, attackers can recover credentials and data. WPA3's individual data encryption protects against passive sniffing. HTTPS over Wi-Fi adds another layer of protection."},
{q:"An evil twin attack in wireless networking:",o:["Creates a stronger wireless signal", "Sets up a rogue access point mimicking a legitimate one to intercept traffic", "Deauthenticates legitimate users", "Cracks WPA2 passwords"],a:1,d:4,e:"Evil twin attacks create fake access points with the same SSID as legitimate ones. Users connect thinking it's the real network. All traffic flows through the attacker. Certificate pinning and VPNs mitigate evil twin risks."},
{q:"Which wireless security protocol should be avoided because it has known cryptographic weaknesses?",o:["WPA3", "WPA2", "WPA", "WEP"],a:3,d:4,e:"WEP (Wired Equivalent Privacy) was broken in 2001. Its RC4 implementation has fatal flaws — an attacker with enough captured packets can crack the key in minutes. WEP should never be used. WPA2 (AES/CCMP) is acceptable; WPA3 is preferred."},
{q:"A proxy server placed between internal users and the internet PRIMARILY provides:",o:["VPN-level encryption for all traffic", "Content filtering, caching, and anonymization", "Intrusion detection", "Firewall functionality"],a:1,d:4,e:"Forward proxy servers serve as intermediaries for outbound requests. They can filter content (blocking malicious/inappropriate sites), cache content (improving performance), and hide internal IP addresses (anonymization). Organizations use them for internet access control."},
{q:"Which protocol creates an encrypted tunnel for secure communications over untrusted networks?",o:["HTTP", "FTP", "VPN/IPsec or SSL/TLS", "DNS"],a:2,d:4,e:"VPNs use protocols like IPsec or SSL/TLS to create encrypted tunnels over the internet. Remote workers use VPNs to securely access corporate resources. Split tunneling sends only corporate traffic through VPN; full tunnel sends all traffic."},
{q:"Network segmentation PRIMARILY limits:",o:["Internet access speed", "Lateral movement of attackers who gain access to one segment", "The number of devices on the network", "Administrative complexity"],a:1,d:4,e:"Segmentation limits blast radius when a breach occurs. An attacker who compromises one segment cannot freely move to other segments without traversing additional controls. Flat networks (no segmentation) allow attackers to reach anything once inside."},
{q:"Which type of firewall inspects traffic at the application layer and can identify specific applications?",o:["Packet filter", "Stateful inspection", "Application layer/Next-generation firewall", "Circuit-level gateway"],a:2,d:4,e:"Application layer firewalls (WAF, NGFW) inspect full packet content at Layer 7. They identify applications regardless of port, provide URL filtering, and detect application-layer attacks like SQL injection and XSS."},
{q:"A SIEM system's PRIMARY function is to:",o:["Block network intrusions automatically", "Centralize log collection, correlate events, and alert on suspicious activity", "Encrypt sensitive data", "Manage user accounts"],a:1,d:5,e:"SIEM aggregates logs from firewalls, servers, endpoints, and applications. It correlates events to identify threats invisible in individual logs. An alert firing for a single failed login is noise; SIEM correlating 1000 failed logins across systems is signal."},
