{q:"Which process involves regularly scanning systems for known security weaknesses?",o:["Penetration testing", "Vulnerability scanning", "Risk assessment", "Change management"],a:1,d:5,e:"Vulnerability scanning uses automated tools (Nessus, OpenVAS, Qualys) to identify known weaknesses. It's typically non-exploitative — it identifies but doesn't confirm exploitability. Regular scanning catches new vulnerabilities before attackers exploit them."},
{q:"The PRIMARY difference between vulnerability scanning and penetration testing is:",o:["Penetration testing uses different tools", "Penetration testing attempts exploitation to confirm vulnerabilities and demonstrate real impact", "Vulnerability scanning requires more expertise", "Penetration testing is automated; scanning is manual"],a:1,d:5,e:"Pen testing goes beyond scanning to actually attempt exploitation. It confirms whether vulnerabilities can be exploited and demonstrates potential impact. Pen tests require skilled testers and are typically done less frequently due to cost and complexity."},
{q:"A patch management program PRIMARILY reduces:",o:["Employee errors", "The risk of exploitation through known, unpatched vulnerabilities", "Network bandwidth usage", "Data backup requirements"],a:1,d:5,e:"Patching fixes known vulnerabilities — the most targeted weaknesses. Regular patching is one of the highest-impact security controls. Organizations like CISA's Known Exploited Vulnerabilities catalog shows patches should be prioritized by actual exploitation evidence."},
{q:"Change management in IT security ensures that:",o:["All changes are made by the same team", "Changes are authorized, tested, and documented before implementation", "Changes are made immediately when needed", "Only security changes require approval"],a:1,d:5,e:"Change management prevents unauthorized changes, reduces errors, and maintains audit trails. Even security emergency changes should be documented after the fact. Configuration drift from uncontrolled changes is a leading cause of security incidents."},
{q:"Data Loss Prevention (DLP) solutions focus on:",o:["Recovering data after loss", "Preventing sensitive data from leaving the organization without authorization", "Backing up critical data", "Detecting external intrusions"],a:1,d:5,e:"DLP monitors and controls data movement. It can prevent emails containing credit card numbers, block uploads of sensitive files to personal cloud storage, and alert when PHI is copied to USB drives. Content inspection identifies sensitive data in motion."},
{q:"Which security tool monitors for unauthorized changes to critical operating system files?",o:["SIEM", "Antivirus", "File Integrity Monitoring (FIM)", "DLP"],a:2,d:5,e:"FIM monitors file hashes, permissions, and content. Changes to critical files like /etc/passwd or system binaries are immediately detected. Tripwire is a classic FIM tool. PCI DSS and other frameworks require FIM for critical system files."},
{q:"Proper data destruction for solid-state drives (SSDs) requires:",o:["Standard magnetic degaussing", "A single overwrite pass", "Cryptographic erasure or physical destruction, as degaussing doesn't work on SSDs", "Simple file deletion"],a:2,d:5,e:"SSDs store data differently than magnetic drives — degaussing is ineffective. Cryptographic erasure (encrypting the drive then destroying the key) or physical destruction (shredding) are reliable methods. Simple deletion and formatting leave recoverable data."},
{q:"Degaussing is used to destroy data on:",o:["SSDs", "USB flash drives", "Optical media", "Magnetic storage (HDDs and tapes)"],a:3,d:5,e:"Degaussing uses a strong magnetic field to erase magnetic media. It's effective for HDDs and magnetic tapes but NOT for SSDs, USB drives, or optical media. After degaussing, magnetic drives typically cannot be reused."},
{q:"Which concept involves storing data only as long as needed for its purpose, then securely destroying it?",o:["Data minimization", "Data retention policy", "Data archiving", "Data sovereignty"],a:1,d:5,e:"Data retention policies define how long data must be kept (for legal/regulatory/business requirements) and when it must be destroyed. Retaining unnecessary data increases breach risk and regulatory exposure. The right answer is retaining what's needed and nothing more."},
{q:"A clean desk policy requires:",o:["Desks to be organized for efficiency", "All sensitive materials be secured when not in immediate use", "Specific desk layouts in open offices", "Paperless environments"],a:1,d:5,e:"Clean desk protects against unauthorized access to sensitive information by casual observers, visitors, and unauthorized personnel. Documents, removable media, and access credentials should be secured when not in use. Combined with screen locks, it significantly reduces data exposure."},
{q:"Social engineering attacks succeed PRIMARILY because they exploit:",o:["Unpatched software vulnerabilities", "Human psychology and trust", "Weak network configurations", "Misconfigured firewalls"],a:1,d:5,e:"Social engineering manipulates human behavior rather than exploiting technical weaknesses. Attackers exploit trust, authority, urgency, and fear. Technical controls provide no defense. Security awareness training is the primary countermeasure."},
{q:"Phishing emails PRIMARILY aim to:",o:["Install malware through drive-by downloads", "Steal credentials or trick users into performing harmful actions", "Exploit unpatched browsers", "Intercept network traffic"],a:1,d:5,e:"Phishing deceives users into revealing credentials, clicking malicious links, or downloading malware. Spear phishing targets specific individuals with customized content. Whaling targets executives. Vishing (voice) and smishing (SMS) are related techniques."},
{q:"Which security practice reduces the impact of a single compromised account?",o:["Password complexity requirements", "Multi-factor authentication", "Single sign-on", "Shared accounts"],a:1,d:5,e:"MFA ensures a compromised password alone is insufficient. Even if credentials are phished, the attacker needs the second factor. This dramatically reduces the impact of credential theft — a common root cause of breaches."},
{q:"An organization's security awareness program MOST effectively reduces which threat?",o:["Zero-day malware", "Advanced persistent threats", "Insider threats and social engineering", "Hardware vulnerabilities"],a:2,d:5,e:"Awareness training is the primary defense against social engineering and human error. It helps employees recognize phishing, suspicious requests, and unsafe behaviors. Technical controls can't protect against users willingly giving credentials to attackers."},
{q:"Which process involves reviewing security events to identify potential threats before they become incidents?",o:["Incident response", "Threat hunting", "Forensic analysis", "Change management"],a:1,d:5,e:"Threat hunting is proactive searching for threats that may have evaded automated detection. Hunters develop hypotheses and hunt through logs and endpoint data. Unlike reactive incident response, hunting assumes compromise and looks for evidence of it."},
{q:"Digital forensics PRIMARILY involves:",o:["Recovering lost data from failed hard drives", "Collecting, preserving, and analyzing digital evidence while maintaining legal admissibility", "Scanning systems for malware", "Monitoring network traffic"],a:1,d:5,e:"Digital forensics follows rigorous procedures to ensure evidence is legally admissible. Write blockers prevent modification, cryptographic hashing proves integrity, and chain of custody documentation tracks handling. Forensic evidence may be used in criminal proceedings."},
{q:"Chain of custody documentation tracks:",o:["How data is classified", "Who handled evidence, when, and how — from collection to presentation", "The sequence of events in an incident", "System log retention periods"],a:1,d:5,e:"Chain of custody proves evidence hasn't been tampered with. Every person who handles evidence is documented — when they received it, what they did with it, and when they transferred it. Breaks in chain of custody can make evidence inadmissible in court."},
{q:"Write blockers are used in digital forensics to:",o:["Speed up evidence analysis", "Prevent modification of original evidence during forensic imaging", "Encrypt forensic images", "Connect to different storage interfaces"],a:1,d:5,e:"Write blockers are hardware or software tools that prevent any writes to forensic media. Without write blockers, even reading a drive for analysis can modify timestamps. Write blockers ensure the original evidence is not altered, preserving its forensic integrity."},
{q:"Security incident documentation should include:",o:["Only successful attack attempts", "All relevant details including timeline, actions taken, and evidence", "Only information for external reporting", "A summary without technical details"],a:1,d:5,e:"Thorough incident documentation records the full timeline, what was affected, what actions were taken and when, evidence collected, and decisions made. This supports lessons learned, legal proceedings, regulatory reporting, and future improvements."},
{q:"A security audit formally verifies:",o:["That security controls work as intended in real attacks", "Compliance with specific standards, regulations, or policies", "The overall security posture without compliance focus", "Technical vulnerability existence"],a:1,d:5,e:"Security audits provide formal assurance that controls comply with standards. Auditors check documentation, interview staff, and test controls against specific requirements. A SOC 2 Type II audit verifies compliance with trust service criteria over time."},
{q:"Physical security controls in an office environment include:",o:["Firewalls and intrusion detection", "Badge access, security cameras, and security guards", "Encryption and DLP", "Antivirus and endpoint protection"],a:1,d:5,e:"Physical security controls protect people and assets from physical threats. Badge access systems, CCTV, guards, locks, and alarms are physical controls. They're often overlooked in cybersecurity programs but are critical — an attacker with physical access can bypass most logical controls."},
{q:"Data sovereignty refers to:",o:["The right of individuals to control their data", "Data being subject to the laws of the country where it's stored or processed", "The security classification of data", "The encryption of data in motion"],a:1,d:5,e:"Data sovereignty means data is subject to the privacy and security laws of the nation where it physically resides. Organizations with operations in multiple countries must comply with the laws of each country where their data is stored — complicating cloud storage decisions."},
{q:"Which regulation requires notification to affected individuals when their personal data is breached?",o:["PCI DSS", "SOX", "GDPR and most US state breach notification laws", "NIST CSF"],a:2,d:5,e:"Breach notification laws require organizations to notify affected individuals when their personal data is compromised. GDPR requires notification within 72 hours to regulators. Most US states have breach notification laws. Failure to notify promptly can result in significant fines."},
{q:"Encrypting data before uploading to cloud storage PRIMARILY addresses which concern?",o:["Cloud provider performance", "Data privacy — preventing cloud providers and others from reading the data", "Network speed", "Regulatory compliance only"],a:1,d:5,e:"Client-side encryption (encrypting before upload) ensures only the data owner can read the data. Even if the cloud provider is compromised or compelled by authorities, the data is unreadable without the encryption key. This provides strong data confidentiality in cloud environments."},
{q:"Logging and monitoring is important because:",o:["It prevents all security incidents", "It provides visibility and evidence for detecting, investigating, and proving security events", "It automatically fixes vulnerabilities", "It eliminates the need for other controls"],a:1,d:5,e:"Logs provide visibility into what's happening in systems and networks. Without logs, detecting attacks is nearly impossible. Logs support incident investigation, compliance requirements, and forensic analysis. Centralized log management (SIEM) aggregates logs for analysis."},
{q:"Security baselines define:",o:["The current state of security vulnerabilities", "The minimum security configuration that all systems must meet", "The acceptable risk level for the organization", "How incidents should be responded to"],a:1,d:5,e:"Security baselines establish minimum acceptable configurations for systems. CIS Benchmarks and DISA STIGs are examples of security baselines. They ensure consistent security across all systems and provide a starting point for hardening."},
{q:"Configuration management ensures:",o:["Systems are patched monthly", "System configurations are documented, controlled, and maintained in a known secure state", "Users follow security policies", "Data is backed up correctly"],a:1,d:5,e:"Configuration management maintains systems in known, approved states. Changes go through change management; configurations are documented in a CMDB (Configuration Management Database). Configuration drift — unauthorized changes — is detected through regular auditing."},
{q:"Which process involves testing recovery procedures to ensure they work before an actual disaster?",o:["BIA", "Tabletop exercise", "DR testing", "Penetration testing"],a:2,d:5,e:"DR testing validates that recovery plans and procedures actually work. Many organizations discover their backups don't restore correctly only during actual incidents. Regular testing catches gaps when the stakes are low, not during actual disasters."},
{q:"Security metrics and KPIs in a security program PRIMARILY help:",o:["Satisfy auditor requirements", "Measure security effectiveness and support informed decision-making", "Generate compliance reports", "Train new security staff"],a:1,d:5,e:"Security metrics quantify the effectiveness of the security program. Metrics like mean time to detect, patch coverage, and phishing click rates help leadership make informed decisions about security investments and program improvements."},
{q:"Which principle states that security controls should work even when the design is known?",o:["Security by obscurity", "Kerckhoffs's principle", "Defense in depth", "Open design"],a:3,d:1,e:"Kerckhoffs's principle (and its corollary, 'open design') states that a security system should be secure even if everything about the system except the key is public knowledge. Security should not rely on keeping the algorithm secret — only the key must be secret. AES is an open algorithm that remains secure because only the key is secret."},
{q:"A security policy violation that occurs when an employee knowingly circumvents security controls is called:",o:["Negligence", "Intentional policy violation", "Risk acceptance", "Security incident"],a:1,d:1,e:"Intentional policy violations are deliberate acts where employees knowingly bypass security controls. These may be motivated by convenience, personal gain, or malicious intent. They are distinguished from accidental violations by intent."},
{q:"Governance, Risk, and Compliance (GRC) programs help organizations:",o:["Replace technical security controls", "Align security activities with business objectives, manage risk, and meet regulatory requirements", "Perform penetration testing", "Monitor network traffic"],a:1,d:1,e:"GRC programs integrate governance (oversight and strategy), risk management (identifying and addressing risks), and compliance (meeting regulatory and policy requirements) into a unified program. They ensure security investments support business goals and obligations."},
{q:"An organization's security posture refers to:",o:["The physical positioning of security equipment", "The overall strength and effectiveness of its security measures and readiness", "The attitude of employees toward security", "The number of security controls implemented"],a:1,d:1,e:"Security posture describes the overall strength of an organization's security program — including its controls, policies, practices, and preparedness to prevent, detect, and respond to threats. A strong security posture reduces risk across all dimensions."},
{q:"Personally Identifiable Information (PII) refers to:",o:["Any data stored in a database", "Information that can be used to identify a specific individual", "Data classified as confidential", "Financial information only"],a:1,d:1,e:"PII is any information that can uniquely identify an individual — name, SSN, date of birth, address, phone, email, biometrics. Protecting PII is required by most privacy laws. Combining non-PII data can sometimes create PII (e.g., combining zip code, gender, and birth date)."},
{q:"Protected Health Information (PHI) is specifically protected under which regulation?",o:["GDPR", "PCI DSS", "HIPAA", "SOX"],a:2,d:1,e:"HIPAA protects Protected Health Information — any health information that can identify an individual. This includes medical records, diagnoses, insurance information, and any data that could link an individual to their health condition. Healthcare providers, insurers, and their business associates must comply."},
{q:"Security through obscurity as the SOLE security mechanism is considered:",o:["Highly effective", "Acceptable as a secondary control", "Poor security practice", "The strongest form of protection"],a:2,d:1,e:"Security through obscurity relies on keeping system design or implementation secret. It's weak because secrets get out, people make mistakes, and systems change. Relying solely on obscurity fails when the secret is revealed. It can supplement but never replace real security controls."},
{q:"The principle of 'fail secure' means:",o:["Systems should fail as rarely as possible", "When a system fails, it defaults to a secure/restricted state", "Failed systems should automatically restart", "Security failures should be logged"],a:1,d:1,e:"Fail secure (fail closed) means when a system fails, it defaults to the more secure state — denying access rather than allowing it. Fire doors fail open (allow escape) but information systems should fail closed (block access). If a door access system fails, doors should lock, not unlock."},
{q:"Which security concept involves making it difficult to determine system architecture from observed behavior?",o:["Defense in depth", "Security through obscurity", "Deception", "Transparency"],a:2,d:1,e:"Deception techniques like honeypots, decoy data, and false file structures confuse attackers about the real system architecture. Unlike pure obscurity, deception actively misleads attackers and can detect their activity. It works alongside real controls, not instead of them."},
{q:"Accountability in information security REQUIRES:",o:["All users to be security-trained", "Unique user identifiers so actions can be attributed to individuals", "Shared accounts for efficiency", "Regular password changes"],a:1,d:1,e:"Accountability requires unique identification so actions can be traced to specific individuals. Shared accounts undermine accountability — if multiple people use one account, you can't determine which person performed an action. Audit logs must tie to unique identities."},
{q:"A business impact analysis (BIA) identifies:",o:["Technical vulnerabilities", "Critical business functions and the impact of disrupting them", "Threat actor motivations", "Security control gaps"],a:1,d:2,e:"BIA identifies which business processes are critical, what their dependencies are, and what the financial/operational impact of disruption is. BIA results drive MTD, RTO, and RPO for each process. Without BIA, recovery priorities are guesswork."},
{q:"An organization backs up data daily at midnight. If a disaster occurs at 11:55 PM, how much data could be lost?",o:["None", "5 minutes worth", "Up to 24 hours worth (almost a full day)", "50% of daily data"],a:2,d:2,e:"If daily backups occur at midnight and a disaster occurs at 11:55 PM, the last backup was almost 24 hours ago. Nearly a full day of data could be lost. This illustrates why RPO drives backup frequency — RPO should be shorter than the gap between backups."},
{q:"An organization's primary data center is destroyed by fire. Operations resume at the backup site the next day. Which recovery site was used?",o:["Cold site", "Warm site", "Hot site", "Mobile site"],a:1,d:2,e:"A warm site has pre-configured hardware but requires data restoration. Resuming operations the next day suggests a warm site — fast enough to set up overnight with current backups, but not immediate like a hot site. Cold sites take days to weeks; hot sites enable immediate failover."},
{q:"RAID 1 provides data protection by:",o:["Striping data across disks for performance", "Maintaining identical copies on two or more disks (mirroring)", "Using parity data to reconstruct failed disks", "Compressing data for efficiency"],a:1,d:2,e:"RAID 1 mirrors all data across two disks. If one disk fails, the identical copy on the other continues. It provides no performance improvement in storage efficiency (50% capacity used for redundancy) but excellent fault tolerance. Data availability is maintained after a single disk failure."},
{q:"Which RAID level requires a minimum of 3 disks and uses parity for fault tolerance?",o:["RAID 0", "RAID 1", "RAID 5", "RAID 10"],a:2,d:2,e:"RAID 5 stripes data with distributed parity across 3+ disks. One disk failure can be tolerated — parity allows reconstruction. RAID 5 balances storage efficiency (only 1 disk worth of space lost to parity) with fault tolerance. Two simultaneous disk failures would cause data loss."},
{q:"After containing an incident, which action should occur BEFORE recovery?",o:["Post-incident review", "Eradication of the threat", "Notifying affected parties", "Restoring from backup"],a:1,d:2,e:"The correct IR order is Containment → Eradication → Recovery. Eradication must remove all traces of the threat before recovery begins. Starting recovery before eradication risks re-infection of restored systems — the malware could be in backup files or the threat could still be active."},
{q:"Crisis communications plans during a disaster should be activated:",o:["After full recovery is complete", "Only for external parties", "Early in the incident to keep stakeholders informed", "Only for major disasters, not minor incidents"],a:2,d:2,e:"Communication plans should activate early — internal teams need coordination, management needs updates, and in some cases regulatory/customer notification is legally required. Waiting until after recovery to communicate creates confusion and may violate breach notification requirements."},
{q:"Geographic diversity in data center locations PRIMARILY protects against:",o:["Ransomware attacks", "Insider threats", "Regional disasters affecting multiple sites simultaneously", "Hardware failures"],a:2,d:2,e:"Geographic separation ensures a single regional disaster (hurricane, earthquake, power outage) doesn't simultaneously affect both primary and backup sites. Data centers in the same city face the same regional risks. True disaster recovery requires geographic separation."},
{q:"Provisioning a new employee's accounts and access rights is called:",o:["Account auditing", "Account provisioning", "Access recertification", "Identity federation"],a:1,d:3,e:"Account provisioning creates user accounts and assigns appropriate access rights when someone joins the organization. Proper provisioning follows least privilege — only access needed for the job is granted. Automated provisioning tools integrate with HR systems to streamline the process."},
{q:"When a user retires and their access is removed, this is called:",o:["Account provisioning", "Access recertification", "Account deprovisioning", "Access revocation"],a:2,d:3,e:"Account deprovisioning removes access when it's no longer needed — employee departure, role change, or contract end. Timely deprovisioning is critical — former employees or contractors with active accounts is a common cause of data breaches. Automated integration with HR helps."},
{q:"An employee who attempts to access data outside their job scope is violating which principle?",o:["Least privilege", "Need-to-know", "Separation of duties", "Both least privilege and need-to-know"],a:3,d:3,e:"Both principles apply: least privilege (user shouldn't have permission to access it) and need-to-know (user doesn't have a legitimate reason to access it even if technically permitted). Both support restricting access to the minimum necessary. Violations may indicate insider threat."},
{q:"Which physical security control specifically prevents an attacker from following an authorized employee through a door?",o:["CCTV surveillance", "Mantrap/access control vestibule", "Security badge reader", "Biometric scanner"],a:1,d:3,e:"Mantraps (access control vestibules) physically prevent tailgating by allowing only one person in the small enclosed space at a time. The first door must close before the second opens. A person without credentials cannot follow an authorized user through — they're trapped between the doors."},
{q:"A one-time password that changes every 30 seconds is called a:",o:["Static password", "Passphrase", "TOTP (Time-based One-Time Password)", "Knowledge factor"],a:2,d:3,e:"TOTP (Time-based OTP) generates passwords that are valid only for a short window (typically 30 seconds). Based on a shared secret and current time. Even if intercepted, expired TOTPs are useless. Google Authenticator and Microsoft Authenticator use TOTP."},
{q:"Which authentication factor is MOST resistant to phishing attacks?",o:["TOTP authenticator app", "SMS one-time password", "FIDO2/WebAuthn hardware key", "Security questions"],a:2,d:3,e:"FIDO2/WebAuthn keys are phishing-resistant because they cryptographically verify the website's origin. The key won't authenticate to a fake website. SMS OTPs and TOTP codes can be intercepted or entered on fake sites. FIDO2 makes phishing virtually impossible."},
{q:"Which access control concept requires that 'the sum of individual privileges does not exceed required access'?",o:["Least privilege", "Separation of duties", "Aggregation", "Need to know"],a:2,d:3,e:"Aggregation is the risk that combining individually harmless privileges creates excessive access. A user with 'read customer names' + 'read customer addresses' + 'read customer SSNs' has more combined capability than any single permission suggests. Access reviews should consider aggregated access."},
{q:"Keystroke dynamics and mouse movement patterns are examples of which authentication factor?",o:["Something you know", "Something you have", "Something you are", "Something you do"],a:3,d:3,e:"Something You Do (behavioral biometrics) authenticates based on behavioral patterns — typing rhythm, mouse movement, gait analysis. These are continuous authentication factors that can verify identity throughout a session, not just at login. They're more difficult to spoof than traditional biometrics."},
{q:"An access control matrix shows:",o:["A list of all user accounts", "Which subjects (users/systems) can perform which operations on which objects (resources)", "A network topology diagram", "Security control effectiveness ratings"],a:1,d:3,e:"An access control matrix is a table mapping subjects (users, processes) to objects (files, systems) with their permitted operations. It comprehensively shows all access rights. In practice, implemented as access control lists (per object) or capability lists (per subject)."},
{q:"LDAP is primarily used for:",o:["Encrypting network communications", "Directory services — querying and maintaining user/resource information", "Wireless authentication", "Database access"],a:1,d:3,e:"LDAP (Lightweight Directory Access Protocol) provides access to directory services like Microsoft Active Directory. It's used to authenticate users, query user attributes, and manage group memberships. Most enterprise authentication systems integrate with LDAP/Active Directory."},
{q:"Which network topology connects all devices directly to a central switch?",o:["Bus", "Ring", "Mesh", "Star"],a:3,d:4,e:"Star topology connects all devices to a central switch/hub. If the central device fails, all connectivity is lost — a single point of failure. However, failure of any endpoint doesn't affect others. Most modern wired LANs use star topology with a managed switch."},
{q:"Which protocol dynamically assigns IP addresses to network devices?",o:["DNS", "ARP", "DHCP", "NAT"],a:2,d:4,e:"DHCP (Dynamic Host Configuration Protocol) automatically assigns IP addresses, subnet masks, default gateways, and DNS server information to devices. Without DHCP, each device would need manual configuration. DHCP servers lease IP addresses for configurable time periods."},
{q:"A packet capture shows communication between hosts using port 23. What is the security concern?",o:["The hosts are using HTTP unencrypted", "Telnet is being used — all data including passwords is transmitted in cleartext", "Port 23 is blocked by the firewall", "The hosts are using an insecure DNS server"],a:1,d:4,e:"Port 23 is Telnet — a completely unencrypted protocol. Every keystroke, including passwords, is transmitted as plaintext. Anyone with network access can capture credentials. SSH (port 22) should always be used instead. Telnet should be disabled on all modern systems."},
{q:"Which attack technique involves an attacker observing traffic patterns to infer information without decrypting content?",o:["Passive sniffing", "Traffic analysis", "Replay attack", "Session hijacking"],a:1,d:4,e:"Traffic analysis examines metadata — source/destination, timing, volume, and frequency — without needing to decrypt content. Even encrypted traffic can reveal patterns (who communicates with whom, when, and how much). This is why VPNs hide traffic patterns from local network observers."},
{q:"A buffer overflow attack attempts to:",o:["Exhaust network bandwidth", "Overwrite memory beyond allocated buffer boundaries to execute arbitrary code", "Intercept network communications", "Guess user passwords through brute force"],a:1,d:4,e:"Buffer overflows write beyond allocated memory buffers, potentially overwriting return addresses or control data to execute attacker-supplied code. Stack and heap overflows are common attack types. Input validation, address space layout randomization (ASLR), and data execution prevention (DEP) mitigate buffer overflows."},
{q:"Which attack floods a target with traffic from thousands of compromised systems?",o:["DoS — Denial of Service", "DDoS — Distributed Denial of Service", "MitM", "Session hijacking"],a:1,d:4,e:"DDoS uses botnets of thousands to millions of compromised systems to flood targets with more traffic than they can handle. The distributed nature makes blocking harder — traffic comes from legitimate-looking IPs worldwide. CDNs, scrubbing services, and BGP blackholing help mitigate DDoS."},
{q:"Cross-site scripting (XSS) allows attackers to:",o:["Inject SQL commands into databases", "Inject malicious scripts into web pages viewed by other users", "Intercept HTTPS traffic", "Exploit buffer overflows in web servers"],a:1,d:4,e:"XSS injects malicious JavaScript into web pages. When other users view the page, the script executes in their browser — stealing cookies, redirecting to malicious sites, or capturing keystrokes. Input validation and output encoding prevent XSS. Stored XSS persists in the database; reflected XSS is in URLs."},
{q:"SQL injection attacks target:",o:["Network communication protocols", "Application code that directly includes user input in SQL queries", "Operating system vulnerabilities", "Hardware firmware"],a:1,d:4,e:"SQL injection inserts SQL commands into input fields that are concatenated into database queries. If a login form checks 'WHERE username='input' AND password='input'' and accepts ' OR '1'='1', authentication is bypassed. Parameterized queries and prepared statements prevent SQL injection."},
{q:"Which network protocol provides automatic configuration of IPv6 addresses without a DHCP server?",o:["ARP", "SLAAC (Stateless Address Autoconfiguration)", "DHCP", "NDP"],a:1,d:4,e:"SLAAC allows IPv6 devices to automatically configure their own addresses using router advertisements. Devices combine the network prefix from routers with their own MAC address-derived interface identifier. Unlike IPv4 DHCP, no central server is required for basic configuration."},
{q:"A network scan showing ports 80 and 443 open on a server MOST likely indicates:",o:["A mail server", "A database server", "A web server", "A DNS server"],a:2,d:4,e:"Ports 80 (HTTP) and 443 (HTTPS) are the standard web server ports. Port 80 serves unencrypted content; port 443 serves TLS-encrypted content. Both open on the same server typically indicates a web server that redirects HTTP to HTTPS. Port scanning is a reconnaissance technique."},
{q:"Encryption in transit PRIMARILY protects data from:",o:["Unauthorized access while stored on disk", "Interception during network transmission", "Corruption by hardware failure", "Unauthorized modification in the database"],a:1,d:4,e:"Encryption in transit (TLS, IPsec, VPN) protects data moving across networks from interception. Even if an attacker captures the traffic, encrypted data is unreadable. It doesn't protect data at rest. Both encryption types are needed for comprehensive data protection."},
{q:"A network segmentation strategy that prevents a compromised device from accessing all other network resources implements:",o:["Defense in depth", "Zero trust", "Microsegmentation", "Network isolation"],a:2,d:4,e:"Microsegmentation divides networks into small, isolated zones with strict access controls between them. If one device is compromised, it can only communicate with systems explicitly permitted in its segment's policy. This dramatically limits lateral movement — a compromised device can't pivot freely."},
{q:"Security information presented to employees to raise awareness of threats and safe behaviors is called:",o:["Penetration testing", "Security awareness training", "Vulnerability scanning", "Risk assessment"],a:1,d:5,e:"Security awareness training educates employees about threats, policies, and safe behaviors. It's the primary defense against social engineering. Regular training covering current threats (phishing simulations, current scams) is more effective than annual compliance checkbox training."},
{q:"An organization tests whether employees click phishing links by sending simulated phishing emails. This is called:",o:["Penetration testing", "Social engineering test", "Phishing simulation", "Security audit"],a:2,d:5,e:"Phishing simulations test employee security awareness. Those who click are given immediate feedback and additional training. Regular simulations improve click-through rates. They're more effective than training alone because they test actual behavior, not just knowledge."},
{q:"Which concept describes the minimum set of security controls all systems must implement?",o:["Security policy", "Security standard", "Security baseline", "Security guideline"],a:2,d:5,e:"A security baseline defines the minimum acceptable security configuration. All systems start from the baseline and may have additional controls based on risk. CIS Benchmarks and DISA STIGs are widely-used baselines for common operating systems and applications."},
{q:"Continuously monitoring system configurations to detect unauthorized changes is called:",o:["Penetration testing", "Configuration management", "Continuous compliance monitoring", "Vulnerability scanning"],a:2,d:5,e:"Continuous compliance monitoring automatically checks system configurations against baselines. It detects configuration drift — unauthorized or accidental changes that create security weaknesses. Tools like Nessus, CIS-CAT, and Qualys Policy Compliance provide continuous configuration monitoring."},
{q:"A security operations center (SOC) PRIMARILY performs:",o:["Application development", "Continuous monitoring, detection, and initial response to security threats", "Compliance auditing", "Penetration testing"],a:1,d:5,e:"A SOC provides 24/7 monitoring and response. SOC analysts monitor SIEM alerts, investigate suspicious activity, escalate incidents, and perform initial containment. The SOC is the organization's operational security hub — the team responsible for ongoing security monitoring."},
{q:"Threat intelligence PRIMARILY helps organizations:",o:["Perform penetration tests", "Understand current and emerging threats to prioritize defenses", "Train employees on security", "Manage vulnerabilities"],a:1,d:5,e:"Threat intelligence provides information about threat actors, their TTPs (Tactics, Techniques, Procedures), and indicators of compromise (IoCs). It enables proactive defense — understanding what attackers are doing helps organizations prioritize which vulnerabilities to patch and what to monitor."},
{q:"The MITRE ATT&CK framework documents:",o:["Security control frameworks", "Known adversary tactics, techniques, and procedures", "Network security best practices", "Vulnerability scoring methods"],a:1,d:5,e:"MITRE ATT&CK is a knowledge base of adversary behaviors observed in real attacks, organized by attack phase. It helps defenders understand how attackers operate, prioritize detection capabilities, and assess security gaps. It bridges threat intelligence and defensive operations."},
{q:"Secure disposal of paper documents containing sensitive information BEST uses:",o:["Recycling bin", "Cross-cut shredding", "Landfill disposal", "Burning in a controlled environment"],a:1,d:5,e:"Cross-cut (confetti) shredding makes document reconstruction practically impossible. Strip-cut shredding is less secure — strips can potentially be reassembled. Documents containing PII, financial data, or other sensitive information should always be shredded before disposal."},
{q:"An organization's security policy requires that all mobile devices connecting to corporate email must be enrolled in MDM. This is enforcing:",o:["Data classification", "Mobile Device Management policy", "Bring Your Own Device (BYOD) elimination", "Network access control"],a:1,d:5,e:"Mobile Device Management (MDM) policies ensure corporate data on mobile devices is protected — enforcing encryption, remote wipe capability, and screen lock. Requiring MDM enrollment before email access is a technical enforcement of a security policy for mobile devices."},
{q:"Which operational security (OPSEC) practice involves employees not discussing sensitive work matters in public?",o:["Clean desk policy", "Information classification", "Need-to-know enforcement", "Operational security awareness"],a:3,d:5,e:"OPSEC awareness includes physical security behaviors like not discussing sensitive matters where they can be overheard, not leaving sensitive documents visible, and being aware of shoulder surfing. Public conversations about work projects, security controls, or client information can provide intelligence to attackers."},
{q:"Which cryptographic attack attempts every possible key combination?",o:["Brute force attack", "Dictionary attack", "Rainbow table attack", "Side-channel attack"],a:0,d:1,e:"Brute force tries every possible key or password systematically. Modern encryption (AES-256) makes brute force computationally infeasible — 2^256 combinations. Key length is the primary defense against brute force."},
{q:"A rainbow table attack is used to:",o:["Encrypt data faster", "Crack password hashes using precomputed hash-to-password tables", "Intercept network traffic", "Bypass firewalls"],a:1,d:1,e:"Rainbow tables are precomputed tables of password-hash pairs. Given a stolen hash, an attacker looks it up in the table to find the original password. Salting passwords (adding random data before hashing) defeats rainbow table attacks."},
{q:"Which technique adds random data to a password before hashing to prevent rainbow table attacks?",o:["Encryption", "Salting", "Key stretching", "Tokenization"],a:1,d:1,e:"Salting adds a unique random value (salt) to each password before hashing. Even identical passwords produce different hashes with different salts. Salts are stored alongside hashes. This forces attackers to crack each hash individually rather than using precomputed tables."},
{q:"Key stretching algorithms like bcrypt and PBKDF2 improve password security by:",o:["Increasing key length", "Making hash computation intentionally slow to slow down brute force", "Encrypting the hash", "Using asymmetric encryption"],a:1,d:1,e:"Key stretching increases computational cost of hashing, making brute force attacks much slower. bcrypt, scrypt, and Argon2 are designed to be deliberately slow. As hardware improves, the work factor can be increased to maintain security."},
{q:"Which encryption mode provides both confidentiality AND authentication in a single operation?",o:["CBC (Cipher Block Chaining)", "ECB (Electronic Codebook)", "GCM (Galois/Counter Mode)", "CTR (Counter Mode)"],a:2,d:1,e:"GCM (Galois/Counter Mode) is an authenticated encryption mode that simultaneously provides confidentiality and integrity/authentication. AES-256-GCM is the recommended mode for most applications. CBC provides only confidentiality; a separate MAC is needed for integrity."},
{q:"A digital signature is created using:",o:["The signer's public key", "The signer's private key", "A shared symmetric key", "A hash function alone"],a:1,d:1,e:"Digital signatures are created with the signer's private key. Recipients verify with the corresponding public key. This provides authentication (only the private key holder could sign) and non-repudiation (the signer cannot deny signing). The message hash is what's actually signed."},
{q:"Perfect Forward Secrecy (PFS) ensures:",o:["Encryption cannot be broken with any computer", "A compromised private key cannot decrypt previously recorded sessions", "All encryption uses perfect algorithms", "Key length is maximized"],a:1,d:1,e:"PFS generates unique session keys for each session using ephemeral key exchange (ECDHE). Even if the server's long-term private key is later compromised, previously captured session traffic cannot be decrypted because the session keys were never stored."},
{q:"Which certificate authority type issues certificates directly to end entities and is subordinate to a root CA?",o:["Root CA", "Intermediate/Subordinate CA", "Cross-certification CA", "Private CA"],a:1,d:1,e:"Intermediate CAs (subordinate CAs) are certified by the root CA and issue certificates to end entities. This protects the root CA — it can be kept offline (air-gapped). If an intermediate CA is compromised, only that CA's certificates need revocation, not the entire PKI."},
{q:"Certificate pinning prevents:",o:["All certificate errors", "SSL/TLS downgrade attacks", "Fraudulent certificates from trusted CAs tricking clients", "Certificate expiration issues"],a:2,d:1,e:"Certificate pinning hardcodes expected certificate fingerprints in an application. Even if an attacker obtains a valid certificate from a trusted CA (e.g., via a rogue CA or government pressure), the pinned app will reject it. Used in high-security mobile apps."},
{q:"Which cryptographic concept ensures that encryption keys are divided such that multiple parties must cooperate to reconstruct the full key?",o:["Key escrow", "Key rotation", "Secret sharing (Shamir's Secret Sharing)", "Key derivation"],a:2,d:1,e:"Secret sharing splits a cryptographic key into parts (shares) distributed to multiple parties. A threshold number of shares (e.g., 3 of 5) must combine to reconstruct the key. No single party holds the complete key, preventing unilateral decryption."},
{q:"The strength of asymmetric encryption depends PRIMARILY on:",o:["Processing speed of the encryption algorithm", "The mathematical difficulty of problems like factoring large primes (RSA) or elliptic curve discrete logarithms (ECC)", "The key storage method", "The certificate authority used"],a:1,d:1,e:"Asymmetric encryption security relies on mathematical problems that are computationally hard to reverse. RSA relies on the difficulty of factoring large prime products. ECC relies on the elliptic curve discrete logarithm problem. ECC achieves equivalent security with much shorter keys than RSA."},
{q:"Which attack exploits the relationship between ciphertext patterns and plaintext when using weak cipher modes?",o:["Replay attack", "Birthday attack", "Known plaintext attack", "Frequency analysis / ECB pattern attack"],a:3,d:1,e:"ECB mode encrypts identical plaintext blocks to identical ciphertext blocks, revealing patterns. The 'ECB penguin' demonstrates this — an encrypted Linux Tux image still shows the penguin shape. Proper modes (GCM, CBC with IV) eliminate this weakness."},
{q:"A Certificate Revocation List (CRL) is:",o:["A list of trusted certificate authorities", "A list of certificates that have been invalidated before their expiry date", "A list of expired certificates", "A list of certificate holders"],a:1,d:1,e:"CRLs are published lists of revoked certificates. Clients check CRLs to verify a certificate hasn't been invalidated. OCSP (Online Certificate Status Protocol) provides real-time revocation checking without downloading the full CRL. Both mechanisms inform clients of revoked certificates."},
{q:"Steganography differs from cryptography in that steganography:",o:["Provides stronger encryption", "Hides the existence of a message rather than just its content", "Is easier to implement", "Requires asymmetric keys"],a:1,d:1,e:"Steganography conceals the fact that communication is occurring at all — hiding a secret message within innocent-looking data (images, audio, documents). Cryptography makes message content unreadable but reveals that encrypted communication is happening. Used together, they provide maximum security."},
{q:"Which key management practice reduces the impact of a key compromise by limiting how long a key is used?",o:["Key escrow", "Key revocation", "Key rotation", "Key derivation"],a:2,d:1,e:"Key rotation regularly replaces cryptographic keys, limiting the amount of data exposed if a key is compromised. Regular rotation limits the window of exploitation. Combined with PFS, old encrypted data cannot be decrypted even if current keys are compromised."},
{q:"A security charter formally:",o:["Lists all security vulnerabilities", "Establishes the authority and mandate of the security program within the organization", "Defines network architecture", "Describes incident response procedures"],a:1,d:1,e:"A security charter grants formal authority to the security program and its leadership. It defines scope, responsibilities, and reporting relationships. Without a charter, the CISO lacks organizational authority to enforce security requirements across departments."},
{q:"Which document type provides high-level security guidance that is RECOMMENDED but not mandatory?",o:["Policy", "Standard", "Procedure", "Guideline"],a:3,d:1,e:"Guidelines are recommended but not mandatory — they provide best practice suggestions. Unlike policies (mandatory), standards (mandatory minimum), and procedures (mandatory steps), guidelines give flexibility. Example: 'We recommend using a password manager' vs 'Passwords must be at least 12 characters.'"},
{q:"An organization's information security management system (ISMS) is BEST described as:",o:["A specific software product for security management", "A systematic approach to managing sensitive information through people", " processes", " and technology", "A set of technical security tools", "A compliance reporting framework"],a:1,d:1,e:"An ISMS is a systematic approach — policies, procedures, processes, and systems — for managing information security holistically. ISO 27001 provides requirements for implementing an ISMS. It treats security as a management system requiring planning, implementation, monitoring, and improvement."},
{q:"Security metrics should be:",o:["As numerous as possible for maximum visibility", "SMART — Specific", " Measurable", " Achievable", " Relevant", " and Time-bound", "Focused only on technical controls", "Reported only to the security team"],a:1,d:1,e:"Effective security metrics are SMART. 'Patch compliance rate' is measurable; 'improve security' is not. Metrics should drive decisions — if a metric doesn't influence behavior or resource allocation, it has no value. Quality over quantity in security metrics."},
{q:"A security awareness program is MOST effective when:",o:["Delivered as a single annual training", "Continuously reinforced with varied", " relevant", " and current content and simulations", "Focused exclusively on technical topics", "Mandatory only for IT staff"],a:1,d:1,e:"Effective awareness programs use multiple delivery methods (videos, simulations, newsletters, posters), address current threats, and include all employees. Annual compliance checkbox training has minimal impact. Regular phishing simulations combined with targeted training produce measurable behavior change."},
{q:"Threat modeling is BEST described as:",o:["Scanning systems for vulnerabilities", "Systematically identifying potential threats and attack paths during design to guide security decisions", "Monitoring live threats in production", "Performing penetration tests"],a:1,d:1,e:"Threat modeling (STRIDE, PASTA, DREAD) identifies threats during the design phase — before systems are built. Addressing threats in design is far cheaper than retrofitting security. STRIDE categorizes threats: Spoofing, Tampering, Repudiation, Information Disclosure, DoS, Elevation of Privilege."},
{q:"The shared responsibility model in cloud computing means:",o:["The customer is responsible for all security", "The cloud provider is responsible for all security", "Security responsibilities are divided between the cloud provider and the customer based on the service model", "The cloud provider has no security responsibilities"],a:2,d:1,e:"Cloud shared responsibility divides security duties. The provider always secures the infrastructure (physical, hypervisor, network). Customers are responsible for their data, identity, access management, and application security. In IaaS, customers manage more; in SaaS, providers manage most of the stack."},
{q:"Which principle states that a system should be designed with the minimum necessary functionality and features?",o:["Least privilege", "Economy of mechanism / Minimization", "Defense in depth", "Fail secure"],a:1,d:1,e:"Economy of mechanism (minimization) states that systems should be as simple as possible. Every feature is a potential attack surface. Unnecessary services, ports, and code should be disabled or removed. This principle directly reduces attack surface."},
{q:"A supply chain attack targets:",o:["End user devices directly", "Third-party vendors", " software", " or hardware components that are trusted by the target organization", "Network perimeter defenses", "Employee credentials"],a:1,d:1,e:"Supply chain attacks compromise trusted third-party software or hardware before it reaches the target. SolarWinds attack (compromised software update) and counterfeit hardware are examples. Organizations must verify integrity of software (checksums, signed packages) and vet vendor security practices."},
{q:"Which concept describes granting temporary elevated access for a specific task, then automatically removing it?",o:["Privileged Access Management", "Just-in-Time (JIT) access", "Role-based access", "Account provisioning"],a:1,d:1,e:"JIT access grants elevated privileges only when needed for a specific task and automatically revokes them afterward. This minimizes the window of exposure — permanent admin access is replaced by time-limited, task-specific access. Zero standing privileges is the ideal JIT model."},
{q:"An organization uses a CASB (Cloud Access Security Broker) to:",o:["Replace its on-premise firewall", "Gain visibility and control over cloud service usage and enforce security policies for cloud applications", "Encrypt all data at rest", "Manage user accounts in Active Directory"],a:1,d:1,e:"CASBs sit between cloud services and users, providing visibility (discovering shadow IT), data security (DLP in cloud), threat protection, and compliance enforcement. They solve the challenge of securing data in cloud services the organization may not directly control."},
{q:"Data masking PRIMARILY protects:",o:["Data in transit", "Production data by replacing sensitive values with realistic but fictitious data in non-production environments", "Data at rest through encryption", "Data from deletion"],a:1,d:1,e:"Data masking replaces real sensitive data with realistic fake data for testing, development, and training. Developers can work with realistic datasets without exposing real customer data. Unlike encryption, masked data is permanently replaced — the original cannot be recovered."},
{q:"Tokenization replaces sensitive data with:",o:["Encrypted versions of the data", "A randomly generated placeholder (token) with no mathematical relationship to the original", "A hash of the original data", "A compressed version of the data"],a:1,d:1,e:"Tokenization replaces sensitive values (like credit card numbers) with tokens that have no mathematical relationship to the originals. A token vault maps tokens to real values. Unlike encryption, tokens cannot be reversed without the vault. PCI DSS commonly uses tokenization for card data."},
{q:"Which type of assessment tests security controls by simulating real-world attacks with the organization's knowledge?",o:["Blind penetration test", "Double-blind penetration test", "White-box / crystal-box test", "Red team exercise"],a:2,d:1,e:"White-box testing gives the tester full knowledge of the system — architecture, source code, credentials. This allows thorough testing of all components. Black-box testing simulates an outside attacker with no knowledge. Gray-box is partial knowledge. White-box is most comprehensive."},
{q:"A red team exercise differs from a standard penetration test by:",o:["Using more advanced tools", "Simulating full adversary campaigns including physical", " social", " and technical attack chains over extended periods", "Focusing only on network vulnerabilities", "Being conducted by internal staff only"],a:1,d:1,e:"Red team exercises simulate realistic adversary operations — using multiple attack vectors (social engineering, physical, technical), extended timeframes, and realistic TTPs to test the organization's overall detection and response capabilities. Pen tests typically focus on specific technical vulnerabilities in a defined scope."},
{q:"Privacy impact assessments (PIAs) are conducted:",o:["After a data breach occurs", "Before implementing new systems or processes that handle personal data", "Annually for all systems", "Only for healthcare systems"],a:1,d:1,e:"PIAs (Privacy Impact Assessments) evaluate privacy risks before implementing new data processing activities. They identify what data is collected, how it's used, potential risks, and mitigation measures. Required by GDPR and other privacy regulations for high-risk processing activities."},
{q:"The concept of 'privacy as default' means:",o:["Privacy settings are configurable by users", "The most privacy-protective settings are applied automatically without user action", "Privacy policies are publicly available", "All data is encrypted by default"],a:1,d:1,e:"Privacy as default means maximum privacy protection is the automatic, out-of-the-box state. Users must actively reduce privacy protections; they don't need to opt in to them. This is a core GDPR principle ensuring personal data isn't processed beyond what's necessary by default."},
{q:"Which concept limits data access based on what an individual NEEDS to know for their specific duties?",o:["Least privilege", "Need-to-know principle", "Separation of duties", "Role-based access control"],a:1,d:1,e:"Need-to-know limits access to specific information even when least privilege might technically permit broader access. A user may have read access to a database but only need to see records relevant to their specific cases. Need-to-know applies the principle of minimum necessary information access."},
{q:"Security baseline configurations are typically derived from:",o:["Internal security policies only", "Industry standards like CIS Benchmarks", " DISA STIGs", " or vendor security guides", "Legal requirements exclusively", "Penetration test findings"],a:1,d:1,e:"Security baselines start with industry-recognized standards like CIS Benchmarks (vendor-neutral) or DISA STIGs (US government). These represent community consensus on minimum security configurations. Organizations may customize baselines based on their specific risk context and regulatory requirements."},
{q:"An authorization to operate (ATO) is PRIMARILY associated with:",o:["Commercial cloud providers", "US federal government systems requiring formal security assessment before deployment", "Private sector risk management", "ISO 27001 certification"],a:1,d:1,e:"ATO (Authorization to Operate) is a formal federal government decision granting a system permission to operate based on documented risk acceptance. The NIST Risk Management Framework (RMF) defines the ATO process. ATOs must be periodically renewed and may be revoked if risk changes significantly."},
{q:"Which security architecture principle advocates designing systems assuming breach has already occurred?",o:["Defense in depth", "Zero trust", "Assume breach", "Least privilege"],a:2,d:1,e:"Assume breach means designing security controls assuming an attacker is already inside the perimeter. This drives focus on detection, lateral movement prevention, data protection, and response capabilities — rather than solely on perimeter defenses. It's a mindset shift from 'keep them out' to 'limit damage when they get in.'"},
{q:"Continuous monitoring in a security program means:",o:["Running vulnerability scans monthly", "Ongoing visibility into security controls", " threats", " and compliance in near-real-time", "Annual security reviews", "Daily manual log reviews"],a:1,d:1,e:"Continuous monitoring provides ongoing awareness of security status. Automated tools continuously check configurations, collect logs, scan for vulnerabilities, and monitor for threats. NIST SP 800-137 describes continuous monitoring for federal systems. It replaces periodic point-in-time assessments with ongoing visibility."},
{q:"An organization's data classification policy should be driven by:",o:["The cost of security controls", "The sensitivity of data and potential impact of unauthorized disclosure or modification", "The technology used to process data", "Employee preferences"],a:1,d:1,e:"Data classification should reflect the data's value and sensitivity — what would happen if it were disclosed, modified, or unavailable. Classification drives appropriate control selection. Over-classifying increases costs without benefit; under-classifying exposes data to insufficient protection."},
{q:"Which document provides evidence that a vendor's security controls have been formally audited?",o:["Non-disclosure agreement", "SOC 2 Type II report", "Service level agreement", "Data processing agreement"],a:1,d:1,e:"SOC 2 Type II reports provide independent auditor attestation that a service organization's security controls (Trust Service Criteria) operated effectively over a time period (typically 6-12 months). They're used for vendor due diligence to assess third-party security without conducting your own audit."},
{q:"Third-party risk management (TPRM) addresses:",o:["Internal employee security risks", "Security risks introduced by vendors", " suppliers", " and other external parties with access to systems or data", "Technical vulnerability risks", "Compliance risk only"],a:1,d:1,e:"TPRM identifies and manages risks from third parties — vendors, cloud providers, contractors, partners. Any third party with access to your systems or data extends your attack surface. Due diligence (security questionnaires, audits, certifications review) before engagement and ongoing monitoring are key TPRM activities."},
{q:"The principle of 'complete mediation' means:",o:["All requests are encrypted", "Every access request is verified against the access control policy", " with no cached or bypassed checks", "All users must use MFA", "Administrative access requires dual approval"],a:1,d:1,e:"Complete mediation requires every access request to be checked — no cached permissions, no exceptions, no bypasses. If a user's access rights change, the next access is correctly evaluated against current policies. This prevents stale cache entries from granting unauthorized access."},
{q:"Open security standards and protocols are preferred over proprietary ones PRIMARILY because:",o:["They are always faster", "They benefit from public scrutiny and peer review making weaknesses more likely to be found and fixed", "They are cheaper", "They are mandated by regulation"],a:1,d:1,e:"Open standards undergo public scrutiny from global security researchers. Weaknesses are identified and reported transparently. Proprietary 'security by obscurity' algorithms may have hidden flaws. AES, TLS, and SHA-256 are trusted because they've been extensively analyzed by the cryptographic community."},
{q:"The Bell-LaPadula security model primarily enforces:",o:["Integrity through no-write-down rules", "Confidentiality through no-read-up and no-write-down rules", "Availability through redundancy", "Authentication through strong credentials"],a:1,d:1,e:"Bell-LaPadula is a confidentiality-focused MAC model. Simple Security Property: no read-up (can't read data at higher classification). Star Property: no write-down (can't write data to lower classification). Designed to prevent information flowing from high to low security levels in military environments."},
{q:"The Clark-Wilson integrity model uses:",o:["Labels and clearances", "Well-formed transactions and separation of duties to maintain data integrity", "Role-based access control", "Digital signatures for all data modifications"],a:1,d:1,e:"Clark-Wilson protects data integrity through constrained data items (CDIs), integrity verification procedures (IVPs), and transformation procedures (TPs). Only well-formed transactions can modify CDIs. Separation of duties between users prevents single-party corruption. Used in commercial/financial contexts."},
{q:"The Brewer-Nash (Chinese Wall) model prevents:",o:["Information disclosure", "Conflict of interest by preventing access to competing information", "Unauthorized system access", "Data modification"],a:1,d:1,e:"The Chinese Wall model prevents conflicts of interest. Once a user accesses data from one company, they cannot access data from competitor companies. Used by consulting and financial firms where analysts must not have information from competing clients that could influence their advice."},
{q:"In security governance, a CISO PRIMARILY:",o:["Implements technical security controls", "Provides strategic security leadership", " aligns security with business objectives", " and reports to executive leadership", "Manages IT help desk operations", "Conducts penetration tests"],a:1,d:1,e:"The CISO (Chief Information Security Officer) is the senior executive responsible for information security strategy. CISOs set security direction, manage risk at the executive level, ensure compliance, and communicate security risk to the board and C-suite. They lead the security program, not individual technical implementations."},
{q:"Which approach to security prioritizes understanding WHY controls are needed over just WHAT controls to implement?",o:["Compliance-driven security", "Risk-based security", "Control-based security", "Audit-driven security"],a:1,d:1,e:"Risk-based security decisions are driven by understanding and quantifying actual risks — what assets matter, what threats exist, what impact would occur. This ensures controls address real risks rather than just satisfying checklists. Compliance-driven security may miss unregulated risks while over-investing in low-risk compliance areas."},
{q:"Which BCP component focuses on ensuring critical personnel can perform their duties from alternate locations?",o:["Technology recovery", "People continuity", "Vendor management", "Financial recovery"],a:1,d:2,e:"People continuity ensures employees can fulfill critical roles during disruptions. This includes remote work capabilities, cross-training (so multiple people can fill each role), communication plans, and succession planning. Technology is useless if the people who use it can't access it."},
{q:"An organization's critical business function has an MTD of 4 hours and an RTO of 2 hours. This means:",o:["The RTO exceeds the MTD — the plan will fail", "RTO is within MTD — the plan is feasible", "The RPO needs adjustment", "The backup site needs upgrading"],a:1,d:2,e:"RTO must always be less than MTD. If RTO (2 hours) is less than MTD (4 hours), the system will be restored before reaching the unacceptable downtime threshold. If RTO exceeded MTD, the recovery plan would fail to prevent unacceptable business harm."},
{q:"A company's RPO is 1 hour but their backups only run every 8 hours. This represents:",o:["Acceptable risk", "A gap — actual data loss could be 8 hours", " far exceeding the 1-hour RPO", "Over-engineering", "A backup policy issue only", " not a security issue"],a:1,d:2,e:"There is a gap between the RPO requirement (1 hour max data loss) and actual backup frequency (8-hour data loss exposure). This means business requirements aren't met. Either backup frequency must increase to match the RPO, or the RPO must be renegotiated with stakeholders."},
{q:"An incident response plan should be tested:",o:["Never — testing risks actual disruption", "Only after a real incident", "Regularly through exercises and simulations before incidents occur", "Only when mandated by compliance requirements"],a:2,d:2,e:"IR plans that are never tested are unreliable when needed. Testing reveals gaps, trains team members on their roles, and validates that contact information and procedures are current. The discovery that a plan doesn't work should happen during a planned exercise, not during an actual crisis."},
{q:"Which IR team role is responsible for coordinating legal, HR, and management notifications during an incident?",o:["Technical analyst", "Incident coordinator/manager", "Forensic investigator", "Communications officer"],a:1,d:2,e:"The incident coordinator/manager oversees the overall response, ensures all necessary parties are notified (legal, HR, management, regulatory), tracks the incident timeline, and makes escalation decisions. Technical analysts focus on technical response while the coordinator manages the broader organizational response."},
{q:"During incident detection, a high false-positive rate PRIMARILY causes:",o:["System outages", "Alert fatigue — analysts begin ignoring alerts", " potentially missing real incidents", "Increased detection capability", "Faster incident response"],a:1,d:2,e:"Alert fatigue occurs when analysts are overwhelmed by false positive alerts and begin dismissing them without investigation. This creates dangerous blind spots where real incidents are missed. Reducing false positives through better tuning, correlation, and automation is a key SOC priority."},
{q:"Memory-resident malware (fileless malware) is best detected by:",o:["Antivirus signature scanning", "File integrity monitoring", "Memory forensics and behavioral analysis", "Network traffic inspection"],a:2,d:2,e:"Fileless malware operates entirely in RAM using legitimate system tools (PowerShell, WMI). It leaves no files on disk, making signature-based AV ineffective. Memory forensics and behavioral analysis (detecting anomalous process behavior, unusual parent-child process relationships) are required for detection."},
{q:"The primary goal of containment is to:",o:["Eliminate the threat immediately", "Stop the spread of an incident while preserving forensic evidence", "Restore systems to normal operation", "Identify the root cause"],a:1,d:2,e:"Containment balances stopping spread against preserving evidence. Containment strategies should prevent further damage without destroying evidence needed for investigation. Isolating a system removes it from attacker control while preserving memory contents and logs for forensic analysis."},
{q:"Which type of evidence is MOST volatile and must be collected FIRST during an incident?",o:["Hard drive images", "System logs", "RAM and running processes", "Network device configurations"],a:2,d:2,e:"The order of volatility (most to least): CPU registers/cache → RAM/running processes → Swap/pagefile → Network connections → Running processes → Hard disk → Optical/removable media → Remote logs. RAM is highly volatile — power loss destroys it. It may contain encryption keys, malware, and active connections invisible on disk."},
{q:"An organization discovers that an attacker had access for 90 days before detection. This 90-day period is called:",o:["Recovery time", "Dwell time", "Exposure time", "Breach duration"],a:1,d:2,e:"Dwell time is the period between initial compromise and detection. The global average dwell time has been over 200 days. Long dwell time allows extensive lateral movement, data exfiltration, and persistent access. Reducing MTTD (Mean Time to Detect) is a primary security operations goal."},
{q:"Threat hunting differs from incident response in that threat hunting:",o:["Responds to detected alerts", "Proactively searches for hidden threats that have evaded automated detection", "Is reactive rather than proactive", "Only analyzes network traffic"],a:1,d:2,e:"Threat hunting assumes compromise and proactively searches for evidence of threats that security tools haven't detected. Hunters develop hypotheses based on threat intelligence and hunt through logs and endpoint data. Unlike reactive IR (triggered by alerts), hunting is proactive and intelligence-driven."},
{q:"An after-action review following an incident MUST include:",o:["Only executive participants", "All team members who participated in the response", "Only the CISO and legal team", "External consultants only"],a:1,d:2,e:"Post-incident reviews should include all responders — technical analysts, incident coordinators, communications team, and management. Each role has unique perspective on what worked and what didn't. Excluding technical responders loses the most detailed operational insights about how the incident unfolded."},
{q:"Playbooks in incident response are:",o:["Long narrative documents", "Predefined step-by-step response procedures for specific incident types", "Training materials for new analysts", "Compliance documentation"],a:1,d:2,e:"Playbooks provide standardized, step-by-step procedures for specific incident types (ransomware playbook, phishing playbook, data breach playbook). They reduce response time, ensure consistency, and ensure steps aren't missed under pressure. Well-tested playbooks are the foundation of effective incident response."},
{q:"The FIRST notification priority during a major data breach involving customer PII is:",o:["Stock market regulators", "Customers", "Legal counsel and the executive team", "The media"],a:2,d:2,e:"Before any external notifications, legal counsel must be consulted to ensure proper procedures are followed, preserve attorney-client privilege, and determine regulatory notification timelines. Notifying customers before legal review may create liability. After legal guidance, regulatory and customer notifications follow in legally required timeframes."},
{q:"Which statement about tabletop exercises is TRUE?",o:["They test actual system recovery capabilities", "They are the most realistic form of DR testing", "They are discussion-based and identify process gaps without activating systems", "They should only be conducted annually"],a:2,d:2,e:"Tabletop exercises walk through a scenario verbally without activating any systems. Teams discuss what they would do, revealing gaps in plans, unclear responsibilities, and missing procedures. They're low cost, low risk, and can be conducted frequently. They don't validate technical recovery capabilities — separate technical tests are needed for that."},
{q:"Recovery Point Objective (RPO) directly determines:",o:["How quickly systems must be recovered", "How often data must be backed up", "How much the recovery will cost", "Who is responsible for recovery"],a:1,d:2,e:"RPO defines maximum acceptable data loss in time. If RPO is 4 hours, backups must be taken at least every 4 hours. RPO drives backup frequency decisions, technology choices (continuous replication for very low RPO vs. daily backups for higher RPO), and storage costs."},
{q:"Which disaster recovery approach uses database replication to maintain near-real-time copies at alternate sites?",o:["Tape backup and restore", "Periodic full backups", "Continuous data replication", "Disk imaging"],a:2,d:2,e:"Continuous data replication maintains synchronized copies at alternate sites with minimal lag (seconds to minutes). This enables very low RPO. Technologies include database mirroring, log shipping, and storage-level replication. Cost and complexity are higher than periodic backup but recovery is much faster with minimal data loss."},
{q:"Work Recovery Time (WRT) refers to:",o:["The time to restore technical systems", "The time needed to recover work and return to normal operations AFTER systems are restored", "The time to complete forensic investigation", "The recovery point objective"],a:1,d:2,e:"WRT is the time to process backlogs, catch up on work, and return to full operational capacity after technical systems are restored. Total recovery = RTO + WRT. Systems may be back online (RTO met) but catching up on 3 days of missed transactions takes additional time (WRT)."},
{q:"Which type of testing activates the backup site while the primary site continues operating normally?",o:["Tabletop", "Structured walkthrough", "Parallel test", "Full interruption test"],a:2,d:2,e:"Parallel testing activates the backup site and verifies it can support operations while the primary site continues running. There's no disruption to production. Staff may test specific workflows at the backup site. This validates the backup site's capability without the risk of a full interruption test."},
{q:"An organization classifies its payroll system as 'critical' in the BIA. This classification means:",o:["The system is the most expensive", "Disruption would cause significant financial or legal harm requiring the shortest RTO/RPO", "The system has the most users", "The system is the hardest to restore"],a:1,d:2,e:"BIA criticality classification reflects business impact of disruption. Critical systems drive the most stringent RTO/RPO requirements and highest investment in recovery capabilities. Non-critical systems may have longer RTOs and simpler recovery approaches, allowing resource prioritization based on actual business impact."},
{q:"Succession planning in BCP ensures:",o:["IT systems can be recovered", "There are trained personnel who can fulfill key roles if primary personnel are unavailable", "Vendors can provide emergency support", "Financial reserves are available for recovery"],a:1,d:2,e:"Succession planning ensures critical roles can be filled if primary personnel are unavailable (illness, injury, resignation). Cross-training creates backup coverage. Without succession planning, the unavailability of one key person could prevent recovery. This is particularly critical for rare specialized roles."},
{q:"A system that requires users to reauthenticate when accessing particularly sensitive resources demonstrates:",o:["Step-up authentication", "Single sign-on", "Token-based authentication", "Certificate authentication"],a:0,d:3,e:"Step-up authentication requires additional authentication factors when accessing sensitive resources, even during an established session. If a user authenticated with a password to access general resources, accessing the payroll system triggers a request for a second factor. This limits exposure within an authenticated session."},
{q:"Which physical security concept uses multiple rings of protection from the perimeter to the most sensitive area?",o:["Defense in depth applied to physical security / Security zones", "Security through obscurity", "Bollard placement strategy", "Access control lists"],a:0,d:3,e:"Physical security zones create layered perimeters. Each zone requires progressively more authentication and authorization. Outer zones (lobby) have minimal controls; inner zones (data center) have maximum controls. Penetrating one zone doesn't grant access to inner zones — each provides an independent barrier."},
{q:"Biometric False Rejection Rate (FRR) measures:",o:["How often unauthorized users are accepted", "How often authorized users are incorrectly rejected", "How fast biometric processing occurs", "The accuracy of biometric enrollment"],a:1,d:3,e:"FRR (False Rejection Rate) is a usability metric — it measures how often the system incorrectly denies access to legitimate users. High FRR frustrates users (the fingerprint scanner won't recognize you). FAR (False Acceptance Rate) is the security metric. The Crossover Error Rate (CER) is where they equalize — lower CER = better biometric system."},
{q:"Which authentication technology uses a shared secret and time synchronization to generate one-time codes?",o:["HOTP (HMAC-based OTP)", "TOTP (Time-based OTP)", "FIDO2/WebAuthn", "Certificate-based authentication"],a:1,d:3,e:"TOTP (RFC 6238) generates codes using a shared secret combined with the current Unix timestamp, typically in 30-second windows. Both the authenticator app and the server compute the same code independently. Google Authenticator and Authy use TOTP. Codes expire quickly, making interception far less valuable than static passwords."},
{q:"HOTP (HMAC-based OTP) differs from TOTP in that HOTP:",o:["Expires after 30 seconds", "Uses a counter rather than time to generate each code", "Requires a hardware token", "Is more secure than TOTP"],a:1,d:3,e:"HOTP uses a counter that increments with each use, while TOTP uses the current time. HOTP codes don't expire by time — they're valid until used (vulnerable to theft and delayed use). TOTP codes expire every 30 seconds — better protection if intercepted. TOTP is generally preferred over HOTP for this reason."},
{q:"Which access control implementation assigns rights to groups rather than individual users, then adds users to appropriate groups?",o:["Attribute-based AC", "Mandatory AC", "Role/group-based AC", "Discretionary AC"],a:2,d:3,e:"Assigning permissions to groups/roles then adding users to groups is best practice. Adding a new employee to the 'Accounting' group automatically grants all accounting permissions. When a job changes, moving between groups automatically adjusts permissions. This is far more manageable than individual user permission management at scale."},
