{q:"Which recovery approach runs production in the cloud with failover to on-premise as a backup?",o:["Traditional DR", "Reverse DR / cloud-primary architecture", "Tape-based DR", "Manual failover"],a:1,d:2,e:"Cloud-primary architecture runs production workloads in the cloud with on-premise as the backup/failover. This is the reverse of traditional DR (primary on-premise, failover to cloud). As cloud adoption grows, organizations are building for cloud failures by maintaining on-premise DR capability."},
{q:"The PRIMARY purpose of maintaining an IR evidence chain of custody is:",o:["Satisfying audit requirements", "Ensuring evidence is admissible in legal proceedings by proving it hasn't been tampered with", "Speeding up investigations", "Satisfying forensic tool licensing requirements"],a:1,d:2,e:"Chain of custody documentation proves evidence integrity for legal proceedings. Courts require proof that evidence hasn't been altered or tampered with from collection through presentation. Breaks in chain of custody can make evidence inadmissible, undermining criminal prosecution or civil litigation."},
{q:"An organization activates its DR plan but the backup site database is 3 days old due to a replication failure. This indicates:",o:["The RPO was met", "The RPO was violated — actual data loss exceeded the defined RPO", "Only the RTO matters in this scenario", "The backup site needs more hardware"],a:1,d:2,e:"If RPO is 4 hours but the most recent backup is 3 days old, RPO was dramatically violated. Replication failures can silently cause RPO violations. DR plans must include replication monitoring to detect failures before a disaster occurs. Regular RPO validation through test restores catches this."},
{q:"Which incident category involves an attacker gaining long-term covert access to gather intelligence over months or years?",o:["Ransomware attack", "Denial of service attack", "Advanced Persistent Threat (APT)", "Drive-by download"],a:2,d:2,e:"APTs are characterized by: sophisticated attackers (nation-states, organized crime), long dwell time (months to years), stealthy operation to avoid detection, and specific high-value targets. They collect intelligence, steal IP, or establish long-term footholds rather than causing immediate visible damage."},
{q:"Recovery Time Objective (RTO) and Recovery Point Objective (RPO) are determined by:",o:["IT staff based on technical capabilities", "Business Impact Analysis results reflecting business requirements", "The DR team based on backup capabilities", "Cost of DR infrastructure"],a:1,d:2,e:"RTO and RPO must come from business requirements — how long can this process be down? How much data can be lost? — not from what IT thinks it can achieve technically. BIA translates business impact into quantified requirements. Then DR solutions are designed to meet those requirements."},
{q:"Which control addresses the risk of a key IT professional leaving and taking critical knowledge?",o:["Non-compete agreements", "Documentation, cross-training, and succession planning", "Higher salaries", "Backup hiring"],a:1,d:2,e:"Knowledge management reduces key-person dependency. Thorough documentation, cross-training backup personnel, and succession planning ensure continuity if key staff leave. Organizations that rely on one person's undocumented knowledge face availability and continuity risks beyond just security."},
{q:"An intrusion is detected on Monday. The LAST clean backup was taken Friday. Which metric describes the 3-day window of potential data loss?",o:["RTO", "MTD", "RPO gap", "Dwell time"],a:2,d:2,e:"If data can only be restored to Friday's backup and the intrusion was Monday, up to 3 days of data (or rather, data integrity) is at risk. This represents an RPO gap — the actual potential loss exceeds the target RPO. The business must accept this loss or improve backup frequency."},
{q:"Which type of account is used by an application to access a database without human user involvement?",o:["Admin account", "Service account", "Guest account", "System account"],a:1,d:3,e:"Service accounts are non-human identities for applications, services, and automated processes. They should follow least privilege (only permissions the application needs), have strong credentials rotated regularly, and be monitored. Compromised service accounts are common in attacks because they often have broad permissions."},
{q:"Which principle requires that no single person can both commit and conceal fraud in a business process?",o:["Least privilege", "Need to know", "Separation of duties", "Dual control"],a:2,d:3,e:"Separation of duties divides critical process steps between different individuals. The person who requests a purchase can't approve it. The developer who writes code can't deploy it to production. If both steps require different people, fraud requires collusion — which is harder to sustain undetected."},
{q:"Passwords stored as unsalted hashes are vulnerable to:",o:["Brute force only", "Injection attacks", "Rainbow table attacks — precomputed hash lookups", "Shoulder surfing"],a:2,d:3,e:"Without salts, identical passwords produce identical hashes. Rainbow tables contain precomputed password-to-hash mappings. Attackers can instantly look up common passwords. Salting ensures identical passwords produce different hashes, defeating precomputed tables. Each user's salt is stored alongside their hash."},
{q:"Which authentication protocol is used by Windows Active Directory for network authentication?",o:["RADIUS", "TACACS+", "Kerberos", "LDAP"],a:2,d:3,e:"Kerberos is the default authentication protocol for Windows Active Directory environments. It uses tickets (TGT and service tickets) to authenticate users to services without repeatedly sending passwords. The Key Distribution Center (KDC) is central to Kerberos. Golden ticket attacks target the KDC."},
{q:"Mandatory vacations serve as a fraud detection control because:",o:["Employees return rested and more productive", "Someone else must cover duties, potentially discovering irregularities the absent employee was hiding", "It reduces insider threat through employee satisfaction", "It distributes workload evenly"],a:1,d:3,e:"When an employee takes mandatory vacation, someone else performs their duties. They may notice unusual transactions, accounts, or procedures that the vacationing employee was manipulating. This control is specifically required in financial services for employees in sensitive roles."},
{q:"Which factor makes biometric authentication most suitable for high-security applications?",o:["It cannot be forgotten or shared easily", "It is the cheapest form of authentication", "It is 100% accurate", "It works without any infrastructure"],a:0,d:3,e:"Biometrics are inherent to the user — can't be forgotten, lost, or easily shared. This makes them resistant to certain attacks (phishing can't steal fingerprints). However, biometrics have limitations: FAR/FRR rates, spoofing attacks, and the fact they can't be 'changed' if compromised make layering with other factors important."},
{q:"A cloud application uses 'Sign in with Google' for authentication. This is an example of:",o:["Password authentication", "Federated identity using OAuth/OIDC", "Local authentication", "Certificate-based authentication"],a:1,d:3,e:"'Sign in with Google/Apple/Microsoft' uses OAuth 2.0 (authorization) and OpenID Connect (authentication layer on top). Google is the Identity Provider (IdP); the cloud application is the Relying Party. Users authenticate to Google and receive tokens the application trusts. No separate account or password needed."},
{q:"Physical security perimeters use which concept to create progressively more secure zones?",o:["Defense in depth applied to physical space", "Single point of failure elimination", "Network segmentation", "Logical access control"],a:0,d:3,e:"Physical defense in depth creates concentric security rings: public area → reception → general office → restricted areas → server room → secure vault. Each zone requires additional authentication. Penetrating one zone still leaves additional layers. This mirrors network segmentation but in physical space."},
{q:"Which standard governs physical security for ATMs and other devices storing sensitive financial data?",o:["ISO 27001", "PCI DSS", "FIPS 140-2", "SOC 2"],a:2,d:3,e:"FIPS 140-2 (Federal Information Processing Standard) defines security requirements for cryptographic modules — including physical security levels. Level 1-4 defines increasing physical tamper protection. ATMs and HSMs often require FIPS 140-2 Level 3 or 4 for physical tamper resistance and evidence."},
{q:"A user who has been granted read access to a folder and then creates a new subfolder will have what access to the subfolder?",o:["No access to the subfolder", "The same read access as the parent folder through inheritance", "Full control over the subfolder they created", "Write access only"],a:1,d:3,e:"Access control inheritance propagates permissions from parent containers to child objects. In most systems, a subfolder inherits the permissions of its parent unless explicitly modified. This simplifies administration but requires careful design to prevent unintended access through inheritance chains."},
{q:"Which type of authentication occurs when a website redirects users to a corporate login page and accepts the resulting authentication assertion?",o:["Local authentication", "Federated authentication / SSO", "Multi-factor authentication", "Certificate authentication"],a:1,d:3,e:"Federated authentication with SSO: the website (Service Provider) redirects to the corporate Identity Provider, which authenticates the user and returns an assertion (SAML token, JWT). The SP accepts the IdP's assertion without handling credentials directly. This is how enterprise SSO across multiple applications works."},
{q:"An administrator needs emergency access to a system outside normal working hours. The BEST control for this is:",o:["Sharing the admin password via text message", "A break-glass emergency account with enhanced monitoring and mandatory post-use review", "Permanently granting the admin direct access", "Using a colleague's credentials"],a:1,d:3,e:"Break-glass accounts (also called emergency accounts) provide access during urgent situations when normal access isn't available. They have strong monitoring, mandatory post-use justification, and regular password rotation. Their use triggers alerts and requires review. This provides access when needed while maintaining accountability."},
{q:"Password policies requiring frequent changes can DECREASE security by:",o:["Reducing password complexity", "Causing users to choose predictable patterns like 'Password1!' → 'Password2!'", "Increasing support costs only", "Making passwords too hard to remember"],a:1,d:3,e:"Excessive forced rotation leads to predictable passwords: Summer2024!, Summer2024#, Fall2024! etc. NIST SP 800-63B no longer recommends periodic rotation unless compromise is suspected. Long, complex passwords that aren't frequently changed are more secure than short passwords rotated constantly. Rotate on suspected compromise, not on schedule."},
{q:"Which access control implementation strategy is MOST scalable for large organizations?",o:["Assigning permissions directly to each user", "Role-based access with role assignment through HR integration", "Having managers manually approve each access request", "Using shared accounts per department"],a:1,d:3,e:"RBAC with HR system integration automates provisioning based on job role, department, and location. When someone joins or changes roles, the HR system updates trigger automatic access provisioning/deprovisioning. This scales to thousands of users without manual access management."},
{q:"Session tokens should be stored:",o:["In browser localStorage", "In browser cookies with HttpOnly and Secure flags set", "In the URL as query parameters", "In browser sessionStorage"],a:1,d:3,e:"HttpOnly flag prevents JavaScript from accessing cookies (XSS protection). Secure flag ensures cookies are only sent over HTTPS. Storing tokens in localStorage or sessionStorage exposes them to JavaScript (XSS attacks can steal them). URL parameters are logged in browser history and server logs — never use for tokens."},
{q:"Which concept describes a user's current active permissions and roles during a session?",o:["Identity", "Credentials", "Authorization context / security context", "Access token"],a:2,d:3,e:"A security context represents the permissions and attributes associated with a user's current session. It includes their roles, group memberships, and applicable policies at the time of access. Systems make authorization decisions based on this context. Context can be elevated (for privileged tasks) or restricted."},
{q:"An organization implements 'least functionality' on its web servers. This means:",o:["Web servers have the minimum required memory", "Only necessary services, ports, and features are enabled on web servers", "Web servers use the minimum bandwidth", "Only minimum-spec hardware is used"],a:1,d:3,e:"Least functionality (also called hardening) disables everything not required for the system's purpose. A web server shouldn't run an FTP service, shouldn't have unused modules enabled, and shouldn't have unnecessary OS features installed. Every disabled service eliminates an attack vector."},
{q:"Which physical control MOST effectively prevents piggybacking?",o:["Security cameras", "Warning signs", "Mantraps and security guards verifying individual authentication", "Biometric door locks"],a:2,d:3,e:"Cameras and signs don't physically prevent piggybacking — they only detect or deter. Mantraps physically prevent more than one person entering simultaneously. Security guards can verify each person authenticates individually. The combination provides both physical prevention and human verification."},
{q:"A disgruntled employee downloads all customer data before resignation. This is:",o:["Acceptable if done before termination", "An insider threat / data exfiltration incident requiring immediate response", "Only a concern if the employee joins a competitor", "Not a security issue unless data is shared externally"],a:1,d:3,e:"Insider threat incidents include disgruntled employees, departing employees stealing data, and trusted insiders misusing access. Downloading customer data without authorization violates data use policies regardless of employment status at the time. IR actions: revoke access immediately, preserve logs, assess scope, notify legal."},
{q:"Which principle prevents access control systems from assuming that 'being on the network' implies trust?",o:["Defense in depth", "Network segmentation", "Zero trust — verify explicitly, use least privilege access", "Perimeter security"],a:2,d:3,e:"Zero trust rejects the 'trusted network' model. Internal network position grants no implicit trust. Every access request — from inside or outside the network — requires verification. This counters lateral movement attacks where an attacker inside the network could previously reach many systems freely."},
{q:"Database activity monitoring (DAM) tools primarily detect:",o:["Network-level attacks", "Unusual database queries that may indicate data theft or unauthorized access", "Malware on endpoints", "Physical security breaches"],a:1,d:3,e:"DAM monitors and logs database access patterns. Unusual behavior — bulk SELECT queries, access at odd hours, queries from unexpected users or applications — triggers alerts. DAM provides visibility into database access that network monitoring misses (especially for encrypted DB connections). Critical for protecting sensitive databases."},
{q:"An employee who needs temporary elevated access for a specific project should receive:",o:["Permanent admin rights added to their account", "Time-limited, project-specific elevated access that is automatically removed upon project completion", "Shared admin credentials for the duration", "No elevated access — regular access only"],a:1,d:3,e:"Temporary access grants time-limited privileges for specific needs. Upon completion or expiration, access is automatically revoked. This follows least privilege while accommodating legitimate temporary needs. The automatic expiration prevents access lingering indefinitely after the need is gone."},
{q:"Which physical security control uses unique characteristics of individuals for building access?",o:["RFID badge readers", "PIN pad entry", "Biometric access control (fingerprint, retina, facial recognition)", "Combination locks"],a:2,d:3,e:"Biometric physical access uses physiological characteristics — fingerprints, retina scans, facial recognition, hand geometry. Unlike badges (can be lost/stolen) or PINs (can be shared), biometrics are inherent to the individual. Higher security areas combine biometrics with badges or PINs for multi-factor physical access."},
{q:"Which identity governance capability ensures that users only have access appropriate for their current role?",o:["Just-in-time access", "Access certification / user access review", "Identity federation", "Single sign-on"],a:1,d:3,e:"Access certifications (user access reviews) periodically validate that current access rights match current job responsibilities. Managers review each team member's access and certify it's still needed. This catches privilege creep, orphaned accounts, and inappropriate access accumulated over time."},
{q:"A security policy requires all admin actions to be logged and reviewed monthly. This combination of controls provides:",o:["Preventive control", "Detective and accountability controls — detection through logs, accountability through review", "Corrective control", "Deterrent control only"],a:1,d:3,e:"Logging (detective) combined with regular review (accountability) creates layered controls. Logs record what happened; review ensures someone looks for anomalies. Together they deter misuse (admins know they're being watched) and detect incidents that occur. Regular review is essential — unreviewed logs provide no security value."},
{q:"An organization receives an email claiming to be from their bank requesting urgent account verification. This is MOST likely:",o:["A legitimate security check", "A phishing attack attempting to steal credentials", "A banking regulation requirement", "An automated security alert"],a:1,d:4,e:"Legitimate organizations don't request credentials via email. Urgency creates pressure to act without thinking. This is a classic phishing pattern. The solution: go directly to the bank's website (not via the email link) or call the number on the back of your card. Never click credential-capture links in emails."},
{q:"Which protocol securely transfers files using encryption and is DIFFERENT from FTP?",o:["FTPS — FTP with TLS", "SFTP — SSH File Transfer Protocol (different protocol entirely)", "TFTP", "SCP only"],a:1,d:4,e:"SFTP uses SSH entirely as its transport — it's not FTP with encryption added. FTPS is FTP with TLS wrapped around it. Both are more secure than plain FTP but use different underlying protocols. SFTP is simpler (one port) while FTPS can have firewall complexity. Both replace plaintext FTP."},
{q:"A network administrator blocks all traffic between VLANs by default. This implements which security principle?",o:["Least privilege", "Defense in depth", "Implicit deny — default deny with explicit allow", "Zero trust"],a:2,d:4,e:"Implicit deny (default deny) blocks everything unless explicitly permitted. Between VLANs, no traffic flows unless firewall rules specifically allow it. This is the correct segmentation design. Without explicit rules, even different VLANs on the same switch cannot communicate — each permitted flow requires deliberate authorization."},
{q:"Spanning Tree Protocol (STP) attacks involve:",o:["Exploiting DNS weaknesses", "Causing network topology changes by sending fake STP messages, disrupting network connectivity", "SQL injection through switches", "Attacking wireless protocols"],a:1,d:4,e:"Attackers sending fake STP Bridge Protocol Data Units (BPDUs) can become the root bridge, redirecting all traffic through their system (man-in-the-middle) or causing network instability. BPDU Guard mitigates this by disabling ports that receive BPDUs from unexpected sources."},
{q:"Which scanning technique sends packets with all TCP flag bits set to detect closed ports?",o:["SYN scan", "NULL scan", "XMAS scan", "FIN scan"],a:2,d:4,e:"XMAS scans send packets with FIN, PSH, and URG flags set (lighting up the packet like a Christmas tree). Closed ports respond with RST; open ports don't respond. XMAS scans can evade some packet filters that only watch for SYN packets. Fragmented XMAS packets can bypass some detection."},
{q:"Network Time Protocol (NTP) security is important because:",o:["It speeds up network communication", "Timestamp accuracy is critical for log correlation, certificate validity, and security protocol functions", "It provides encryption for time data", "It prevents network congestion"],a:1,d:4,e:"NTP keeps system clocks synchronized. Security implications: log timestamps must be accurate for forensic timeline reconstruction, certificates have validity periods requiring correct time, and Kerberos tickets expire within 5 minutes (requiring time sync). NTP attacks can skew time to break these security mechanisms."},
{q:"Which attack exploits the trust relationship between a user's browser and a website to perform unauthorized actions?",o:["SQL injection", "Cross-Site Scripting (XSS)", "Cross-Site Request Forgery (CSRF)", "Directory traversal"],a:2,d:4,e:"CSRF tricks an authenticated user's browser into submitting requests to a website without their knowledge. Because the user is authenticated, the website processes the request. Example: clicking a link on a malicious site sends a fund transfer request to the user's bank. CSRF tokens prevent this attack."},
{q:"Directory traversal attacks exploit:",o:["Database query weaknesses", "Unsanitized file path inputs to access files outside the intended directory", "Weak passwords", "Network protocol vulnerabilities"],a:1,d:4,e:"Directory traversal (path traversal) uses '../' sequences in file path inputs to navigate above the web root. 'GET /images/../../../etc/passwd HTTP/1.1' might expose system files. Input validation and proper file access APIs prevent directory traversal."},
{q:"Which technique makes malware analysis more difficult by detecting virtual machine environments?",o:["Polymorphism", "Metamorphism", "VM detection / anti-analysis techniques", "Rootkit installation"],a:2,d:4,e:"Sophisticated malware detects sandbox or VM environments (by checking CPU features, registry keys, running processes, timing attacks) and behaves differently — sleeping or appearing benign. This defeats automated sandbox analysis. Bare-metal analysis environments are harder to detect."},
{q:"Botnet command and control (C2) communication is BEST detected by:",o:["Antivirus signature scanning only", "Anomaly-based network detection looking for regular beaconing patterns and unusual DNS queries", "Monitoring physical security cameras", "Reviewing application logs"],a:1,d:4,e:"C2 communication often uses regular beaconing (periodic check-ins), DGA (random-looking domain names), DNS tunneling, or HTTPS to legitimate-looking domains. Network anomaly detection identifies unusual patterns — regular outbound connections at odd intervals, excessive DNS queries, connections to new rare domains — that signature-based systems miss."},
{q:"Which security control prevents a single network interface failure from disrupting connectivity?",o:["Firewall", "Network interface card (NIC) teaming/bonding", "VLAN", "IDS"],a:1,d:4,e:"NIC teaming (bonding) combines multiple network interfaces so if one fails, others maintain connectivity. This provides both redundancy (failover if one NIC fails) and potentially increased bandwidth (active-active mode). Critical servers typically have dual NICs connected to different switches."},
{q:"An attacker sends an email with a link to 'http://paypa1.com' (with the number 1). This technique is called:",o:["Typosquatting / homograph attack", "SQL injection", "Social engineering only", "DNS poisoning"],a:0,d:4,e:"Typosquatting registers domain names similar to legitimate ones, exploiting typos or similar-looking characters (1 vs l, 0 vs O). Users misread URLs and visit malicious sites. Homograph attacks use Unicode characters that visually resemble ASCII — 'pаypal.com' with Cyrillic 'а'. Domain monitoring and user awareness help prevent victimization."},
{q:"Which network attack exploits the automatic execution of code when a user visits a compromised website?",o:["Phishing", "Drive-by download / watering hole attack", "Ransomware deployment", "Insider threat"],a:1,d:4,e:"Drive-by downloads silently download and execute malware when users visit compromised legitimate websites (watering hole) or malicious sites. No user interaction required beyond visiting the page. Browser and plugin vulnerabilities are exploited. Regular patching and browser security settings mitigate this risk."},
{q:"Port 443 is associated with which protocol?",o:["HTTP", "FTP", "HTTPS", "SSH"],a:2,d:4,e:"HTTPS (HTTP over TLS) uses port 443. All modern web traffic should use HTTPS. HTTP (port 80) transmits data in plaintext. When a browser shows a padlock icon, it's connected on port 443 with a valid TLS session. Organizations should implement HSTS to prevent downgrade to HTTP."},
{q:"Which type of IDS analyzes traffic for deviations from established normal behavior patterns?",o:["Signature-based IDS", "Anomaly-based IDS", "Rule-based IDS", "Policy-based IDS"],a:1,d:4,e:"Anomaly-based IDS establishes baselines of normal traffic and alerts on statistically significant deviations. It can detect novel attacks with no existing signatures. Disadvantage: higher false positive rates as legitimate but unusual traffic triggers alerts. Best combined with signature-based detection."},
{q:"A web application accepts user input directly in a database query. An attacker enters: ' OR '1'='1. The result is:",o:["An error that reveals system information", "Potential SQL injection — the query may return all records or bypass authentication", "A cross-site scripting attack", "Normal behavior if the input is sanitized"],a:1,d:4,e:"' OR '1'='1 is a classic SQL injection payload. If unsanitized, the WHERE clause becomes: WHERE password='' OR '1'='1' — which is always true, potentially returning all records or bypassing authentication. Parameterized queries prevent this by treating user input as data, not code."},
{q:"Network forensics PRIMARILY relies on:",o:["Endpoint logs", "Captured packet data (PCAP files) and network flow records", "Physical security footage", "User activity logs"],a:1,d:4,e:"Network forensics analyzes packet captures and flow data to reconstruct network-level attack timelines. PCAP files contain full packet contents. NetFlow records contain connection metadata without payload. Network forensics reveals what data moved between which systems — essential for understanding data exfiltration and lateral movement."},
{q:"Which wireless security feature hides the network name from passive scanning?",o:["WPA3 encryption", "SSID hiding/cloaking", "MAC filtering", "Wi-Fi Protected Setup (WPS)"],a:1,d:4,e:"SSID hiding removes the network name from beacon frames. However, the SSID is still visible in probe requests and probe responses — easily found with wireless analyzers. SSID hiding provides minimal security while complicating legitimate connection. It's not a recommended security control."},
{q:"The purpose of 802.1X port-based authentication is:",o:["Speeding up network switching", "Requiring network devices to authenticate before gaining network access", "Encrypting wired network traffic", "Assigning IP addresses dynamically"],a:1,d:4,e:"802.1X provides port-based Network Access Control. Devices must authenticate (via EAP protocols) before the switch grants access. Until authentication succeeds, the port only allows authentication traffic. This prevents unauthorized devices from connecting to wired network ports."},
{q:"Which network design principle creates isolated 'pockets' that prevent east-west (lateral) traffic between workloads?",o:["Network segmentation through VLANs", "Microsegmentation — granular policies between individual workloads", "Perimeter firewalls", "IDS deployment"],a:1,d:4,e:"Microsegmentation creates fine-grained security zones at the workload level. Traditional segmentation creates large network zones; microsegmentation applies per-workload policies. If one VM is compromised, it cannot reach adjacent VMs without explicit policy permission. This dramatically limits blast radius."},
{q:"An encrypted HTTPS connection to a malicious website:",o:["Is prevented by firewalls", "Still delivers malicious content — encryption protects confidentiality but doesn't validate content safety", "Cannot be established", "Is blocked by certificate authorities"],a:1,d:4,e:"HTTPS encryption protects confidentiality of the connection — it doesn't validate the safety of the content. A malicious site can have a valid TLS certificate. Web filtering solutions using SSL inspection decrypt HTTPS to scan content. The padlock means the connection is encrypted, not that the site is trustworthy."},
{q:"Which technique sends emails that appear to come from a legitimate domain by exploiting SPF/DMARC gaps?",o:["Phishing", "Email spoofing", "Vishing", "Smishing"],a:1,d:4,e:"Email spoofing forges the From header to appear as a trusted sender. SPF, DKIM, and DMARC reduce spoofing but don't eliminate it — misconfigurations create gaps. Attackers exploit look-alike domains (paypa1.com) or domains without DMARC. Users should verify sender addresses carefully for unusual requests."},
{q:"Which network security technology creates an encrypted overlay network between cloud resources?",o:["CDN", "SD-WAN with encryption", "Virtual Private Cloud (VPC) with VPN overlay", "Load balancer"],a:1,d:4,e:"Cloud providers offer VPN gateways and encrypted overlays between VPCs and on-premise networks. Site-to-site VPNs connect cloud VPCs to corporate networks. SD-WAN with encryption provides intelligent routing with security for distributed networks. These create secure channels over shared internet infrastructure."},
{q:"A security team discovers unusual DNS TXT record queries containing long Base64-encoded strings. This MOST likely indicates:",o:["Normal DNS operation", "DNS tunneling — using DNS to exfiltrate data or maintain C2 communication", "Certificate transparency logging", "Email SPF record queries"],a:1,d:4,e:"DNS tunneling encodes data (payloads, exfiltration data) in DNS query and response strings — using a protocol that's often allowed through firewalls. Long TXT record queries with Base64/hex encoded payloads are a telltale sign. DNS monitoring and anomaly detection can identify this pattern."},
{q:"Which protocol provides network device management using encrypted communications?",o:["SNMP v1/v2", "Telnet", "SNMPv3 with authentication and encryption or SSH", "HTTP-based management"],a:2,d:4,e:"SNMPv3 adds authentication and encryption missing from v1/v2 (which send community strings in cleartext). SSH provides encrypted management access. SNMP v1/v2 community strings are easily captured. Any network device management should use encrypted protocols — SSH for CLI access, SNMPv3 for monitoring."},
{q:"Which attack takes advantage of insecure object references in web applications to access unauthorized data?",o:["SQL injection", "Cross-site scripting", "Insecure Direct Object Reference (IDOR)", "Buffer overflow"],a:2,d:4,e:"IDOR occurs when an application uses user-controllable values to access objects directly without authorization checks. Changing account_id=123 to account_id=124 in a URL might expose another user's data if the application doesn't verify authorization. Proper authorization checks on every object access prevent IDOR."},
{q:"Which log source would BEST help identify a successful unauthorized login from a foreign country?",o:["Network flow data", "Authentication logs (Windows Event 4624/4625 or Linux /var/log/auth.log)", "Application error logs", "Physical access logs"],a:1,d:5,e:"Authentication logs record login successes and failures with source IP addresses. Event ID 4624 (Windows) logs successful logins. Filtering for successful logins from unexpected geographic locations or IPs not in the corporate range identifies suspicious access. Geolocation databases map IPs to countries."},
{q:"Security orchestration, automation, and response (SOAR) PRIMARILY reduces:",o:["Hardware costs", "Alert fatigue and response time by automating repetitive investigation and response tasks", "The number of security incidents", "Compliance audit costs"],a:1,d:5,e:"SOAR automates manual, repetitive tasks: enriching alerts with threat intelligence, querying endpoint agents, creating tickets, notifying teams. This frees analysts for complex investigations requiring human judgment. Mean Time to Respond improves because automated playbooks execute faster than manual processes."},
{q:"Which type of security test involves providing the tester with partial knowledge of the target environment?",o:["Black-box test", "Gray-box test", "White-box test", "Crystal-box test"],a:1,d:5,e:"Gray-box testing gives partial knowledge — perhaps network diagrams, application documentation, or user credentials but not full source code or architecture. This balances realism (attackers may have some knowledge through reconnaissance) with thoroughness (more efficient use of testing time than starting from zero)."},
{q:"A security analyst notices that a server is communicating with an IP address that appears on a known malware blocklist. The FIRST action should be:",o:["Immediately shut down the server", "Investigate the communication while considering isolation — confirm it's malicious before disrupting production", "Update the blocklist", "Alert all employees"],a:1,d:5,e:"Confirm before acting. The blocklisted IP could be a false positive, a legitimate service that ended up on a blocklist, or could indicate active C2. Gather context: what process is connecting? When did it start? What data is being transferred? Then make an informed isolation decision. Shutting down immediately destroys volatile evidence and may cause unnecessary downtime."},
{q:"File integrity monitoring (FIM) would NOT be useful for detecting:",o:["Malware modifying system binaries", "Unauthorized configuration changes", "Network-based attacks that don't touch the file system", "Unauthorized changes to critical scripts"],a:2,d:5,e:"FIM detects file system changes — modifications to files, permissions, and attributes. A purely network-based attack (like a DDoS) that doesn't touch the file system wouldn't be detected by FIM. FIM complements network monitoring — together they cover both file-level and network-level changes."},
{q:"Which security metric measures the time from when an attacker first gains access to when the organization detects the intrusion?",o:["MTTR", "MTTD — Mean Time to Detect", "RTO", "Dwell time"],a:3,d:5,e:"Dwell time is the actual observed time the attacker was in the network before detection. MTTD is the average of many dwell times — a program-level metric. Reducing dwell time is a primary security operations objective. The longer an attacker remains undetected, the more damage they can cause and the harder remediation becomes."},
{q:"Which data handling practice reduces the risk of re-identification of anonymized data?",o:["Anonymization alone", "Data minimization plus k-anonymity — ensuring each record is indistinguishable from at least k-1 others", "Encryption", "Access control"],a:1,d:5,e:"Re-identification risk exists when data has unique combinations of attributes. k-anonymity ensures each individual's record matches at least k-1 others for all identifying attributes. If 'female, 30-35, Columbus, OH, health condition' describes only one person, re-identification is trivial. k-anonymity and l-diversity reduce this risk."},
{q:"A security audit finds that privileged accounts are shared among multiple administrators. The BEST remediation is:",o:["Implement a shared password manager", "Require individual privileged accounts for each administrator with full logging", "Create separate shared accounts per team", "Require managers to approve each use"],a:1,d:5,e:"Shared accounts eliminate individual accountability — you can't determine which administrator took which action. Individual named accounts for each administrator with comprehensive logging enable accountability and forensic investigation. The inconvenience of individual accounts is justified by the accountability and audit trail they provide."},
{q:"Which physical security measure ensures that visitors in office areas are always accompanied?",o:["Visitor badges", "Escort policy requiring visitors to always be accompanied by an employee", "Security cameras", "Sign-in books"],a:1,d:5,e:"Escort policies require visitors to be accompanied throughout their visit. Visitor badges identify non-employees visually but don't prevent unescorted wandering. Escorts ensure visitors only access authorized areas and cannot observe sensitive operations or information without oversight."},
{q:"Endpoint Detection and Response (EDR) tools provide which capability that traditional antivirus does not?",o:["Signature-based malware detection", "Behavioral analysis, process tree visualization, and retroactive threat hunting", "Real-time scanning", "Automatic quarantine"],a:1,d:5,e:"EDR continuously records endpoint activity. Beyond signatures, it enables: behavioral analysis (detecting malicious behaviors regardless of file hash), investigation tools (process trees, timeline analysis), threat hunting (retroactively searching for indicators of compromise), and automated response. Traditional AV reacts to known signatures; EDR detects behavioral anomalies."},
{q:"Which practice MOST effectively reduces the risk of insecure software reaching production?",o:["Security testing only before release", "Implementing security throughout the SDLC — requirements, design, coding standards, testing, and review", "Training developers on secure coding", "Penetration testing after deployment"],a:1,d:5,e:"Secure SDLC integrates security at every stage. Security requirements prevent vulnerabilities from being designed in. Threat modeling identifies risks in design. Secure coding standards prevent common vulnerabilities. SAST/DAST find issues during development. This finds issues when cheapest to fix rather than in production."},
{q:"Security information retention policies must consider:",o:["Storage costs only", "Legal hold requirements, regulatory retention mandates, and incident investigation needs", "Employee preferences", "System performance impacts"],a:1,d:5,e:"Log and security data retention balances multiple requirements: legal holds preserve data for litigation, regulations mandate specific retention periods (HIPAA 6 years, PCI DSS 1 year for logs), and investigations may need historical data. Pure cost minimization may delete data needed for legal proceedings or incident investigation."},
{q:"A user reports receiving a phone call from 'IT support' requesting their password to fix an account issue. This is:",o:["A legitimate IT support practice", "Vishing — voice-based social engineering to steal credentials", "A standard account recovery procedure", "An acceptable verification method"],a:1,d:5,e:"Legitimate IT support never asks for passwords. This is vishing (voice phishing) — social engineering over the phone. IT help desks use other authentication methods (security questions, manager verification, in-person with ID). Employees should be trained to refuse password requests over phone and report such calls."},
{q:"Which security framework helps organizations manage and reduce cybersecurity risk using five core functions?",o:["ISO 27001", "PCI DSS", "NIST Cybersecurity Framework (Identify, Protect, Detect, Respond, Recover)", "COBIT"],a:2,d:5,e:"The NIST CSF organizes security activities into five functions: Identify (understand your environment), Protect (implement safeguards), Detect (identify incidents), Respond (respond to incidents), Recover (restore capabilities). It's voluntary, flexible, and applicable to organizations of any size or sector."},
{q:"An organization discovers sensitive data in a cloud storage bucket that was accidentally made public. This is PRIMARILY a failure of:",o:["Encryption", "Data classification and cloud security configuration management", "Physical security", "Network firewall rules"],a:1,d:5,e:"Misconfigured cloud storage (AWS S3 buckets, Azure Blob storage) is one of the most common causes of data breaches. The failure is: inadequate data classification (knowing the bucket contained sensitive data), poor change management (how did it become public?), and absent configuration monitoring (detecting public access). Cloud security posture management (CSPM) tools detect these misconfigurations."},
{q:"Security metrics should be reported to senior leadership in terms of:",o:["Technical vulnerability counts", "Business risk and impact — dollar values, operational impacts, and compliance status", "Patch counts and scan completion rates", "Number of security tools deployed"],a:0,d:5,e:"Leadership needs business context, not technical details. 'We have 47 critical vulnerabilities' means less than 'We have 3 internet-facing vulnerabilities with known exploits that could expose customer data, representing $2M liability.' Business-relevant metrics justify security investments and enable informed risk decisions."},
{q:"Which action BEST demonstrates a mature security operations program?",o:["Responding quickly to all security alerts", "Proactively hunting for threats based on intelligence, measuring and improving detection/response times, and continuously improving based on incidents", "Having the most security tools", "Achieving 100% patch compliance"],a:1,d:5,e:"Mature security operations combine reactive (incident response) and proactive (threat hunting) capabilities, measure effectiveness through metrics (MTTD, MTTR), and continuously improve based on lessons learned. Tool count and patch compliance are inputs; effective threat detection and response is the outcome."},
{q:"An employee who accidentally emails sensitive customer data to a wrong recipient should:",o:["Delete the email from their sent folder", "Immediately report the incident to the security/privacy team for assessment and potential breach notification", "Recall the email and consider the matter closed", "Contact the recipient directly to delete it"],a:1,d:5,e:"Accidental disclosure may trigger breach notification requirements (GDPR 72-hour notification, US state laws). The security/privacy team determines if notification is required, assesses scope, and coordinates response. Trying to handle it informally (email recall, direct contact) delays proper assessment and may violate notification timelines."},
{q:"Security event correlation is MOST valuable for:",o:["Accelerating patch deployment", "Detecting complex attack patterns that span multiple systems and time periods", "Replacing endpoint protection", "Reducing storage costs"],a:1,d:5,e:"Correlation connects seemingly unrelated events across systems. A failed VPN login, then a password reset, then a successful VPN login from a new IP, then large file downloads — individually routine, collectively suspicious. SIEM correlation rules find these patterns invisible in individual system logs."},
{q:"Which vulnerability management prioritization approach considers both technical severity AND whether exploits exist in the wild?",o:["CVSS-only prioritization", "CISA KEV (Known Exploited Vulnerabilities) catalog and EPSS-informed prioritization", "Asset-value-only prioritization", "Random prioritization"],a:1,d:5,e:"CISA's KEV catalog lists vulnerabilities with confirmed active exploitation. Vulnerabilities on this list require prioritized remediation. EPSS (Exploit Prediction Scoring System) estimates probability of exploitation within 30 days. Together, they provide more actionable prioritization than CVSS alone — which measures technical severity regardless of actual exploit availability."},
{q:"A user receives an email with an attached PDF titled 'Invoice_12345.pdf.exe'. This is:",o:["A legitimate invoice", "A malicious executable using a double extension to disguise it as a PDF", "An encrypted document", "A valid PDF with an unusual naming convention"],a:1,d:5,e:"Double extension attacks hide executable files as documents. Windows may hide the .exe extension, showing only 'Invoice_12345.pdf' — appearing as a PDF with the PDF icon. When opened, it executes as a program. Windows showing file extensions and email attachment scanning catch this technique."},
{q:"Which of the following is the PRIMARY objective of information security?",o:["Protect hardware from physical damage", "Protect the confidentiality", " integrity", " and availability of information", "Ensure network uptime", "Prevent all cyber attacks"],a:1,d:1,e:"Information security's primary objective is protecting CIA — Confidentiality (only authorized access), Integrity (data accuracy and completeness), and Availability (accessible when needed). Physical hardware protection, network uptime, and attack prevention are means to this end, not the primary objective."},
{q:"A security policy that has not been updated in 5 years is MOST likely to:",o:["Be more effective from years of refinement", "Fail to address current threats", " technologies", " and regulatory changes", "Be fully adequate if risks haven't changed", "Only need minor formatting updates"],a:1,d:1,e:"Security policies must be living documents reviewed regularly. Technology changes, threat landscapes evolve, regulations update, and business processes change. A 5-year-old policy likely references outdated technologies, misses current threat vectors, and may no longer comply with current regulations."},
{q:"Which concept defines the maximum acceptable time for restoring data access after a loss event?",o:["MTBF", "RTO (Recovery Time Objective)", "SLA response time", "MTD"],a:1,d:1,e:"RTO defines the maximum acceptable downtime — how fast systems must be restored. It's set by business requirements identified in BIA. Recovery solutions must be designed to meet the RTO. If actual recovery takes longer than RTO, business consequences exceed acceptable levels."},
{q:"Data de-identification techniques are used to:",o:["Encrypt data for secure transmission", "Remove or obscure identifying information to enable data use while protecting privacy", "Delete sensitive data permanently", "Classify data by sensitivity"],a:1,d:1,e:"De-identification removes or modifies information that could identify individuals, enabling data to be used for analytics, research, or sharing while reducing privacy risk. Techniques include data masking, generalization, suppression, and perturbation. HIPAA defines de-identification standards for health data."},
{q:"Which security concept describes ensuring systems process only valid, expected inputs?",o:["Least privilege", "Input validation", "Separation of duties", "Access control"],a:1,d:1,e:"Input validation ensures applications only accept expected data types, lengths, formats, and ranges. This prevents injection attacks (SQL, command, XSS) by treating all input as potentially malicious until validated. Never trust user input — always validate on the server side, not just the client side."},
{q:"Security controls are PRIMARILY justified by:",o:["Regulatory requirements", "Cost-benefit analysis showing control cost is justified by risk reduction value", "Executive preference", "Industry best practices alone"],a:1,d:1,e:"Security investments require business justification. Controls are justified when their cost (implementation + ongoing) is less than the risk reduction value (ALE reduction). Pure compliance-driven security may under-invest in unregulated risks while over-investing in low-risk compliance areas. Risk-based justification is most defensible."},
{q:"Which concept describes an attacker using a legitimate user's credentials after stealing them?",o:["Identity theft", "Credential stuffing", "Privilege escalation", "Insider threat"],a:1,d:1,e:"Credential stuffing uses stolen username/password combinations (from data breaches) against other services, exploiting password reuse. Attackers automate login attempts across many sites. MFA defeats credential stuffing even when credentials are stolen. Unique passwords per site (via password manager) also prevent it."},
{q:"An organization's security program should be aligned with:",o:["Only technical best practices", "Business objectives", " regulatory requirements", " and risk tolerance", "The preferences of the security team", "Competitor security programs"],a:1,d:1,e:"Security programs must support business objectives while managing risk within the organization's tolerance and meeting regulatory obligations. Security that prevents all business activity isn't acceptable. Security that enables business operations while managing risk to acceptable levels is the goal."},
{q:"Which term describes a weakness in a system that could be exploited by a threat?",o:["Risk", "Threat", "Vulnerability", "Impact"],a:2,d:1,e:"A vulnerability is a weakness or flaw that could be exploited. Missing patches, misconfigured settings, weak passwords, and poor code are vulnerabilities. The threat exploits the vulnerability to cause impact. Risk = Threat × Vulnerability × Impact."},
{q:"Security labels in mandatory access control systems represent:",o:["User job titles","Data sensitivity classifications enforced by the system (e.g., Top Secret, Secret, Confidential)","User role-based access groups","System-assigned unique identifiers"],a:1,d:3,e:"MAC labels classify information by sensitivity (government: Top Secret, Secret, Confidential, Unclassified; commercial: Restricted, Confidential, Internal, Public). Users are granted clearances. The system enforces that users only access data at or below their clearance level. Owners cannot override these system-enforced decisions."},
{q:"A DR plan should be reviewed and updated at minimum:",o:["Only after a disaster", "Annually or when significant changes occur to systems", " business processes", " or threats", "Every 5 years", "When compliance requires it"],a:1,d:2,e:"DR plans become outdated as systems change, staff turn over, and business processes evolve. Annual review ensures contact lists, procedures, and system inventories remain accurate. Reviews should also occur after significant IT changes, business restructuring, or after executing the plan — all of which may require updates."},
{q:"Which recovery strategy has the LOWEST ongoing cost but the HIGHEST recovery time?",o:["Hot site", "Warm site", "Cold site", "Cloud DR"],a:2,d:2,e:"Cold sites are empty facilities with power and connectivity. No hardware, software, or data is pre-positioned. Monthly cost is minimal (facility lease only). Recovery requires acquiring hardware, installing software, and restoring data — potentially taking days to weeks. Appropriate for non-critical systems with high MTD."},
{q:"Business continuity testing that ACTUALLY activates the alternate site is called:",o:["Tabletop exercise", "Structured walkthrough", "Parallel test", "Full interruption test"],a:2,d:2,e:"A parallel test activates the alternate site and verifies it can run production while the primary site continues. This validates actual capability without production risk. A full interruption test shuts down the primary — maximum realism but maximum risk. Parallel tests are the most common thorough DR validation approach."},
{q:"Which type of plan specifically addresses how an organization communicates during a crisis?",o:["DR plan", "Crisis communications plan", "Incident response plan", "Business impact analysis"],a:1,d:2,e:"Crisis communications plans define who speaks for the organization (public affairs, PR), what messages are approved, which stakeholders receive which communications, and when. Good crisis communications maintain stakeholder trust. Poor communications during incidents amplify damage through lost confidence."},
{q:"Immutable backups protect against ransomware because:",o:["They are stored in the cloud", "Once written", " they cannot be modified or deleted even by administrators with elevated privileges", "They are encrypted", "They are stored offsite"],a:1,d:2,e:"Ransomware targets backup systems specifically to prevent recovery. Immutable backups (WORM storage, S3 Object Lock) cannot be encrypted or deleted by the ransomware — even if it gains admin credentials. This ensures clean backups survive ransomware attacks, dramatically reducing recovery cost and time."},
{q:"Which authentication mechanism issues temporary tokens that expire after a short time?",o:["Static passwords", "Certificate-based authentication", "Token-based authentication (JWT", " session tokens)", "Security questions"],a:2,d:3,e:"Temporary tokens limit attack windows. If stolen, they expire quickly — reducing the value of credential theft. JWT tokens contain expiration claims. Session tokens expire after inactivity. This is fundamental to zero-trust authentication design — short-lived credentials limit compromise impact."},
{q:"Principle of complete mediation requires:",o:["All data be encrypted", "Every single access request be verified against current access controls — no caching or exception", "All users authenticate with MFA", "All systems log access attempts"],a:1,d:3,e:"Complete mediation means every access is checked every time — no cached permissions, no bypass for trusted users. If a user's access rights change, the next request uses the updated rights, not a cached version. This prevents stale permissions from granting unauthorized access."},
{q:"A security administrator who also approves their own privileged access changes violates:",o:["Least privilege", "Separation of duties", "Dual control", "Need to know"],a:1,d:3,e:"An admin who can both request and approve their own elevated access has no oversight. This enables undetected privilege abuse. Separation of duties requires these functions to be separated — one person requests, a different person approves. This is fundamental to privileged access governance."},
{q:"Which access management process automatically removes access when it's no longer needed?",o:["Manual deprovisioning", "Role-based provisioning with HR integration", "Automated identity lifecycle management", "Periodic access reviews"],a:2,d:3,e:"Automated identity lifecycle management provisions access when people join, modifies it when they change roles, and automatically deprovisions it when they leave. Integration with HR systems triggers these actions. Automation prevents the common problem of manual deprovisioning being missed or delayed."},
{q:"Context-aware access control decisions consider:",o:["Username and password only", "Static role assignments", "Dynamic factors including device health", " location", " time", " and behavior patterns", "Group membership only"],a:2,d:3,e:"Context-aware (adaptive) access control incorporates risk signals: device posture (patched? managed?), location (expected country?), time (business hours?), and behavior (normal access patterns?). High-risk context triggers additional verification. Low-risk context may allow streamlined access. This is central to zero trust implementation."},
{q:"Which network protocol sends community strings in plaintext, making it insecure for network management?",o:["SNMPv3", "SSH", "SNMPv1/v2c", "HTTPS"],a:2,d:4,e:"SNMPv1 and v2c use community strings (essentially passwords) transmitted in plaintext. Anyone with network access can capture these strings. SNMPv3 adds authentication (HMAC) and privacy (DES/AES encryption), making it appropriate for secure network management."},
{q:"Load balancers improve security by:",o:["Encrypting all traffic", "Distributing traffic to prevent any single server from being overwhelmed (DoS mitigation) and providing a single inspection point", "Scanning traffic for malware", "Replacing firewalls"],a:1,d:4,e:"Load balancers distribute traffic across server pools, making DoS attacks less effective — more capacity to absorb. They also provide a single point for SSL offloading and inspection. Rate limiting at the load balancer prevents individual clients from overwhelming servers. WAFs are often deployed with load balancers."},
{q:"A zero-day vulnerability is one that:",o:["Is exactly zero days old", "Has been known for a long time", "Has no available patch or public fix — it was exploited before being disclosed to the vendor", "Is rated zero in CVSS"],a:2,d:4,e:"Zero-day refers to the vendor having zero days to fix before exploitation. These are vulnerabilities exploited before the vendor or public is aware, or before a patch is available. Zero-days are highly valuable to attackers because no signature or patch exists. Defense in depth (behavioral detection, least privilege) helps against zero-days."},
{q:"Which attack exploits trust relationships between servers in the same domain?",o:["Pass-the-hash", "Kerberoasting", "Cross-site request forgery", "Lateral movement via trusted server relationships"],a:3,d:4,e:"In domain environments, servers often trust each other (SMB, WMI, PSRemoting). An attacker who compromises one server can leverage these trust relationships to move laterally without additional credential theft. Network segmentation and limiting server-to-server trust reduce this attack surface."},
{q:"Which security measure prevents unauthorized USB devices from being used on corporate computers?",o:["Antivirus software", "USB device control policies enforced via endpoint management", "Network firewalls", "Encryption of USB drives"],a:1,d:4,e:"USB device control (via endpoint management tools, Group Policy) restricts which USB devices can connect. This prevents data theft via USB, introduction of malware on USB drives, and use of unauthorized peripherals. Policies can allow specific approved devices (by serial number/vendor) while blocking others."},
{q:"A security analyst receives 500 alerts per day but can only investigate 50. The BEST solution is:",o:["Hire more analysts", "Implement SOAR to automate low-fidelity alert triage and enrich high-fidelity alerts", "Ignore low-priority alerts", "Reduce monitoring coverage"],a:1,d:5,e:"SOAR (Security Orchestration, Automation, and Response) automates the processing of routine alerts — looking up IPs in threat intel, querying EDR for process details, creating tickets. This allows 50 analysts to effectively handle 500 alerts by automating the 90% of work that doesn't require human judgment."},
{q:"Which approach to vulnerability remediation prioritizes patching based on actual exploitation evidence?",o:["CVSS score only", "Asset value only", "CISA KEV catalog and threat intelligence-informed prioritization", "Random order"],a:2,d:5,e:"CISA's Known Exploited Vulnerabilities catalog lists vulnerabilities with confirmed active exploitation. These require immediate remediation regardless of CVSS score. Threat intelligence showing active exploitation in your industry further refines prioritization. This approach focuses limited patching resources on real threats, not theoretical ones."},
{q:"Security clearances in government contexts are granted based on:",o:["Job seniority", "Background investigation establishing trustworthiness and need for access", "Training completion", "Manager recommendation only"],a:1,d:3,e:"Government security clearances require background investigations (criminal history, financial, foreign contacts, drug use), character references, and demonstration of need for access (need-to-know). Clearances grant eligibility to access classified information at that level — need-to-know still further restricts actual access."},
{q:"Which monitoring approach detects when a privileged user accesses resources outside their normal pattern?",o:["Signature-based detection", "User and Entity Behavior Analytics (UEBA)", "Log collection", "Vulnerability scanning"],a:1,d:5,e:"UEBA establishes baselines of normal behavior for each user and entity. Deviations trigger alerts — an admin accessing payroll systems they've never touched, an account logging in at 3 AM, a service account making interactive logins. UEBA catches insider threats and compromised accounts that bypass technical controls."},
{q:"A security team discovers that an employee has been printing customer records and taking them home for months. This is an example of:",o:["External attack", "Insider threat with data exfiltration", "Accidental breach", "Physical security failure only"],a:1,d:5,e:"Insider threats involve trusted individuals misusing their legitimate access. This employee had authorized access to print records but was violating data handling policies. Detection mechanisms for physical exfiltration include: print monitoring, DLP policies on what can be printed, clean desk policies, and suspicious behavior reporting."},
{q:"The Clark-Wilson integrity model enforces data integrity through which mechanism?",o:["Well-formed transactions that only authorized users can execute on constrained data items", "System-assigned labels and clearances", "Role-based permissions", "Owner-controlled access"],a:0,d:1,e:"Clark-Wilson uses Constrained Data Items (CDIs), Integrity Verification Procedures (IVPs), and Transformation Procedures (TPs). Only TPs executed by authorized users can modify CDIs. This ensures all modifications follow authorized procedures. Used in commercial banking and financial systems."},
{q:"The Brewer-Nash (Chinese Wall) model is MOST relevant to which industry?",o:["Military intelligence", "Financial services and consulting where conflicts of interest must be prevented", "Healthcare", "Manufacturing"],a:1,d:1,e:"Chinese Wall prevents analysts from accessing data from competing organizations. Once you've accessed data for Company A, you cannot access data for Company A's competitors. This prevents conflicts of interest in investment banking, law firms, and consulting companies where staff handle multiple competing clients."},
{q:"The Biba integrity model's 'no write up' rule means:",o:["Users cannot write to lower-integrity objects", "Users cannot write to HIGHER-integrity objects to prevent contamination", "Users can only read up", "Users can only write down"],a:1,d:1,e:"Biba's star integrity property: no write up (a subject cannot write to an object with higher integrity than the subject). A low-integrity user cannot corrupt high-integrity data. The 'no read down' rule prevents contamination from reading low-integrity data into high-integrity processes."},
{q:"Which security model is designed for CONFIDENTIALITY in government/military systems?",o:["Clark-Wilson", "Brewer-Nash", "Bell-LaPadula", "Biba"],a:2,d:1,e:"Bell-LaPadula focuses on confidentiality: No Read Up (Simple Security Property) — can't read data above your clearance. No Write Down (Star Property) — can't write data to lower classifications. Designed to prevent classified information from flowing to lower classification levels."},
{q:"In the Bell-LaPadula model, a user with Secret clearance attempting to read Top Secret data would be:",o:["Allowed if approved by a manager", "Denied — the No Read Up property prevents reading above clearance level", "Allowed with dual-control approval", "Allowed only for read-only access"],a:1,d:1,e:"Bell-LaPadula's Simple Security Property (No Read Up): subjects cannot read objects at higher sensitivity levels than their clearance. A Secret-cleared user cannot read Top Secret data regardless of any other factor. The system enforces this — it's mandatory, not discretionary."},
{q:"Which concept describes making security decisions based on observed behavior rather than stated identity?",o:["Role-based trust", "Behavioral biometrics", "Zero trust with continuous validation", "Identity federation"],a:2,d:1,e:"Continuous validation evaluates ongoing behavior signals (access patterns, typing rhythm, location, device) throughout a session, not just at login. Anomalous behavior triggers step-up authentication or session termination. This is more robust than point-in-time authentication that never re-verifies."},
{q:"A honeypot designed to attract and track attackers provides which security benefit?",o:["Direct prevention of attacks", "Threat intelligence about attacker tools", " techniques", " and procedures", "Faster incident response", "Reduced false positive rates"],a:1,d:1,e:"Honeypots generate intelligence. Because no legitimate traffic reaches them, all activity is suspicious. Attackers revealing their tools, methods, and objectives in honeypots helps defenders improve real defenses. Honeypot data feeds threat intelligence programs and helps prioritize actual defenses."},
{q:"Security through obscurity as a PRIMARY security mechanism fails because:",o:["It requires too much computing power", "Secrets inevitably get exposed — once the obscuring factor is known", " all protection is lost", "It conflicts with regulatory requirements", "It is too expensive to maintain"],a:1,d:1,e:"Obscurity secrets (hidden algorithms, undocumented backdoors, secret URLs) inevitably get revealed through reverse engineering, employee departures, or leaks. When the secret is revealed, all protection disappears. True security must withstand exposure of the design — only the keys need to remain secret."},
{q:"Which principle states that security systems should have the minimum number of components necessary?",o:["Least privilege", "Economy of mechanism", "Defense in depth", "Fail secure"],a:1,d:1,e:"Economy of mechanism (simplicity/minimization): simpler systems have fewer potential vulnerabilities, are easier to verify, and simpler to understand. Every additional component adds potential attack surface. Complexity is the enemy of security — each layer of complexity introduces potential failure modes."},
{q:"A system that defaults to denying all access unless explicitly granted implements which principle?",o:["Whitelist approach / default deny", "Blacklist approach / default allow", "Least privilege", "Defense in depth"],a:0,d:1,e:"Default deny (allowlist/whitelist approach) blocks everything unless specifically permitted. This is more secure than default allow (blocklist) which permits everything unless blocked. Default deny means new threats are blocked automatically; default allow means new threats get through until specifically blocked."},
{q:"Which type of security assessment evaluates the security awareness and practices of employees through simulated attacks?",o:["Vulnerability assessment", "Red team exercise", "Social engineering assessment", "Penetration test"],a:2,d:1,e:"Social engineering assessments test human defenses through simulated phishing, vishing, pretexting, and physical intrusion attempts. They measure employee susceptibility to manipulation. Results drive targeted awareness training. Unlike technical pen tests, they test people rather than systems."},
{q:"Information asset owners are responsible for:",o:["Implementing technical controls", "Ensuring appropriate security controls are applied and making access decisions for their information assets", "Network security configuration", "Security awareness training delivery"],a:1,d:1,e:"Asset owners are accountable for their information — defining classification, approving access, and ensuring appropriate controls. IT/security implements the controls the owner requires. This business ownership of data is fundamental to effective data governance and security program accountability."},
{q:"A security governance board that includes legal, HR, IT, and business unit representatives ensures:",o:["Maximum technical security", "Security decisions balance technical requirements with legal", " HR", " and business considerations", "Faster security implementations", "Lower security costs"],a:1,d:1,e:"Cross-functional governance ensures security is viewed holistically. Legal provides regulatory perspective. HR addresses workforce issues. Business units articulate operational requirements. Security provides technical expertise. Decisions made with all perspectives better balance security requirements against business needs and legal obligations."},
{q:"Which concept describes defining security requirements at the start of a project rather than adding them later?",o:["Agile security", "Security by design / Secure SDLC", "Security testing", "Compliance management"],a:1,d:1,e:"Security by design integrates security requirements from project inception. Requirements phase: security requirements. Design phase: threat modeling. Development: secure coding standards. Testing: SAST, DAST, code review. This costs much less than retrofitting security — fixing in design is 100x cheaper than fixing in production."},
{q:"A privacy impact assessment is conducted BEFORE implementing a new data processing system to:",o:["Satisfy audit requirements", "Identify and mitigate privacy risks before they become incidents", "Classify the data involved", "Assign data ownership"],a:1,d:1,e:"PIAs identify privacy risks proactively. What data is collected? Is it proportionate? Are there less privacy-invasive alternatives? What are the risks to data subjects? Can those risks be mitigated? Conducting PIAs before implementation allows privacy-protective design rather than expensive retrofitting."},
{q:"Which principle requires that each system component is authorized to interact only with the specific components it needs?",o:["Least privilege", "Separation of duties", "Principle of minimal sharing / need-to-connect", "Defense in depth"],a:2,d:1,e:"Minimal sharing / need-to-connect limits which systems can communicate with which other systems. A web server shouldn't directly connect to a database server containing all enterprise data — only the specific database it needs. Microsegmentation and network ACLs implement this principle."},
{q:"When two security controls with different failure modes are combined, this creates:",o:["Redundancy", "Diversity in defense in depth — a single attack is unlikely to defeat both controls", "Increased complexity", "Single point of failure"],a:1,d:1,e:"Defense in depth with diverse controls means an attacker must defeat multiple different mechanisms. If both controls fail the same way, they're not truly layered. Combining a firewall (network-level) with endpoint detection (host-level) and MFA (identity-level) provides diverse layers that fail independently."},
{q:"Which security approach limits blast radius by ensuring a compromised component cannot access all other components?",o:["Defense in depth", "Isolation and containment through segmentation and least privilege", "Security through obscurity", "Redundancy"],a:1,d:1,e:"Blast radius limitation means a breach of one component doesn't automatically expose everything else. Network segmentation, application sandboxing, and container isolation all limit how far a compromise can spread. Attackers who breach one system should not immediately gain access to everything."},
{q:"The purpose of a security awareness poster campaign is to:",o:["Replace security training", "Reinforce security behaviors through repeated", " visible reminders in the workplace", "Satisfy compliance requirements only", "Provide technical security information"],a:1,d:1,e:"Posters reinforce key behaviors as part of a comprehensive awareness program. They serve as persistent reminders of security responsibilities (clean desk, badge wearing, phishing awareness). They're most effective when paired with training, simulations, and leadership examples — not as a standalone program."},
{q:"Which data handling practice ensures personal data accuracy?",o:["Encrypting all personal data", "Implementing processes for individuals to review and correct their information", "Minimizing data collection", "Retaining data for as long as possible"],a:1,d:1,e:"Data accuracy requires mechanisms for subjects to review and correct their personal information. Inaccurate data can harm individuals (wrong medical records, incorrect credit information). GDPR and other privacy regulations give individuals the right to correct inaccurate data. Organizations must maintain correction processes."},
{q:"Security testing performed by an independent third party PRIMARILY provides:",o:["Lower cost than internal testing", "Unbiased assessment without assumptions made by internal teams who designed the system", "Faster results", "More comprehensive coverage"],a:1,d:1,e:"Internal teams develop blind spots from familiarity with their own systems. External testers bring fresh perspective, different attack methodologies, and no assumptions about how the system 'should' work. Independence also satisfies audit requirements that prohibit testing one's own work."},
{q:"An ISC2 member learns that a colleague has been misrepresenting their certifications to win contracts. The member should:",o:["Ignore it — it's not their business", "Confront the colleague privately and encourage them to correct the misrepresentation", " or report to ISC2", "Report directly to the colleague's clients", "Post about it publicly on social media"],a:1,d:1,e:"Canon 4 (advance and protect the profession) requires addressing unethical conduct. Confronting privately first gives the colleague an opportunity to self-correct. If the behavior continues, reporting to ISC2 through the ethics complaint process is appropriate. Direct client notification or public exposure bypasses appropriate channels."},
{q:"A security consultant's client asks them to conduct surveillance on a competitor's systems. This request:",o:["Should be fulfilled as the client is paying for the service", "Must be declined — it's illegal (unauthorized computer access) regardless of client request", "Should be fulfilled if the client provides written authorization", "May be fulfilled with appropriate disclaimers"],a:1,d:1,e:"Canon 1 (protect society) and Canon 2 (act honorably and legally) absolutely prohibit facilitating illegal activities. Unauthorized access to computer systems is illegal in virtually every jurisdiction regardless of who requests it or why. Client authorization cannot make illegal activity legal. This request must be declined and may warrant reporting."},
{q:"An ISC2 member is asked to implement a security system they have no experience with. They should:",o:["Accept and learn quickly on the job", "Decline and refer to a qualified practitioner", " or bring in qualified assistance", "Accept but charge extra for the learning curve", "Request a longer timeline and proceed alone"],a:1,d:1,e:"Canon 3 (provide competent service) prohibits accepting work beyond your competence. The ethical response is to be transparent about limitations and either decline (referring to someone qualified) or bring in qualified assistance to supplement your skills. Proceeding alone without necessary competence risks harming the client."},
{q:"Which ISC2 ethics canon most directly prohibits participating in a price-fixing scheme with other security consultants?",o:["Canon 1 — protect society", "Canon 2 — act honorably", " honestly", " justly", " responsibly", " and legally", "Canon 3 — provide diligent service", "Canon 4 — advance the profession"],a:1,d:1,e:"Price-fixing is illegal (antitrust violation) and dishonest. Canon 2 (act honorably, honestly, justly, responsibly, and legally) directly prohibits illegal and dishonest conduct. Canon 4 (advance the profession) is also relevant since price-fixing harms the profession's reputation, but Canon 2 is the most directly applicable."},
{q:"A security professional discovers a significant undisclosed security flaw in software they reviewed years ago. The MOST ethical action is:",o:["Keep quiet — they weren't hired to find that flaw", "Immediately disclose publicly to warn users", "Follow responsible disclosure — notify the vendor with a reasonable fix timeline before any public disclosure", "Ignore it — it's no longer their concern"],a:2,d:1,e:"Responsible disclosure (coordinated disclosure) gives vendors time to fix vulnerabilities before public announcement. This protects users during the fix period. Immediate public disclosure (full disclosure) may harm users before patches are available. Complete silence leaves vulnerabilities unaddressed. Responsible disclosure balances user protection with vendor accountability."},
{q:"GDPR's 'right to erasure' is also known as:",o:["Right to access", "The right to be forgotten — individuals can request deletion of their personal data", "Right to portability", "Right to object"],a:1,d:1,e:"The right to erasure (Article 17 GDPR) allows individuals to request deletion of their personal data in certain circumstances — when data is no longer necessary, consent is withdrawn, or processing was unlawful. This right is not absolute — it can be overridden by legal obligations to retain data."},
{q:"Under GDPR, a data processor differs from a data controller in that the processor:",o:["Makes decisions about data use", "Processes data on behalf of the controller without determining its own purposes", "Owns the data", "Has no security obligations"],a:1,d:1,e:"Data controllers determine the purposes and means of processing. Data processors act on the controller's instructions. Processors have their own GDPR obligations (Article 28) including security measures, but they don't determine why data is processed. Cloud providers are typically processors; their customers are controllers."},
{q:"Which regulation requires US companies to allow California residents to opt out of the sale of their personal information?",o:["GDPR", "HIPAA", "CCPA — California Consumer Privacy Act", "SOX"],a:2,d:1,e:"CCPA gives California residents rights including: knowing what personal data is collected, deleting personal data, opting out of sale of personal data, and non-discrimination for exercising rights. It applies to for-profit businesses meeting size thresholds that serve California residents."},
{q:"A company transfers EU citizen data to the US, which lacks equivalent data protection laws. GDPR requires:",o:["Explicit consent only", "Adequate safeguards such as Standard Contractual Clauses (SCCs)", " Binding Corporate Rules", " or adequacy decisions", "Simply notifying EU citizens", "No additional requirements for US transfers"],a:1,d:1,e:"GDPR restricts data transfers to countries without adequate privacy protections. Mechanisms: EU adequacy decisions (declaring a country's laws adequate), Standard Contractual Clauses (contractual protections), Binding Corporate Rules (multinational company policies), or specific derogations. Without these, EU personal data cannot be transferred to the US."},
{q:"Data minimization as a privacy principle means:",o:["Storing data in smaller files", "Collecting and processing only the minimum personal data necessary for the specified purpose", "Deleting data after a fixed period", "Minimizing data access rights"],a:1,d:1,e:"Data minimization (GDPR Article 5(1)(c)) requires collecting only data that is adequate, relevant, and limited to what is necessary. Collecting more data than needed violates this principle. Each additional data field collected increases breach risk and regulatory exposure. 'Just in case we need it later' is not sufficient justification."},
