var DOMAIN_GUIDE={
  1:"<h3>Security Principles (26%)</h3>\n<p><b>CIA Triad</b> — The three pillars of security:</p>\n<ul>\n<li><b>Confidentiality</b>: Only authorized access — encrypted with AES, protected by ACLs</li>\n<li><b>Integrity</b>: Data not altered — verified by hashing (SHA-256), digital signatures</li>\n<li><b>Availability</b>: Accessible when needed — ensured by RAID, failover, backups</li>\n</ul>\n<p><b>Security Controls</b></p>\n<ul>\n<li><b>By Type</b>: Technical (firewalls, encryption) · Administrative (policies, training) · Physical (locks, guards)</li>\n<li><b>By Function</b>: Preventive · Detective · Corrective · Deterrent · Compensating</li>\n</ul>\n<p><b>Risk Management</b></p>\n<ul>\n<li>Risk = Threat × Vulnerability × Impact</li>\n<li>Responses: Mitigate · Transfer · Avoid · Accept</li>\n<li>Inherent risk (before controls) → Controls → Residual risk</li>\n</ul>\n<p><b>ISC2 Code of Ethics (4 Canons — in priority order)</b></p>\n<ol>\n<li>Protect society, the common good, public trust, and infrastructure</li>\n<li>Act honorably, honestly, justly, responsibly, and legally</li>\n<li>Provide diligent and competent service to principals</li>\n<li>Advance and protect the profession</li>\n</ol>\n<p><b>Key Principles</b>: Least privilege · Separation of duties · Defense in depth · Need-to-know · Due care vs Due diligence</p>\n<p><b>Cryptography Basics</b>: Symmetric (AES — same key) · Asymmetric (RSA — key pair) · Hashing (SHA-256 — integrity) · TLS (in-transit encryption)</p>",
  2:"<h3>Business Continuity, DR & IR (10%)</h3>\n<p><b>Key Metrics — Know These Cold</b></p>\n<ul>\n<li><b>RTO</b>: Recovery Time Objective — max acceptable downtime (how fast must systems come back)</li>\n<li><b>RPO</b>: Recovery Point Objective — max acceptable data loss (how old can the backup be)</li>\n<li><b>MTD</b>: Maximum Tolerable Downtime — absolute ceiling before unacceptable harm</li>\n<li><b>MTBF</b>: Mean Time Between Failures (reliability metric)</li>\n<li><b>MTTR</b>: Mean Time to Repair (how long to restore after failure)</li>\n</ul>\n<p><b>Backup Types</b></p>\n<ul>\n<li><b>Full</b>: All data — most storage, simplest restore</li>\n<li><b>Incremental</b>: Changes since last backup of any type — fast backup, complex restore (need full + all incrementals)</li>\n<li><b>Differential</b>: Changes since last full — grows over time, simple restore (full + latest differential)</li>\n</ul>\n<p><b>Recovery Sites</b>: Hot (operational, expensive) · Warm (configured, needs data) · Cold (empty, cheap, slow)</p>\n<p><b>IR Phases (NIST SP 800-61)</b></p>\n<ol>\n<li>Preparation</li>\n<li>Detection and Analysis</li>\n<li>Containment</li>\n<li>Eradication</li>\n<li>Recovery</li>\n<li>Post-Incident Activity (Lessons Learned)</li>\n</ol>\n<p><b>DR Tests</b>: Tabletop (discussion only) · Walkthrough · Simulation · Parallel (backup site active with primary) · Full interruption (primary shut down)</p>",
  3:"<h3>Access Controls (22%)</h3>\n<p><b>Access Control Models</b></p>\n<ul>\n<li><b>DAC</b>: Discretionary — owner controls access (Windows NTFS)</li>\n<li><b>MAC</b>: Mandatory — system enforces labels/clearances (military)</li>\n<li><b>RBAC</b>: Role-Based — access by job role (most enterprise systems)</li>\n<li><b>ABAC</b>: Attribute-Based — multiple attributes simultaneously</li>\n<li><b>Rule-Based</b>: Admin rules (time, IP) — used in firewall ACLs</li>\n</ul>\n<p><b>Authentication Factors</b></p>\n<ul>\n<li>Something You Know: password, PIN</li>\n<li>Something You Have: token, smart card, OTP</li>\n<li>Something You Are: biometrics (fingerprint, iris)</li>\n<li>Somewhere You Are: location-based</li>\n</ul>\n<p><b>MFA</b>: Two or more DIFFERENT factor types required</p>\n<p><b>Physical Access Controls</b>: Mantrap (prevents tailgating) · Bollards (vehicle barriers) · CCTV · Badge/RFID · Biometrics · Guards</p>\n<p><b>Key Principles</b></p>\n<ul>\n<li>Least privilege — minimum access needed</li>\n<li>Separation of duties — divide critical tasks</li>\n<li>Default deny — deny all unless explicitly permitted</li>\n<li>Account management — provision, review, deprovision promptly</li>\n<li>Privilege creep — accumulation of excess access over time</li>\n</ul>",
  4:"<h3>Network Security (24%)</h3>\n<p><b>Key Ports to Know</b></p>\n<ul>\n<li>22 — SSH (encrypted remote access)</li>\n<li>23 — Telnet (cleartext — NEVER use)</li>\n<li>25 — SMTP (email)</li>\n<li>53 — DNS</li>\n<li>80 — HTTP</li>\n<li>443 — HTTPS</li>\n<li>3389 — RDP</li>\n<li>110 — POP3 · 143 — IMAP</li>\n</ul>\n<p><b>Network Devices</b>: Hub (Layer 1) · Switch (Layer 2, MAC) · Router (Layer 3, IP) · Firewall (traffic filtering)</p>\n<p><b>Firewall Types</b>: Packet filter (IP/port) · Stateful (connection tracking) · NGFW (application-aware)</p>\n<p><b>Security Zones</b>: Internet → DMZ (public servers) → Firewall → Internal → Secure Zone</p>\n<p><b>Common Attacks</b></p>\n<ul>\n<li>DoS/DDoS — overwhelm with traffic (attacks availability)</li>\n<li>MitM — intercept communications between parties</li>\n<li>ARP Poisoning — corrupt ARP cache for local MitM</li>\n<li>DNS Poisoning — corrupt DNS to redirect users</li>\n<li>Phishing — social engineering via email</li>\n</ul>\n<p><b>Wireless Security</b>: WPA3 (best) · WPA2 (acceptable) · WPA (weak) · WEP (broken, never use)</p>\n<p><b>Email Security</b>: SPF (authorized servers) · DKIM (digital signatures) · DMARC (policy + reporting)</p>\n<p><b>Malware Types</b>: Virus · Worm · Trojan · Ransomware · Rootkit (kernel level, hardest to detect) · Spyware</p>",
  5:"<h3>Security Operations (18%)</h3>\n<p><b>Security Tools</b></p>\n<ul>\n<li><b>SIEM</b>: Centralize logs, correlate events, detect threats across organization</li>\n<li><b>DLP</b>: Prevent sensitive data from leaving without authorization</li>\n<li><b>FIM</b>: Detect unauthorized changes to critical files</li>\n<li><b>IDS/IPS</b>: Detect (IDS) or detect and block (IPS) network attacks</li>\n</ul>\n<p><b>Vulnerability Management</b>: Scanning (identify) → Prioritization → Patching → Verification</p>\n<p><b>Data Handling</b></p>\n<ul>\n<li>Retention: Keep data only as long as needed</li>\n<li>Destruction: Overwrite (HDDs) · Physical destruction · Degaussing (magnetic media only)</li>\n<li>SSDs: Degaussing doesn't work — use cryptographic erasure or physical destruction</li>\n</ul>\n<p><b>Digital Forensics</b>: Preserve evidence → Chain of custody → Write blockers → Forensic imaging → Analysis</p>\n<p><b>Security Awareness</b>: Primary defense against social engineering and human error</p>\n<p><b>Key Policies</b></p>\n<ul>\n<li>Clean desk — secure materials when not in use</li>\n<li>Acceptable use — rules for IT resource usage</li>\n<li>Change management — authorize, test, document before implementing changes</li>\n<li>Patch management — timely application of security updates</li>\n</ul>\n<p><b>Compliance</b>: GDPR (EU privacy) · HIPAA (healthcare) · PCI DSS (payment cards) · ISO 27001 (ISMS)</p>"

// PBQ launch dispatcher — avoids quote-nesting issues in onclick attributes
function pbqLaunch(id){
  if(id==='ordering'){ccPbqState.current='ordering';startCCOrdering(0);}
  else if(id==='matching'){ccPbqState.current='matching';startCCMatching(0);}
  else if(id==='logs'){ccPbqState.current='logs';startCCLogs(0);}
  else if(id==='hotspot'){ccPbqState.current='hotspot';renderCCHotspot();}
  else if(id==='riskregister'){ccPbqState.current='riskregister';renderCCRiskRegister();}
}
window.pbqLaunch=pbqLaunch;

function renderCCPBQMenu() {
  var PBQ_TYPES = [
    {id:'ordering',icon:'🔢',title:'Ordering & Sequencing',
     desc:'IR phases, Risk steps, BCP development, Access lifecycle',
     col:'var(--cy)',hot:true},
    {id:'matching',icon:'🔗',title:'Matching & Categorization',
     desc:'Risk responses, Control types, Access models, BC metrics',
     col:'var(--pu)',hot:true},
    {id:'hotspot',icon:'🔧',title:'Drop-Down Hotspot',
     desc:'Ethics application, Data classification, Control classification',
     col:'var(--ye)',hot:true},
    {id:'logs',icon:'📋',title:'Log Analysis',
     desc:'Audit logs, Firewall logs, Security event interpretation',
     col:'var(--gn)',hot:false},
    {id:'riskregister',icon:'📊',title:'Risk Register Calculation',
     desc:'SLE, ALE, ROSI calculations for real-world scenarios',
     col:'var(--or)',hot:false}
  ];

  function makeBtn(t, featured){
    return "<button data-pbq=\""+t.id+"\" style=\"display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;font-family:inherit;text-align:left;width:100%\">" +
      "<div style=\"width:44px;height:44px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0\">" + t.icon + "</div>" +
      "<div style=\"flex:1\">" +
        "<div style=\"font-family:Syne,sans-serif;font-size:14px;font-weight:700;color:" + t.col + ";margin-bottom:3px\">" + t.title + "</div>" +
        "<div style=\"font-size:12px;color:var(--tx3)\">" + t.desc + "</div>" +
      "</div>" +
      "<span style=\"font-size:18px;color:var(--tx4)\">&#8594;</span>" +
    "</button>";
  }

  var hotBtns = PBQ_TYPES.filter(function(t){return t.hot;}).map(function(t){return makeBtn(t,true);}).join('');
  var allBtns = PBQ_TYPES.filter(function(t){return !t.hot;}).map(function(t){return makeBtn(t,false);}).join('');

  render(
    "<div class='pg'>" +
    "<div class='card2' style='margin-bottom:18px;padding:14px'>" +
      "<div style='font-size:13px;color:var(--tx2);line-height:1.7'>" +
        "The ISC2 CC exam may include scenario-based questions. These simulations build critical thinking skills for test day. " +
        "<em style='color:var(--tx4)'>ISC2 reserves the right to include advanced item types on any exam.</em>" +
      "</div>" +
    "</div>" +
    "<h2 class='stitle'>Commonly Tested Scenarios</h2>" +
    "<div style='display:flex;flex-direction:column;gap:8px;margin-bottom:16px'>" + hotBtns + "</div>" +
    "<h2 class='stitle'>Additional Practice</h2>" +
    "<div style='display:flex;flex-direction:column;gap:8px'>" + allBtns + "</div>" +
  "</div>");
  // Wire up PBQ card clicks after render
  var pbqBtns=document.querySelectorAll("[data-pbq]");
  for(var bi=0;bi<pbqBtns.length;bi++){
    (function(btn){
      btn.onclick=function(){pbqLaunch(btn.getAttribute("data-pbq"));}
      btn.onmouseover=function(){btn.style.borderColor="var(--cy)";btn.style.transform="translateY(-1px)";}
      btn.onmouseout=function(){btn.style.borderColor="";btn.style.transform="";}
    })(pbqBtns[bi]);
  }
}

var S_RADIUS = "12px";

// ── ORDERING PBQ ──────────────────────────────────────────────────────────────
var ccOrderState = {scIdx:0, order:[], selId:null, checked:false};

function startCCOrdering(idx) {
  var sc = CC_ORDERING_SCENARIOS[idx];
  ccOrderState = {
    scIdx: idx,
    order: shuffle(sc.items.map(function(i){return i.id;})),
    selId: null,
    checked: false
  };
  renderCCOrdering();
}
window.startCCOrdering = startCCOrdering;

function renderCCOrdering() {
  var sc = CC_ORDERING_SCENARIOS[ccOrderState.scIdx];
  var ord = ccOrderState.order;
  var checked = ccOrderState.checked;
  var correct = JSON.stringify(ord) === JSON.stringify(sc.correct);
  var score = 0;
  if(checked){ord.forEach(function(id,i){if(id===sc.correct[i])score++;});}
  
  var chips = CC_ORDERING_SCENARIOS.map(function(s,i){
    return "<button onclick='startCCOrdering("+i+")' style='padding:5px 12px;border-radius:20px;border:1.5px solid "+(i===ccOrderState.scIdx?"var(--cy)":"var(--bd)")+";background:"+(i===ccOrderState.scIdx?"var(--cy0)":"var(--bg2)")+";color:"+(i===ccOrderState.scIdx?"var(--cy)":"var(--tx3)")+";font-size:11px;font-weight:700;cursor:pointer;font-family:inherit'>"+s.title+"</button>";
  }).join('');

  var items = ord.map(function(id, pos){
    var item = sc.items.find(function(it){return it.id===id;});
    var isCorrect = checked && id === sc.correct[pos];
    var isWrong = checked && id !== sc.correct[pos];
    var isSelected = ccOrderState.selId === id;
    var bc = isCorrect?"var(--gn)":isWrong?"var(--rd)":isSelected?"var(--cy)":"var(--bd2)";
    var bg = isCorrect?"var(--gn0)":isWrong?"var(--rd0)":isSelected?"var(--cy0)":"var(--bg2)";
    return "<div style='display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;border:1.5px solid "+bc+";background:"+bg+";margin-bottom:8px;cursor:"+(checked?"default":"pointer")+";transition:all .15s' onclick='"+(checked?"":"ccOrderClick(\""+id+"\")")+"'>" +
      "<span style='width:26px;height:26px;border-radius:7px;background:"+bc+";color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0'>"+(pos+1)+"</span>" +
      "<span style='font-size:13px;font-weight:500;color:var(--tx);flex:1'>"+item.text+"</span>" +
      (checked?"<span style='font-size:11px;color:"+(isCorrect?"var(--gn)":"var(--rd)")+"'>"+(isCorrect?"✅ Correct":"❌ Step "+(sc.correct.indexOf(id)+1))+"</span>":"") +
      (!checked?"<span style='font-size:18px;color:var(--tx4)'>⠿</span>":"") +
    "</div>";
  }).join('');

  render("<div class='pg'>" +
    "<button class='btn btn-s' onclick='renderCCPBQMenu()' style='margin-bottom:12px'>← Back to PBQs</button>" +
    "<div style='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px'>"+chips+"</div>" +
    "<div class='card2' style='margin-bottom:14px;padding:14px'>" +
      "<div style='font-size:10px;font-weight:700;color:var(--cy);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px'>🔢 ORDERING PBQ</div>" +
      "<div style='font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px'>"+sc.title+"</div>" +
      "<div style='font-size:13px;color:var(--tx2)'>"+sc.instruction+"</div>" +
    "</div>" +
    items +
    (checked?"<div style='background:"+(score===sc.items.length?"var(--gn0)":"var(--ye0)")+";border:1.5px solid "+(score===sc.items.length?"var(--gn)":"var(--ye)")+";border-radius:12px;padding:14px;margin:14px 0'>" +
      "<div style='font-weight:700;color:"+(score===sc.items.length?"var(--gn)":"var(--ye)")+";margin-bottom:6px'>"+(score===sc.items.length?"🎉 Perfect! ":"Score: ")+score+"/"+sc.items.length+"</div>" +
      "<div style='font-size:12px;color:var(--tx2);line-height:1.6'>"+sc.explanation+"</div>" +
    "</div>":"") +
    "<div style='display:flex;gap:10px;margin-top:4px'>" +
      (!checked?"<button class='btn btn-p' style='flex:2' onclick='ccOrderSubmit()'>Submit Order</button>":"") +
      (checked?"<button class='btn btn-s' style='flex:2' onclick='startCCOrdering("+(ccOrderState.scIdx+1)%CC_ORDERING_SCENARIOS.length+")'>Next Scenario →</button>":"") +
      "<button class='btn btn-s' style='flex:1' onclick='startCCOrdering("+ccOrderState.scIdx+")'>↺ Reset</button>" +
    "</div>" +
  "</div>");
}
window.renderCCOrdering = renderCCOrdering;

window.ccOrderClick = function(id) {
  if(ccOrderState.checked) return;
  var ord = ccOrderState.order;
  if(ccOrderState.selId === null) {
    ccOrderState.selId = id;
  } else {
    var i = ord.indexOf(ccOrderState.selId);
    var j = ord.indexOf(id);
    if(i !== j) { var tmp=ord[i]; ord[i]=ord[j]; ord[j]=tmp; }
    ccOrderState.selId = null;
  }
  renderCCOrdering();
};

window.ccOrderSubmit = function() {
  ccOrderState.checked = true;
  renderCCOrdering();
};

// ── MATCHING PBQ ──────────────────────────────────────────────────────────────
var ccMatchState = {scIdx:0, pairs:{}, selLeft:null, checked:false};

function startCCMatching(idx) {
  ccMatchState = {scIdx:idx, pairs:{}, selLeft:null, checked:false};
  renderCCMatching();
}
window.startCCMatching = startCCMatching;

function renderCCMatching() {
  var sc = CC_MATCHING_SCENARIOS[ccMatchState.scIdx];
  var pairs = ccMatchState.pairs;
  var checked = ccMatchState.checked;
  var score = 0;
  if(checked){sc.left.forEach(function(l,i){if(pairs[i]===sc.correct[i])score++;});}
  var allDone = Object.keys(pairs).length === sc.left.length;

  var chips = CC_MATCHING_SCENARIOS.map(function(s,i){
    return "<button onclick='startCCMatching("+i+")' style='padding:5px 12px;border-radius:20px;border:1.5px solid "+(i===ccMatchState.scIdx?"var(--cy)":"var(--bd)")+";background:"+(i===ccMatchState.scIdx?"var(--cy0)":"var(--bg2)")+";color:"+(i===ccMatchState.scIdx?"var(--cy)":"var(--tx3)")+";font-size:11px;font-weight:700;cursor:pointer;font-family:inherit'>"+s.title+"</button>";
  }).join('');

  var usedRight = Object.values(pairs);
  var leftItems = sc.left.map(function(l,i){
    var paired = pairs[i] !== undefined;
    var isOK = checked && pairs[i] === sc.correct[i];
    var isWrong = checked && pairs[i] !== undefined && pairs[i] !== sc.correct[i];
    var isSelL = ccMatchState.selLeft === i;
    var bc = isOK?"var(--gn)":isWrong?"var(--rd)":isSelL?"var(--cy)":paired?"var(--pu)":"var(--bd2)";
    var bg = isOK?"var(--gn0)":isWrong?"var(--rd0)":isSelL?"var(--cy0)":paired?"var(--pu0)":"var(--bg2)";
    return "<div onclick='"+(checked?"":"ccMatchSelLeft("+i+")")+"' style='padding:10px 14px;border-radius:10px;border:1.5px solid "+bc+";background:"+bg+";cursor:"+(checked?"default":"pointer")+";margin-bottom:6px;font-size:13px;font-weight:500;color:var(--tx);transition:all .15s'>" +
      (paired&&!checked?"<span style='color:"+bc+"'>✓ </span>":"") +
      (isOK?"<span style='color:var(--gn)'>✅ </span>":"") +
      (isWrong?"<span style='color:var(--rd)'>❌ </span>":"") +
      l + (checked&&isWrong?"<div style='font-size:11px;color:var(--gn);margin-top:3px'>Correct: "+sc.right[sc.correct[i]]+"</div>":"") +
    "</div>";
  }).join('');

  var rightItems = sc.right.map(function(r,i){
    var isUsed = usedRight.includes(i);
    var isSel = ccMatchState.selLeft !== null;
    return "<div onclick='"+(checked||!isSel?"":"ccMatchSelRight("+i+")")+"' style='padding:10px 14px;border-radius:10px;border:1.5px solid "+(isUsed?"var(--pu)":"var(--bd2)")+";background:"+(isUsed?"var(--pu0)":"var(--bg2)")+";cursor:"+(checked||!isSel?"default":"pointer")+";margin-bottom:6px;font-size:13px;color:var(--tx2);transition:all .15s'>" +
      (isUsed?"<span style='color:var(--pu)'>● </span>":"<span style='color:var(--tx4)'>○ </span>") + r +
    "</div>";
  }).join('');

  render("<div class='pg'>" +
    "<button class='btn btn-s' onclick='renderCCPBQMenu()' style='margin-bottom:12px'>← Back to PBQs</button>" +
    "<div style='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px'>"+chips+"</div>" +
    "<div class='card2' style='margin-bottom:14px;padding:14px'>" +
      "<div style='font-size:10px;font-weight:700;color:var(--pu);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px'>🔗 MATCHING PBQ</div>" +
      "<div style='font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px'>"+sc.title+"</div>" +
      "<div style='font-size:13px;color:var(--tx2)'>"+sc.instruction+" — Select a left item, then its match on the right.</div>" +
    "</div>" +
    "<div style='display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px'>" +
      "<div><div style='font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px'>SCENARIOS</div>"+leftItems+"</div>" +
      "<div><div style='font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px'>MATCH TO</div>"+rightItems+"</div>" +
    "</div>" +
    (checked?"<div style='background:"+(score===sc.left.length?"var(--gn0)":"var(--ye0)")+";border:1.5px solid "+(score===sc.left.length?"var(--gn)":"var(--ye)")+";border-radius:12px;padding:14px;margin-bottom:14px'>" +
      "<div style='font-weight:700;color:"+(score===sc.left.length?"var(--gn)":"var(--ye)")+";margin-bottom:6px'>"+(score===sc.left.length?"🎉 Perfect! ":"Score: ")+score+"/"+sc.left.length+"</div>" +
      "<div style='font-size:12px;color:var(--tx2);line-height:1.6'>"+sc.explanation+"</div>" +
    "</div>":"") +
    "<div style='display:flex;gap:10px'>" +
      (!checked&&allDone?"<button class='btn btn-p' style='flex:2' onclick='ccMatchSubmit()'>Submit Matches</button>":"") +
      (!checked&&!allDone?"<div style='flex:2;padding:13px;background:var(--bg3);border-radius:12px;font-size:13px;color:var(--tx3);text-align:center'>Match all "+sc.left.length+" items ("+(Object.keys(pairs).length)+"/"+sc.left.length+" done)</div>":"") +
      (checked?"<button class='btn btn-s' style='flex:2' onclick='startCCMatching("+(ccMatchState.scIdx+1)%CC_MATCHING_SCENARIOS.length+")'>Next Scenario →</button>":"") +
      "<button class='btn btn-s' style='flex:1' onclick='startCCMatching("+ccMatchState.scIdx+")'>↺ Reset</button>" +
    "</div>" +
  "</div>");
}
window.renderCCMatching = renderCCMatching;
window.ccMatchSelLeft = function(i){ccMatchState.selLeft=i;renderCCMatching();};
window.ccMatchSelRight = function(i){
  if(ccMatchState.selLeft===null)return;
  ccMatchState.pairs[ccMatchState.selLeft]=i;
  ccMatchState.selLeft=null;
  renderCCMatching();
};
window.ccMatchSubmit = function(){ccMatchState.checked=true;renderCCMatching();};

// ── LOG ANALYSIS PBQ ──────────────────────────────────────────────────────────
var ccLogState = {scIdx:0, answers:{}, checked:false};

function startCCLogs(idx) {
  ccLogState = {scIdx:idx||0, answers:{}, checked:false};
  renderCCLogs();
}
window.startCCLogs = startCCLogs;

function renderCCLogs() {
  var sc = CC_LOG_SCENARIOS[ccLogState.scIdx];
  var checked = ccLogState.checked;
  var score = 0;
  if(checked){sc.qs.forEach(function(q,i){if(ccLogState.answers[i]===q.a)score++;});}
  var allDone = Object.keys(ccLogState.answers).length === sc.qs.length;

  var chips = CC_LOG_SCENARIOS.map(function(s,i){
    return "<button onclick='startCCLogs("+i+")' style='padding:5px 12px;border-radius:20px;border:1.5px solid "+(i===ccLogState.scIdx?"var(--gn)":"var(--bd)")+";background:"+(i===ccLogState.scIdx?"var(--gn0)":"var(--bg2)")+";color:"+(i===ccLogState.scIdx?"var(--gn)":"var(--tx3)")+";font-size:11px;font-weight:700;cursor:pointer;font-family:inherit'>"+s.title+"</button>";
  }).join('');

  var qs = sc.qs.map(function(q,qi){
    var sel = ccLogState.answers[qi];
    var opts = q.o.map(function(opt,oi){
      var isC = checked && oi===q.a;
      var isW = checked && oi===sel && oi!==q.a;
      var isSel = sel===oi;
      var bc = isC?"var(--gn)":isW?"var(--rd)":isSel?"var(--cy)":"var(--bd2)";
      var bg = isC?"var(--gn0)":isW?"var(--rd0)":isSel?"var(--cy0)":"var(--bg2)";
      return "<button onclick='"+(checked?"":"ccLogAns("+qi+","+oi+")")+"' style='display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:9px;border:1.5px solid "+bc+";background:"+bg+";cursor:"+(checked?"default":"pointer")+";width:100%;text-align:left;font-family:inherit;margin-bottom:6px;font-size:13px;color:var(--tx2)'>" +
        "<span style='width:22px;height:22px;border-radius:6px;background:"+bc+";color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;flex-shrink:0'>"+["A","B","C","D"][oi]+"</span>"+opt+
        (isC?" ✅":isW?" ❌":"")+"</button>";
    }).join('');
    return "<div style='background:var(--bg2);border:1.5px solid "+(checked?(ccLogState.answers[qi]===q.a?"var(--gn)":"var(--rd)"):"var(--bd)")+";border-radius:12px;padding:14px;margin-bottom:12px'>" +
      "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:10px'>"+(qi+1)+". "+q.q+"</div>" + opts +
      (checked?"<div style='font-size:11px;color:var(--tx3);margin-top:6px;padding:8px;background:var(--bg3);border-radius:8px'>"+q.e+"</div>":"") +
    "</div>";
  }).join('');

  render("<div class='pg'>" +
    "<button class='btn btn-s' onclick='renderCCPBQMenu()' style='margin-bottom:12px'>← Back to PBQs</button>" +
    "<div style='display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px'>"+chips+"</div>" +
    "<div style='background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;font-family:monospace;font-size:11px;line-height:1.8;color:var(--tx2);white-space:pre-wrap;overflow-x:auto'>"+sc.prompt+"</div>" +
    "<div style='font-size:10px;font-weight:700;color:var(--gn);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px'>📋 ANALYSIS QUESTIONS</div>" +
    qs +
    (checked?"<div style='background:"+(score===sc.qs.length?"var(--gn0)":"var(--ye0)")+";border:1.5px solid "+(score===sc.qs.length?"var(--gn)":"var(--ye)")+";border-radius:12px;padding:14px;margin-bottom:14px'>" +
      "<div style='font-weight:700;color:"+(score===sc.qs.length?"var(--gn)":"var(--ye)")+"'>"+(score===sc.qs.length?"🎉 Perfect! ":"Score: ")+score+"/"+sc.qs.length+"</div>" +
    "</div>":"") +
    "<div style='display:flex;gap:10px'>" +
      (!checked&&allDone?"<button class='btn btn-p' style='flex:2' onclick='ccLogSubmit()'>Submit Analysis</button>":"") +
      (!checked&&!allDone?"<div style='flex:2;padding:13px;background:var(--bg3);border-radius:12px;font-size:13px;color:var(--tx3);text-align:center'>Answer all "+(sc.qs.length)+" questions to submit</div>":"") +
      (checked?"<button class='btn btn-s' style='flex:2' onclick='startCCLogs("+(ccLogState.scIdx+1)%CC_LOG_SCENARIOS.length+")'>Next Scenario →</button>":"") +
      "<button class='btn btn-s' style='flex:1' onclick='startCCLogs("+ccLogState.scIdx+")'>↺ Reset</button>" +
    "</div>" +
  "</div>");
}
window.renderCCLogs = renderCCLogs;
window.ccLogAns = function(qi,oi){ccLogState.answers[qi]=oi;renderCCLogs();};
window.ccLogSubmit = function(){ccLogState.checked=true;renderCCLogs();};

// ── HOTSPOT PBQ ───────────────────────────────────────────────────────────────
var ccHotState = {scIdx:0, sel:{}, checked:false};

function renderCCHotspot() {
  var sc = CC_HOTSPOT_SCENARIOS[ccHotState.scIdx];
  var sel = ccHotState.sel;
  var checked = ccHotState.checked;
  var score = 0;
  if(checked){sc.fields.forEach(function(f,i){if(sel[i]===f.correct)score++;});}
  var allDone = Object.keys(sel).length===sc.fields.length;
  var letters = ['A','B','C','D'];

  var chips = CC_HOTSPOT_SCENARIOS.map(function(s,i){
    return "<button onclick='ccHotState.scIdx="+i+";ccHotState.sel={};ccHotState.checked=false;renderCCHotspot()' style='padding:5px 12px;border-radius:20px;border:1.5px solid "+(i===ccHotState.scIdx?"var(--cy)":"var(--bd)")+";background:"+(i===ccHotState.scIdx?"var(--cy0)":"var(--bg2)")+";color:"+(i===ccHotState.scIdx?"var(--cy)":"var(--tx3)")+";font-size:11px;font-weight:700;cursor:pointer;font-family:inherit'>"+s.title+"</button>";
  }).join('');

  var fields = sc.fields.map(function(f,fi){
    var sv = sel[fi];
    var isOK = checked ? sv===f.correct : null;
    var borderCol = isOK===null?"var(--bd)":isOK?"var(--gn)":"var(--rd)";
    var opts = f.options.map(function(opt,oi){
      var isCO = checked&&oi===f.correct;
      var isWO = checked&&oi===sv&&oi!==f.correct;
      var bc = isCO?"var(--gn)":isWO?"var(--rd)":sv===oi?"var(--cy)":"var(--bd)";
      var bg = isCO?"var(--gn0)":isWO?"var(--rd0)":sv===oi?"var(--cy0)":"var(--bg2)";
      return "<button onclick='ccHotSel("+fi+","+oi+")' style='display:block;width:100%;text-align:left;padding:8px 11px;margin-bottom:4px;border-radius:8px;border:1.5px solid "+bc+";background:"+bg+";font-family:inherit;font-size:12px;color:var(--tx2);cursor:"+(checked?"default":"pointer")+"'><span style='font-size:10px;font-weight:800;margin-right:6px;color:"+bc+"'>"+letters[oi]+".</span>"+opt+(isCO?" ✅":isWO?" ❌":"")+"</button>";
    }).join('');
    return "<div style='background:var(--bg2);border:1.5px solid "+borderCol+";border-radius:12px;padding:14px;margin-bottom:10px'>" +
      "<div style='display:flex;align-items:center;gap:8px;margin-bottom:10px'>" +

function startQuiz(dom){
  S.quiz.dom=dom;
  var pool;
  if(dom===0){
    var wpool=[];
    for(var d=1;d<=5;d++){
      var dqs=shuffle(QZ.filter(function(q){return q.d==d;}));
      var cnt=Math.round(20*DOMAIN_WEIGHTS[d]/100);
      wpool=wpool.concat(dqs.slice(0,Math.max(1,cnt)));
    }
    pool=shuffle(wpool);
  } else {
    pool=shuffle(QZ.filter(function(q){return q.d==dom;}));
  }
  S.quiz.qs=pool.slice(0,20);
  S.quiz.idx=0;S.quiz.sel=null;S.quiz.checked=false;S.quiz.score=0;S.quiz.total=0;

function startExam(size){
  size=size||EXAM_Q;
  var pool=[];
  for(var d=1;d<=5;d++){
    var dqs=shuffle(QZ.filter(function(q){return q.d==d;}));
    var count=Math.round(size*DOMAIN_WEIGHTS[d]/100);
    pool=pool.concat(dqs.slice(0,Math.min(count,dqs.length)));
  }
  if(pool.length<size){
    var extras=shuffle(QZ).filter(function(q){return pool.indexOf(q)<0;});
    pool=pool.concat(extras.slice(0,size-pool.length));
  }
  pool=shuffle(pool).slice(0,size);
  S.exam={qs:pool,cur:0,ans:{},flagged:[],started:true,done:false,
    timer:size===50?3600:size>100?size*50:EXAM_SECS,iv:null,ngb:false,score:0,scaled:0,sel:null};
  S.exam.optMaps=pool.map(function(){return shuffle([0,1,2,3]);});
  S.exam.iv=setInterval(function(){
    S.exam.timer--;
    updateTimerDisplay();
    if(S.exam.timer<=0){clearInterval(S.exam.iv);finishExam(true);}
  },1000);
  renderExamQ();
}

}

function finishExam(timeUp){
  clearInterval(S.exam.iv);
  var e=S.exam;
  var correct=0;
  var byDomain={1:{c:0,t:0},2:{c:0,t:0},3:{c:0,t:0},4:{c:0,t:0},5:{c:0,t:0}};
  for(var i=0;i<e.qs.length;i++){
    var q=e.qs[i];
    byDomain[q.d].t++;
    if(e.ans[i]!==undefined){
      var selOrig=e.optMaps[i][e.ans[i]];
      if(selOrig===q.a){correct++;byDomain[q.d].c++;}
    }
  }
  var total=e.qs.length;
  if(total===0){renderExamHome();return;}
  var pct=Math.round(correct/total*100);
  var rp=pct/100;
  var scaled=rp>=0.83?Math.round(750+(rp-0.83)/0.17*250):
             rp>=0.70?Math.round(680+(rp-0.70)/0.13*70):
             rp>=0.50?Math.round(550+(rp-0.50)/0.20*130):
             Math.round(rp/0.50*550);
  scaled=Math.max(100,Math.min(1000,scaled));
  e.done=true;e.score=correct;e.scaled=scaled;
  S.stats.sessions++;
  S.stats.correct+=correct;S.stats.total+=total;
  for(var d=1;d<=5;d++){
    if(!S.stats.domainScores[d])S.stats.domainScores[d]={correct:0,total:0};
    S.stats.domainScores[d].correct+=byDomain[d].c;
    S.stats.domainScores[d].total+=byDomain[d].t;
  }
  save();
  window._lastExam={qs:e.qs,ans:e.ans,optMaps:e.optMaps};
  renderExamResults(correct,total,scaled,byDomain,timeUp);
}

      "</div>" +
      "<div class='prog-bar'><div class='prog-fill' style='width:"+sc+"%;background:"+DOMAIN_COLORS[d]+"'></div></div>" +
    "</div>";
  }
  render(
    "<div class='pg' style='text-align:center'>" +
    "<div class='card2' style='margin-bottom:20px;padding:36px 24px'>" +
      "<div style='font-size:48px;margin-bottom:12px'>"+(pass?"🎉":"📚")+"</div>" +
      "<div style='font-family:Syne,sans-serif;font-size:64px;font-weight:800;color:"+(pass?"var(--gn)":"var(--rd)")+"'>"+scaled+"</div>" +
      "<div style='font-size:12px;color:var(--tx4);margin-bottom:4px'>Scaled Score (200–1000 · Pass: 700)</div>" +"<div style='font-size:20px;font-weight:700;color:"+(pass?"var(--gn)":"var(--rd)")+";margin-bottom:8px'>"+(pass?"✅ PASS":"❌ NEEDS WORK")+"</div>" +
      "<div style='font-size:15px;color:var(--tx2)'>"+correct+"/"+total+" correct ("+pct+"%)</div>" +
      (timeUp?"<div style='font-size:12px;color:var(--rd);margin-top:6px'>⏱ Time expired</div>":"") +
    "</div>" +
    "<div class='card' style='margin-bottom:16px;text-align:left'>" +
      "<h2 class='stitle'>Domain Breakdown</h2>" +
      domRows +
    "</div>" +
    "<div id='missed-review' style='display:none;margin-bottom:16px;text-align:left'></div>" +
    "<div style='display:flex;gap:10px;justify-content:center;flex-wrap:wrap'>" +
      "<button class='btn btn-p' onclick='renderExamHome();startExam()'>Try Again</button>" +
      "<button class='btn btn-s' id='review-btn' onclick='toggleMissedReview()'>📖 Review Missed</button>" +
      "<button class='btn btn-s' onclick='renderExamHome()'>Back</button>" +
      "<button class='btn btn-s' onclick=\"setTab('home')\">Home</button>" +
    "</div>" +
  "</div>");
}

function toggleMissedReview(){
  var el=document.getElementById("missed-review");
  var btn=document.getElementById("review-btn");
  if(!el||!window._lastExam)return;
  if(el.style.display==="none"){
    var ex=window._lastExam;
    var items="<div class='card' style='margin-bottom:16px'><div class='stitle' style='color:var(--rd)'>❌ Missed Questions</div>";
    var count=0;
    for(var i=0;i<ex.qs.length;i++){
      var q=ex.qs[i];
      var notAnswered=ex.ans[i]===undefined;
      if(!notAnswered){
        var selOrig=ex.optMaps[i][ex.ans[i]];
        if(selOrig===q.a)continue;
      } else {
        var selOrig=-1;
      }
      count++;
      var opts2="";
      if(notAnswered){
        opts2+="<div style='padding:8px 12px;margin-bottom:6px;border-radius:8px;border:1.5px solid var(--ye);background:var(--ye0);font-size:12px;color:var(--ye)'><b>⚠️ Not answered</b> — you skipped this question</div>";
      }
      for(var di=0;di<4;di++){
        var origIdx=ex.optMaps[i][di];
        if(origIdx>=q.o.length)continue;
        var isC=origIdx===q.a;
        var isW=!notAnswered&&origIdx===selOrig&&!isC;
        opts2+="<div style='padding:6px 10px;margin-bottom:4px;border-radius:8px;border:1.5px solid "+(isC?"var(--gn)":isW?"var(--rd)":"var(--bd)")+";background:"+(isC?"var(--gn0)":isW?"var(--rd0)":"transparent")+";font-size:12px'>" +
          "<b>"+["A","B","C","D"][di]+".</b> "+q.o[origIdx]+(isC?" ✅":isW?" ❌":"")+"</div>";
      }
      items+="<div style='border-bottom:1px solid var(--bd);padding-bottom:12px;margin-bottom:12px'>" +
        "<div style='font-size:13px;font-weight:600;color:var(--tx);margin-bottom:8px'><span style='background:var(--rd0);color:var(--rd);padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-right:6px'>Q"+(i+1)+" D"+q.d+"</span>"+q.q+"</div>" +
        opts2 +
        "<div style='margin-top:6px;padding:8px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx3)'>💡 "+q.e+"</div>" +
      "</div>";
    }
    if(count===0)items+="<p style='color:var(--gn);text-align:center;padding:20px'>🎉 No missed questions!</p>";
    items+="</div>";
    el.innerHTML=items;
    el.style.display="block";
    if(btn)btn.textContent="Hide Review";
    el.scrollIntoView({behavior:"smooth"});
  } else {
    el.style.display="none";
    if(btn)btn.textContent="📖 Review Missed";
  }
}
window.toggleMissedReview=toggleMissedReview;

// ── FLASHCARDS ────────────────────────────────────────────────────────────────
function renderCardsHome(){
  render(
    "<div class='pg'>" +
    "<h2 class='stitle'>Flashcards</h2>" +
    "<div class='card'>" +
      "<div style='font-weight:700;margin-bottom:12px'>"+FLASH_CARDS.length+" cards covering all 5 domains</div>" +
      "<button class='btn btn-p btn-full' style='margin-bottom:10px' onclick='renderCards()'>Start All Flashcards</button>" +
      "<button class='btn btn-s btn-full' onclick='renderCards(true)'>Shuffle Mode</button>" +
    "</div>" +
  "</div>");
}
window.renderCardsHome=renderCardsHome;

var _fcIdx=0,_fcCards=[];
function renderCards(shuf){
  _fcCards=shuf?shuffle([].concat(FLASH_CARDS)):[].concat(FLASH_CARDS);
  _fcIdx=0;showCard();
}
window.renderCards=renderCards;
function showCard(){
  if(_fcIdx>=_fcCards.length){
    render(
      "<div class='pg' style='text-align:center'>" +
      "<div class='card2' style='padding:40px;margin-bottom:20px'>" +
        "<div style='font-size:48px;margin-bottom:12px'>🎉</div>" +
        "<div style='font-family:Syne,sans-serif;font-size:28px;font-weight:800'>All Done!</div>" +
        "<div style='color:var(--tx3);margin-top:8px'>"+FLASH_CARDS.length+" cards reviewed</div>" +
      "</div>" +
      "<div style='display:flex;gap:10px;justify-content:center'>" +
        "<button class='btn btn-p' onclick='renderCards()'>Again</button>" +
        "<button class='btn btn-s' onclick='renderCards(true)'>Shuffle</button>" +
        "<button class='btn btn-s' onclick='renderCardsHome()'>Back</button>" +
      "</div>" +
    "</div>");
    return;
  }
  var c=_fcCards[_fcIdx];
  var pct=Math.round(_fcIdx/FLASH_CARDS.length*100);
  render(
    "<div class='pg'>" +
    "<div class='row' style='margin-bottom:14px'>" +
      "<button class='btn btn-s' onclick='renderCardsHome()'>← Back</button>" +
      "<div style='flex:1'><div class='prog-bar'><div class='prog-fill' style='width:"+pct+"%'></div></div></div>" +
      "<span style='font-size:12px;color:var(--tx3)'>"+(_fcIdx+1)+"/"+FLASH_CARDS.length+"</span>" +
    "</div>" +
    "<div class='fc' id='fc' onclick='flipCard()'>" +
      "<div class='fc-inner'>" +
        "<div class='fc-front'>" +
          "<div style='text-align:center'>" +
            "<div style='font-size:11px;color:var(--tx3);margin-bottom:12px;text-transform:uppercase;letter-spacing:1px'>Tap to reveal</div>" +
            "<div style='font-family:Syne,sans-serif;font-size:24px;font-weight:800'>"+c.front+"</div>" +
          "</div>" +
        "</div>" +
        "<div class='fc-back'>" +
          "<div style='text-align:center;font-size:15px;line-height:1.7;color:var(--tx)'>"+c.back+"</div>" +
        "</div>" +
      "</div>" +
    "</div>" +
    "<div style='display:flex;gap:10px;margin-top:14px'>" +
      "<button class='btn btn-s' style='flex:1' onclick='prevCard()'>← Prev</button>" +
      "<button class='btn btn-p' style='flex:2' onclick='nextCard()'>Next →</button>" +
    "</div>" +
  "</div>");
}
window.flipCard=function(){var el=document.getElementById("fc");if(el)el.classList.toggle("flipped");};
window.nextCard=function(){_fcIdx++;showCard();};
window.prevCard=function(){if(_fcIdx>0){_fcIdx--;showCard();}};

function renderLearn(){
  var items="";
  for(var d=1;d<=5;d++){
    var qcnt=QZ.filter(function(q){return q.d==d;}).length;
    items+="<div class='card' style='border-left:3px solid "+DOMAIN_COLORS[d]+";cursor:pointer;margin-bottom:10px' onclick='renderDomainGuide("+d+")'>" +
      "<div style='display:flex;align-items:center;justify-content:space-between'>" +
        "<div>" +
          "<div style='font-weight:700'>"+DOMAIN_NAMES[d]+"</div>" +
          "<div style='font-size:12px;color:var(--tx3);margin-top:3px'>"+DOMAIN_WEIGHTS[d]+"% of exam · "+qcnt+" questions</div>" +
        "</div>" +
        "<span style='color:var(--tx4);font-size:18px'>&#8594;</span>" +
      "</div>" +
    "</div>";
  }
  render("<div class='pg'><div class='stitle'>Domain Guide</div>"+items+"</div>");

window.renderLearn=renderLearn;

function renderDomainGuide(d){
  var prevBtn=d>1?"<button class='btn btn-s' onclick='renderDomainGuide("+(d-1)+")'>&#8592; D"+(d-1)+"</button>":"";
  var nextBtn=d<5?"<button class='btn btn-s' onclick='renderDomainGuide("+(d+1)+")'>D"+(d+1)+" &#8594;</button>":"";
  render(
    "<div class='pg'>" +
    "<button class='btn btn-s' onclick='renderLearn()' style='margin-bottom:16px'>&#8592; Back to Domains</button>" +
    "<div class='card' style='border-left:3px solid "+DOMAIN_COLORS[d]+"'>" +
      "<div style='background:"+DOMAIN_BG[d]+";border-radius:8px;padding:10px 14px;margin-bottom:16px;display:inline-block'>" +
        "<span style='color:"+DOMAIN_COLORS[d]+";font-weight:700;font-size:13px'>Domain "+d+" · "+DOMAIN_WEIGHTS[d]+"% of exam</span>" +
      "</div>" +
      "<div style='font-size:14px;line-height:1.8;color:var(--tx2)'>"+DOMAIN_GUIDE[d]+"</div>" +
    "</div>" +
    "<div style='margin-top:16px;display:flex;gap:10px'>" +
      "<button class='btn btn-p' onclick='startQuiz("+d+")'>Practice D"+d+" &#8594;</button>" +
      prevBtn+nextBtn+
    "</div>" +
  "</div>");
}
window.renderDomainGuide=renderDomainGuide;

// ── INIT ──────────────────────────────────────────────────────────────────────
function initApp(){
  var today=new Date().toDateString();
  if(S.stats.lastDate!==today){
    var yesterday=new Date(Date.now()-86400000).toDateString();
    if(S.stats.lastDate===yesterday)S.stats.streak++;
    else S.stats.streak=1;
    S.stats.lastDate=today;
    try{save();}catch(e){}
  }
  renderHome();
}

initApp();</script></body></html>
